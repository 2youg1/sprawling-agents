[package]
name = "sprawling-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "One run of a sprawling resident, from dispatch to freeze: turns, tools, replay and confined command execution."

[lib]
name = "runtime"

[dependencies]
# An MCP image block carries its picture base64-encoded, and the
# connector step decodes it once to store the bytes (8-27-10).
base64.workspace = true
# Every process exec starts is configured by `child::command`: off the
# city's console, in a process group of its own, without the city's
# secrets (`Sprawling/runtime/spec/Tools/Exec.lean` D96).
child = { workspace = true }
kernel = { workspace = true }
storage = { workspace = true }
# A picture a tool answers with travels only if its format and sides are
# read from its own bytes. Header-only dimension reads cover the four
# formats kernel::ImageType carries; OCR keeps its PNG-only decoder below.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
png.workspace = true
# search's `glob`: ripgrep's own glob matcher, so `*.{ts,tsx}` and
# `src/**/*.rs` mean what they mean to Claude Code's Grep
# (`Sprawling/runtime/spec/Tools/Search.lean` D117).
globset = { version = "0.4", default-features = false }
# search's `pattern`: the engine ripgrep uses by default, which matches
# with finite automata and never backtracks (`Sprawling/runtime/spec/Tools/Search.lean` D120).
regex = "1"
# search's `pattern` parsed into the syntax tree `regex` itself builds,
# to refuse a pattern that spells a line break (`Sprawling/runtime/spec/Tools/Search.lean` D121).
regex-syntax = "0.8"
# File identity (volume and file index on Windows, device and inode
# elsewhere): `read` compares the handle it opened with the file now at
# the judged location, which std exposes only on unstable APIs.
same-file = "1"
serde.workspace = true
serde_json.workspace = true
# The sieve's filter table is a TOML file in the reserved
# subtree, and its shape has one reader.
toml.workspace = true
# One Job Object per run, so a run's whole process tree can be read
# (`Sprawling/runtime/Spec.lean` §8-13-3); the crate's public surface is safe.
[target.'cfg(target_os = "macos")'.dependencies]
# F_GETPATH queries the opened descriptor, independent of replaceable names.
rustix = { version = "1.1.5", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
win32job = { workspace = true }
# A file's identity for an edit's read stamp (volume serial number and
# file index), which std exposes only on an unstable API
# (`Sprawling/runtime/spec/Tools/Edit.lean` §8-64).
winapi-util = { workspace = true }
# Each run's job takes a weighted CPU share through the one FFI seam
# (`Sprawling/runtime/spec/Tools/Exec.lean` D29).
desktop_ffi = { workspace = true }
# The MSVC discovery rustc and cc use, run outside the AppContainer that
# cannot read Visual Studio's instance state; already in the lock beneath
# cc (`Sprawling/runtime/spec/Tools/Exec/NativeWindows.lean` D60).
find-msvc-tools = "0.1.14"
# Where an open handle really lies (`GetFinalPathNameByHandleW`), which
# std answers only through `canonicalize`, an open of its own: `read`
# judges the handle it reads from (`Sprawling/runtime/spec/Tools/Read.lean`
# D113). The unsafe call is inside the crate.
winx = "0.36.4"

[features]
conformance = ["kernel/conformance"]

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
tempfile.workspace = true
trybuild.workspace = true

[lints]
workspace = true
