[package]
name = "sprawling-calyx"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
publish.workspace = true
description = "Calyx, the production terminal shell for sprawling and Mei."
keywords = ["agents", "terminal", "cli", "tui"]
categories = ["command-line-utilities"]

[lib]
name = "calyx"
path = "src/lib.rs"

[dependencies]
accounting = { workspace = true }
base64 = { workspace = true }
child = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
console_ffi = { workspace = true }
getrandom = { workspace = true }
kernel = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
wire = { workspace = true, features = ["server"] }

[lints]
workspace = true
