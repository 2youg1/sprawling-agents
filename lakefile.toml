name = "sprawling"
defaultTargets = ["Spec"]

# No `require` line, and that is the decision rather than an omission.
# Everything below is the toolchain's own: `Lean.Data.Json` reads the wire,
# `IO.Process` runs the door, `IO.FS` holds the ground, and `mkStdGen` draws the
# traces. A scheduled checker that resolved a package graph before it could run
# would go red for reasons belonging to a registry rather than to this product,
# and a red that means nothing is worse than no run.
# crates/adversary/Spec.lean section 13 records what that costs.

[leanOptions]
# A warning left standing is a finding nobody read.
warningAsError = true
# A `sorry` is a proof obligation somebody skipped. In a checker it would be an
# assertion that passes without being true.
debug.skipKernelTC = false

# Every specification enters through its own `<dir>.Spec` glob, plus
# `<dir>.spec.+` when it has parts (ARCHITECTURE.md section 11,
# "Specifications in Lean"). There is deliberately no recursive `crates.+`:
# that would also build the checker's implementation and any generated Lean
# file below it, while `just models` must build only the specifications.
[[lean_lib]]
name = "Spec"
globs = [
  "Mei.Spec",
  "Mei.spec.+",
  "crates.accounting.Spec",
  "crates.accounting.spec.+",
  "crates.adversary.Spec",
  "crates.adversary.spec.+",
  "crates.agent_protocols.Spec",
  "crates.agent_protocols.spec.+",
  "crates.benchstat.Spec",
  "crates.benchstat.spec.+",
  "crates.browser.Spec",
  "crates.browser.spec.+",
  "crates.child.Spec",
  "crates.city.Spec",
  "crates.city.spec.+",
  "crates.citysim.Spec",
  "crates.citysim.spec.+",
  "crates.collab.Spec",
  "crates.collab.spec.+",
  "crates.console_ffi.Spec",
  "crates.desktop.Spec",
  "crates.desktop.spec.+",
  "crates.desktop.ffi.Spec",
  "crates.documents.Spec",
  "crates.documents.spec.+",
  "crates.gateway.Spec",
  "crates.gateway.spec.+",
  "crates.kernel.Spec",
  "crates.kernel.spec.+",
  "crates.remote_access.Spec",
  "crates.remote_access.spec.+",
  "crates.runtime.Spec",
  "crates.runtime.spec.+",
  "crates.sprawling.Spec",
  "crates.sprawling.spec.+",
  "crates.storage.Spec",
  "crates.storage.spec.+",
  "crates.wire.Spec",
  "crates.wire.spec.+",
  "crates.xtask.Spec",
  "crates.xtask.spec.+",
  "client.Spec",
  "client.spec.+",
]

# The adversarial checker (crates/adversary/Spec.lean). It imports no
# specification: it judges the binary from outside and must not import a
# restatement of the rules it is judging.
[[lean_lib]]
name = "Sprawling"
srcDir = "crates/adversary/src"

[[lean_exe]]
name = "adversary"
root = "Main"
srcDir = "crates/adversary/test"
# The served cities are read by a task each. Lean's IO tasks need real threads
# behind them: a reader blocked on a pipe would otherwise hold the whole
# runtime, and the city it was draining fills its buffer and stops answering.
supportInterpreter = true

# The acceptance world (crates/adversary/Spec.lean section 9): the walk
# a stranger takes with a release archive's binary, against the stand-in
# provider `just acceptance` starts beside it. An executable of its own because
# it is never part of `just adversary`: it needs an archive and a provider
# that run does not have.
[[lean_exe]]
name = "acceptance"
root = "Acceptance"
srcDir = "crates/adversary/test"
# The same reason as `adversary`: the walk waits on a dispatch in a task of
# its own while it watches the history, and that task needs a real thread.
supportInterpreter = true
