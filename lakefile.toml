name = "sprawling"
defaultTargets = ["Spec"]

# No `require` line, and that is the decision rather than an omission.
# Everything below is the toolchain's own: `Lean.Data.Json` reads the wire,
# `IO.Process` runs the door, `IO.FS` holds the ground, and `mkStdGen` draws the
# traces. A scheduled checker that resolved a package graph before it could run
# would go red for reasons belonging to a registry rather than to this product,
# and a red that means nothing is worse than no run.
# tools/adversary/Spec.lean section 13 records what that costs.

[leanOptions]
# A warning left standing is a finding nobody read.
warningAsError = true
# A `sorry` is a proof obligation somebody skipped. In a checker it would be an
# assertion that passes without being true.
debug.skipKernelTC = false

# Every crate's specification: `crates/<dir>/Spec.lean` and its parts under
# `crates/<dir>/spec/` (ARCHITECTURE.md section 11, "Specifications in Lean"),
# the checker's own, `tools/adversary/Spec.lean` and `tools/adversary/spec/`,
# the simulator's, `tools/citysim/Spec.lean` and `tools/citysim/spec/`, and the
# gates', `tools/xtask/Spec.lean` and `tools/xtask/spec/`.
# `just models` builds this library inside `just check`; it builds none of the
# checker, which no specification imports. When the specification of
# something outside `crates/` moves to Lean, the same change adds its two
# globs here, `<dir>.Spec` and `<dir>.spec.+`, and never `tools.+`, `client.+`
# or `desktop.+`: those trees hold build output a recursive glob would walk.
[[lean_lib]]
name = "Spec"
globs = ["crates.+", "tools.adversary.Spec", "tools.adversary.spec.+", "tools.citysim.Spec", "tools.citysim.spec.+", "tools.xtask.Spec", "tools.xtask.spec.+"]

# The adversarial checker (tools/adversary/Spec.lean). It imports no
# specification: it judges the binary from outside and must not import a
# restatement of the rules it is judging.
[[lean_lib]]
name = "Sprawling"
srcDir = "tools/adversary/src"

[[lean_exe]]
name = "adversary"
root = "Main"
srcDir = "tools/adversary/test"
# The served cities are read by a task each. Lean's IO tasks need real threads
# behind them: a reader blocked on a pipe would otherwise hold the whole
# runtime, and the city it was draining fills its buffer and stops answering.
supportInterpreter = true

# The acceptance world (tools/adversary/Spec.lean section 9): the walk
# a stranger takes with a release archive's binary, against the stand-in
# provider `just acceptance` starts beside it. An executable of its own because
# it is never part of `just adversary`: it needs an archive and a provider
# that run does not have.
[[lean_exe]]
name = "acceptance"
root = "Acceptance"
srcDir = "tools/adversary/test"
# The same reason as `adversary`: the walk waits on a dispatch in a task of
# its own while it watches the history, and that task needs a real thread.
supportInterpreter = true
