<html lang="en">
<head>
<meta charset="utf-8">
<!-- The page draws under a phone's notch and home indicator
     (viewport-fit), and the shell's frame keeps its own edges clear of
     them; an engine that can shrink the layout viewport for the soft
     keyboard does (interactive-widget), and on one that cannot the
     shell follows the visual viewport (client-SPEC 4-52). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<!-- The face the page is drawn with, fetched beside the stylesheet
     rather than after it. theme.css declares it font-display:
     optional, which gives a face one short moment to arrive and never
     swaps it in afterwards; without this line that moment begins
     only once the stylesheet has been parsed, and a cold load would set
     the whole visit in the fallback face. crossorigin is not decoration
     on a font preload: a fetch made without it is a different fetch from
     the one the stylesheet makes, so the file would be downloaded twice
     and the preload would have bought nothing. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="./fonts/GeistMono-Variable.woff2">
<!-- What lets a phone put this page on its home screen: the manifest
     and its icon, copied into the bundle as they are (client-SPEC 4-57). -->
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>sprawling</title>
</head>
<body>
<div id="main"></div>
<script type="module" src="./main.ts"></script>
</body>
</html>
