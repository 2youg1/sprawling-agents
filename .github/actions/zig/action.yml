# The Zig `crates/desktop/ffi/zig-version` pins, which builds the desktop
# server's Zig leaf (`crates/desktop/Spec.lean` section 8-12). The leaf is compiled
# on Windows targets only, so on any other runner this action installs
# nothing: a Linux or macOS build of the workspace never starts `zig`.
#
# The version is read from the pin file at run time, so a new Zig is an
# edit to that one file; `build.rs` refuses a `zig` of another version,
# and the last step asks `zig version` so a failed install stops the job
# here rather than as a build-script error later.
name: zig
description: >-
  Install the Zig crates/desktop/ffi/zig-version pins on a Windows runner, and
  prove zig answers with that version.
runs:
  using: composite
  steps:
    - name: the pinned version
      id: pin
      if: runner.os == 'Windows'
      shell: bash
      run: echo "version=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/crates/desktop/ffi/zig-version")" >> "$GITHUB_OUTPUT"
    - uses: mlugg/setup-zig@v2
      if: runner.os == 'Windows'
      with:
        version: ${{ steps.pin.outputs.version }}
    - name: zig answers with the pinned version
      if: runner.os == 'Windows'
      shell: bash
      run: test "$(zig version)" = "${{ steps.pin.outputs.version }}"
