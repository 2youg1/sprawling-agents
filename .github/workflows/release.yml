# The deliverable, built by a machine rather than by hand.
#
# Every symptom this workflow exists to prevent came from one cause: a
# release artifact whose provenance nobody could check. So the archive is
# assembled here, out of a tree that passed the gates, on each platform it
# claims to support - and `xtask package` refuses a binary carrying only
# the page shell, which is the defect that survives a green build and
# reaches a person as an empty browser window.
#
# C1 note: this workflow does invoke the node toolchain family, in three
# places - bun builds the client that `verify` judges and that every
# archive embeds, and npm publishes the package channel. The zero-js gate
# that would have asserted otherwise was deleted for the reason ci.yml
# records: it excluded an architecture rather than a defect.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  # Same-commit validation, including the cache environment, belongs to CI.
  # D27 in tools/xtask/Spec.lean preserves the existing release blocking scope.
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      release-validation: true

  # Advisories can change without a source change, so every release reads them.
  advisories:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain
        run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: advisories
        run: cargo deny check advisories

  # Three platforms, and the third is static on purpose.
  #
  # The static Linux row rests on a premise that has held throughout:
  # NixOS has no `/lib64/ld-linux-x86-64.so.2`, so a dynamically linked
  # ubuntu artifact does not start there at all, while one static binary
  # covers NixOS, Alpine, old distributions and containers at once.
  #
  # It was held back once, and by a real contradiction rather than a
  # missing package: `keyring`'s secret-service backend talks D-Bus, so
  # the tree reached `libdbus-sys`, whose build script asks pkg-config
  # for a library built for the target and gets refused across a target
  # boundary. Installing `libdbus-1-dev` would have offered the host's
  # glibc D-Bus to a static musl link. **A static Linux binary and a
  # D-Bus credential store cannot both be true** - so the credential
  # question was answered before this row returned, and answered in the
  # code rather than here: the Linux build keeps a key in the kernel's
  # own keyring through `keyring`'s `linux-native` (keyutils) feature,
  # which is a syscall and needs no bus, and it reports that key as
  # `Persistence::ThisBoot` because a reboot empties it (`crates/gateway/Spec.lean`
  # §8-4). `libdbus-sys` is out of the lockfile entirely.
  #
  # Archive runs beside validation and advisories; publish waits for all
  # three, so their wall clock is the slowest branch rather than their sum.
  archive:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: ""
          - os: macos-latest
            target: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    # `aws-lc-sys` compiles AWS-LC's own C, and `libgit2-sys` and
    # `libz-sys` compile theirs, so a musl build needs a C compiler that
    # targets musl rather than the runner's glibc gcc. `musl-gcc` is what
    # `musl-tools` installs. Declared for the whole job because only the
    # row that builds this triple ever reads a `CC_<triple>` variable;
    # the two host rows never look at it.
    #
    # No bindgen is needed: aws-lc-sys 0.44.0 ships
    # `src/x86_64_unknown_linux_musl_crypto.rs` and lists that triple in
    # its pregenerated-bindings table, so the rustls backend stays
    # `aws-lc-rs` and all three archives keep one crypto implementation.
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      # Which release these binaries are. `build.rs` declares the
      # variable and `kernel::Release` decodes it, so `sprawling status`
      # names the release it came from and `status --check` has something
      # to compare the registry against. A build that does not set it -
      # every `cargo build` anybody runs - reports itself as built from
      # source rather than guessing at a version it does not have.
      SPRAWLING_RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain
        run: rustup show
      # The Zig the desktop's leaf is built with, on the Windows row; the
      # action installs nothing on the other two (`crates/desktop/Spec.lean` 8-12).
      - uses: ./.github/actions/zig
      # The pinned toolchain installs the host target only, and adding
      # `targets` to `rust-toolchain.toml` would make every job on every
      # platform download a musl std nothing else compiles against.
      - name: the musl target and a C compiler that targets musl
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      # The client is built by bun, which `just build-web` drives; the
      # release recipe depends on it, so the archive cannot be assembled
      # without the bundle inside the binary.
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # One step for all three rows. `just package` takes the triple the
      # matrix names and passes it down to `cargo xtask package`, which
      # reads `target/<triple>/release` and puts the triple in the archive
      # name (tools/xtask/Spec.lean §8-11). An empty triple is the host
      # build, whose two archive names are what they always were.
      - name: build the client, the binary, and the archive
        shell: bash
        run: just package "${{ matrix.target }}"
      # The archive goes through the door a person uses before it is
      # uploaded: install.sh asks a release list served from 127.0.0.1,
      # downloads, verifies and places the binary, and the placed file is
      # compared byte for byte with the archive's and asked its version.
      # Windows installs through install.ps1, which this step does not run
      # (`crates/sprawling/Spec.lean` §8-94).
      - name: install the archive with install.sh from a loopback release
        if: runner.os != 'Windows'
        shell: bash
        run: sh .github/install-loopback.sh target/package
      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ runner.os }}${{ matrix.target && format('-{0}', matrix.target) || '' }}
          path: target/package/*.zip
          if-no-files-found: error

  publish:
    needs: [verify, advisories, archive]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `id-token: write` lets the attestation step mint the OIDC token that
    # Sigstore exchanges for a short-lived signing certificate, so no
    # private key exists anywhere; `attestations: write` lets it store the
    # result against this repository. `xtask artifact` reads this job and
    # refuses it when either grant, the step, or its order is missing.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: &release-archives archive-*
          path: assets
          merge-multiple: true
      # Before the archives are attached, never after: a failure here then
      # stops the release instead of leaving archives on the tag that
      # `gh attestation verify` cannot vouch for. The glob is word for word
      # the one `gh release create` attaches below.
      - name: attest where each archive was built
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: assets/*.zip
      - name: attach the archives to the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ls -la assets
          # Re-cutting a tag is a legitimate thing to do, and this step
          # could only ever run once: `gh release create` refuses a tag
          # that already carries a release, so a corrected build of the
          # same version failed at the last step with every archive
          # already built and verified. Replaced rather than appended to,
          # so what hangs off a tag is always what that tag's tree
          # produced - a release holding archives from two different
          # trees is worse than one that failed loudly.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release delete "${GITHUB_REF_NAME}" --yes
          fi
          # Pre-release is the state this project is in, and it was being
          # set by hand after every publish - which means it was one
          # forgotten click away from a pre-alpha presenting itself as the
          # release a person should download. The day that stops being
          # true, this flag is what gets deleted, deliberately.
          # The notice is authored; the line pointing at this tag's
          # changelog entry is built here, for two reasons that agree.
          # A repository URL written out in full is an unbroken run of
          # more than twenty token bytes, which is what `xtask secret`
          # refuses on sight - correctly, since it cannot know a public
          # address from a credential. And built from this run's own
          # context it is one fewer place that has to agree about where
          # this repository lives.
          #
          # Relative links are why this is a full URL rather than a
          # short one. A release body resolves them against
          # `<repo>/blob/<tag>/`, so `CHANGELOG.md` renders as a path
          # inside the tag directory and 404s; v0.0.4 shipped exactly
          # that broken link. Only an absolute URL survives.
          #
          # The fragment is GitHub's own heading slug, which lowercases
          # and drops punctuation: `v0.0.5-Pre-alpha-260912` addresses
          # the heading of the same name as `v005-pre-alpha-260912`.
          anchor=$(printf '%s' "${GITHUB_REF_NAME}" | tr 'A-Z' 'a-z' | tr -d '.')
          notes="${RUNNER_TEMP}/release-notes.md"
          cp .github/release-notes.md "${notes}"
          printf '\n📋 What changed / 本版改动：[CHANGELOG.md](%s/%s/blob/main/CHANGELOG.md#%s)\n' \
            "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${anchor}" >>"${notes}"
          # Who this version came from, in GitHub's own words: the pull requests
          # merged since the previous tag, and the contributors who were new
          # among them. The changelog says what changed and is written by hand;
          # this says who, and cannot be. `gh release create --generate-notes`
          # would replace the authored notice rather than follow it, so the
          # generated half is fetched and appended.
          printf '\n' >>"${notes}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" -q .body >>"${notes}"
          gh release create "${GITHUB_REF_NAME}" assets/*.zip \
            --title "sprawling ${GITHUB_REF_NAME}" \
            --prerelease \
            --notes-file "${notes}"

  # The same binaries, reachable by `bunx sprawling` instead of by
  # downloading a zip. `cargo xtask channel` takes this tag's own
  # archives apart and writes one package per platform plus a root that
  # depends on them optionally, so npm and bun fetch exactly one binary.
  #
  # **No token lives here.** The registry is told once per package that
  # this repository's `release.yml` may publish it, and the job then asks
  # GitHub for a short-lived OIDC token that npm exchanges at publish
  # time. A long-lived token would have to be rotated on npm's schedule
  # rather than on this project's - a write-enabled granular token
  # expires within ninety days at the outside - so the release that
  # breaks would always be the one nobody was watching.
  #
  # **What this cannot do is create a package.** npm requires a package
  # to exist before a trusted publisher can be configured for it, so the
  # first version under each name is published by a person and every
  # version after it by this job. A name that reaches a release without
  # that first publish stops here rather than inventing a way through.
  # The three platform packages moved into the `@sprawling` scope, which
  # made each of them a new name: each needs that one publish by a person
  # and its own trusted publisher before this job can carry it.
  #
  # After publish, never during: it takes the archives from the release
  # this run just made, so a failure here leaves the download channel
  # already standing rather than half a release.
  channel:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A job that declares permissions declares all of them, so the
    # workflow's own `contents: read` is restated rather than inherited.
    # `id-token: write` is what lets this job mint the OIDC token, and
    # npm answers ENEEDAUTH without it.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain
        run: rustup show
      - uses: actions/download-artifact@v8
        with:
          pattern: *release-archives
          path: assets
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      # Node 22 ships npm 10, which cannot exchange an OIDC token at all:
      # trusted publishing arrived in npm 11.5.1.
      - name: npm new enough to exchange an OIDC token
        run: npm install -g npm@latest
      - name: assemble the packages from this tag's archives
        run: |
          cargo xtask channel --tag "${GITHUB_REF_NAME}" \
            --assets assets --out target/npm
      # The shim is the one piece of this channel that runs on a person's
      # machine, so it is executed here rather than only read: a syntax
      # error in it would otherwise be found by the first person to type
      # `bunx sprawling`.
      - name: the shim parses and refuses honestly
        run: node --check target/npm/sprawling/bin/sprawling.js
      - name: publish
        shell: bash
        run: |
          set -euo pipefail
          # Platform packages first: the root package names them as
          # optional dependencies at an exact version, and a root that
          # reaches npm before they do is a root nobody can install.
          #
          # `--tag latest`, and npm leaves no third choice: it refuses a
          # prerelease version carrying no dist-tag. Every release of
          # this project is a pre-release, so `--tag pre` would leave
          # these packages with no `latest` at all, and `bunx sprawling`
          # would fail to resolve rather than install a pre-alpha -
          # install.sh carries the same lesson about the download
          # channel. The version string carries `-pre.<YYMMDD>` and the
          # release notes say not to use it; the dist-tag is not where
          # that warning belongs.
          #
          # The platform packages are scoped, so they sit one directory
          # deeper than the root package and this enumerates that level
          # rather than every child of `target/npm`.
          #
          # `--provenance` is stated rather than left to the default.
          # npm documents provenance as automatic under trusted
          # publishing, and npm/cli#8730 collects reports of publishes
          # that fail until the flag is passed. Both readings agree on
          # what the flag does when provenance is already on: nothing.
          # They disagree only about the release where this job runs
          # last, after the GitHub release is already public - so the
          # flag is carried for the reading where it is load-bearing.
          # Its own two conditions hold: this repository is public, and
          # `xtask channel` writes `repository` into every package it
          # assembles rather than only into the root.
          for dir in target/npm/@sprawling/*/; do
            npm publish "$dir" --access public --tag latest --provenance
          done
          npm publish target/npm/sprawling --access public --tag latest --provenance

  # The same source, reachable by `cargo install sprawling` and, through the
  # binstall metadata in `crates/sprawling/Cargo.toml`, by `cargo binstall
  # sprawling`, which fetches the archive this tag's release carries.
  #
  # **No token lives here either.** Each publishable package is registered
  # on crates.io as trusted to this repository's `release.yml`, and the
  # auth action exchanges this job's OIDC token for one that lasts thirty
  # minutes and is revoked when the job ends. As with npm, a package name
  # must exist on crates.io before it can be registered, so a new crate is
  # published once by a person first.
  #
  # Last of all, after npm: a crates.io version can never be replaced, and
  # a tag can be re-cut, so nothing irreversible happens before every other
  # channel has stood up (`crates/sprawling/Spec.lean` §8-157). Only a tag
  # publishes, because the binstall address is built from the tag name and
  # a dispatch from a branch has none.
  crates:
    needs: channel
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain
        run: rustup show
      # `sprawling` embeds the client bundle, which its `include` list
      # carries into the `.crate`; without it every `cargo install` would
      # build a binary that serves the page shell only.
      - uses: ./.github/actions/client-artifacts
      # A re-cut tag, or a run that stopped halfway, finds some versions
      # already on crates.io; those are left out rather than failing the
      # upload, so a rerun finishes what the last one started.
      - name: the packages whose version crates.io does not have yet
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          packages=""
          while read -r name version; do
            if curl -fsS "https://index.crates.io/${name:0:2}/${name:2:2}/${name}" \
              | jq -e --arg v "${version}" 'select(.vers == $v)' >/dev/null; then
              echo "${name} ${version} is already on crates.io"
            else
              packages="${packages} -p ${name}"
            fi
          done < <(cargo metadata --format-version 1 --no-deps --locked \
            | jq -r '.packages[] | select(.publish == null) | "\(.name) \(.version)"')
          echo "packages=${packages}" >>"${GITHUB_OUTPUT}"
      # binstall's templates cannot spell this project's tag, which carries
      # the maturity and a date, so the manifest says `v{ version }` and the
      # tag this run was cut from replaces it here (`crates/sprawling/Spec.lean`
      # D32). Only `[package.metadata]` changes, which cargo does not build from.
      - name: point the binstall address at this tag
        if: steps.pending.outputs.packages != ''
        shell: bash
        run: |
          set -euo pipefail
          manifest=crates/sprawling/Cargo.toml
          sed -i "s#/releases/download/v{ version }/#/releases/download/${GITHUB_REF_NAME}/#" "${manifest}"
          if grep -q '/releases/download/v{ version }/' "${manifest}" \
            || ! grep -q "/releases/download/${GITHUB_REF_NAME}/" "${manifest}"; then
            echo "::error file=${manifest}::the binstall pkg-url no longer reads releases/download/v{ version }/; fix the substitution with the manifest"
            exit 1
          fi
      - name: exchange this run's OIDC token for a crates.io token
        if: steps.pending.outputs.packages != ''
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      # `--no-verify`: this tree passed `verify` and the `packaged` gate, and
      # a verify build of every package would only compile it again while
      # the thirty-minute token runs down. `--allow-dirty`: the step above
      # rewrote the binstall address. Cargo orders the packages by their
      # dependencies and waits for each to reach the index.
      - name: publish
        if: steps.pending.outputs.packages != ''
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PACKAGES: ${{ steps.pending.outputs.packages }}
        run: |
          set -euo pipefail
          read -ra selected <<<"${PACKAGES}"
          cargo publish --locked --no-verify --allow-dirty "${selected[@]}"
