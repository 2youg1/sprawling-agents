# The runs a person asks for, on the ref they name, and never on a push.
#
# Each answers a question nobody needs answered for every commit, and
# each is too heavy for the desk the project is developed on:
#
#   mutants   the mutants of the lines a branch changed since `base`,
#             in four shards (`just mutants-diff`)
#   sim       the citysim scenarios (`just sim`)
#   shots     every page at 1440 and 1920, dark and light; the PNG files
#             and their index are the artifact `shots-<tree>`
#   release   the shipped Windows binary and its archive (`just package`),
#             the artifact `release-<tree>`, for measurement on the
#             machine the readings belong to
#   pgo       the same binary built with profile-guided optimisation in
#             three stages: an instrumented build of the same tree,
#             toolchain, target and feature set; the training load
#             (`just pgo-train`); the profiles merged and the optimised
#             build. The artifact `release-pgo-<tree>` holds the binary,
#             the archive, the merged profile, its SHA-256 and the exact
#             commands, so a reading against `release-<tree>` names both
#             arms. Dispatch-only: release.yml gains nothing until a
#             reading judges it (END-READING.md, Roadmap P2).
#   fresh     on Windows, macOS and Linux: this tree's archive unpacked
#             into a new directory and walked from install to the first
#             dispatch (`just acceptance`) with the environment a new
#             account has, then `sprawling doctor`; the checklist and
#             logs are the artifact `fresh-<os>-<tree>` (Roadmap G2, G6)
#
# Ask with `gh workflow run on-demand.yml --ref <branch> -f job=<name>`;
# `mutants` also takes `-f base=<ref>` (default `main`). An artifact is
# named for the tree it was built from (`git rev-parse HEAD^{tree}`), so
# a reading taken from a download names the tree it measured.
#
# Every job here runs on Windows, the platform a person reproduces a red
# on, except `fresh`, whose question is asked of all three platforms.
# `pgo` runs on Windows, the platform the readings belong to. The same
# three stages run unchanged on macOS and Linux (the rustc flags and
# `llvm-profdata` from the `llvm-tools` component are the same there,
# `just pgo-train` closes its served city with SIGINT there instead of
# Ctrl-Break; only TRIPLE and the `.exe` suffix change); their release
# builds stay without PGO until a reading on that platform judges it.
name: on-demand
on:
  workflow_dispatch:
    inputs:
      job:
        description: which run
        required: true
        type: choice
        options: [mutants, sim, shots, release, pgo, fresh]
      base:
        description: the ref `mutants` diffs against
        required: false
        default: main
        type: string

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    if: inputs.job == 'mutants'
    name: mutants (${{ matrix.shard }}/4)
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      # The whole history, so the merge base with `base` is in the clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: install pinned toolchain
        run: rustup show
      - uses: ./.github/actions/zig
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutants
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest,just
      - uses: ./.github/actions/client-artifacts
      - name: the mutants of this branch's change
        shell: bash
        run: just mutants-diff "origin/${{ inputs.base }}" "${{ matrix.shard }}/4"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: warn

  sim:
    if: inputs.job == 'sim'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain
        run: rustup show
      - uses: ./.github/actions/zig
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sim
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: the citysim scenarios
        run: just sim

  shots:
    if: inputs.job == 'shots'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gates
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          save-if: false
      - uses: ./.github/actions/client-artifacts
      - id: tree
        shell: bash
        run: echo "sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      # The full Chrome on a hosted runner never exits from a scripted
      # `--screenshot`, while chrome-headless-shell, the build made for
      # windowless use, does; SPRAWLING_BROWSER is the engine's first tier
      # (platforms.yml's render step meets the same engine).
      - name: an engine the screenshots can finish with
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path "$RUNNER_TEMP/engines"
          shell=$(find "$RUNNER_TEMP/engines" -type f -name 'chrome-headless-shell.exe' | head -n 1)
          test -n "$shell"
          echo "SPRAWLING_BROWSER=$shell" >> "$GITHUB_ENV"
      - name: every page, both widths, both schemes
        run: just shots
      # Uploaded on a failed run too: target/shots/engine holds each
      # case's engine stderr, which is what a stalled case is read from.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shots-${{ steps.tree.outputs.sha }}
          path: target/shots
          if-no-files-found: error

  release:
    if: inputs.job == 'release'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain
        run: rustup show
      - uses: ./.github/actions/zig
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          save-if: false
      - uses: ./.github/actions/client-artifacts
      - id: tree
        shell: bash
        run: echo "sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: the binary and the archive a person downloads
        run: just package
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.tree.outputs.sha }}
          path: |
            target/release/sprawling.exe
            target/package/*
          if-no-files-found: error

  # The rustc book's "Profile-guided Optimization" recipe: the host
  # triple is named with `--target` (through `just package <triple>`), so
  # RUSTFLAGS reaches the product and not the build scripts or proc
  # macros. A process that cargo itself starts without `--target` (the
  # `cargo xtask` steps of `just package`) is instrumented too and writes
  # profiles while it builds, so the profile directory is emptied after
  # the build and before the training load.
  pgo:
    if: inputs.job == 'pgo'
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      TRIPLE: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain and llvm-profdata
        shell: bash
        run: |
          rustup show
          rustup component add llvm-tools
      - uses: ./.github/actions/zig
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: ./.github/actions/client-artifacts
      - uses: ./.github/actions/lean
      - id: tree
        shell: bash
        run: |
          echo "sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          pgo="$(cygpath -m "$RUNNER_TEMP")/pgo"
          mkdir -p "$pgo/raw" "$pgo/out"
          echo "dir=$pgo" >> "$GITHUB_OUTPUT"
      - name: "stage 1: the instrumented build"
        shell: bash
        env:
          RUSTFLAGS: -Cprofile-generate=${{ steps.tree.outputs.dir }}/raw
        run: |
          set -euo pipefail
          echo "RUSTFLAGS=$RUSTFLAGS just package $TRIPLE" >> "${{ steps.tree.outputs.dir }}/out/commands.txt"
          just package "$TRIPLE"
          mkdir -p "${{ steps.tree.outputs.dir }}/instrumented"
          cp target/package/*.zip "${{ steps.tree.outputs.dir }}/instrumented/"
          rm -rf "${{ steps.tree.outputs.dir }}/raw"
          mkdir -p "${{ steps.tree.outputs.dir }}/raw"
      - name: "stage 2: the training load"
        shell: bash
        env:
          LLVM_PROFILE_FILE: ${{ steps.tree.outputs.dir }}/raw/sprawling-%p-%m.profraw
        run: |
          set -euo pipefail
          archive=$(ls "${{ steps.tree.outputs.dir }}"/instrumented/*.zip)
          echo "LLVM_PROFILE_FILE=$LLVM_PROFILE_FILE just pgo-train $archive" >> "${{ steps.tree.outputs.dir }}/out/commands.txt"
          just pgo-train "$archive"
          count=$(find "${{ steps.tree.outputs.dir }}/raw" -name '*.profraw' | wc -l)
          echo "profiles written by the training load: $count"
          test "$count" -gt 0
      - name: "stage 3: merge the profiles, then the optimised build"
        shell: bash
        run: |
          set -euo pipefail
          out="${{ steps.tree.outputs.dir }}/out"
          profdata="$(rustc --print sysroot)/lib/rustlib/$TRIPLE/bin/llvm-profdata.exe"
          "$profdata" merge -o "$out/sprawling.profdata" "${{ steps.tree.outputs.dir }}/raw"
          "$profdata" show "$out/sprawling.profdata" > "$out/profile-summary.txt"
          sha256sum "$out/sprawling.profdata" > "$out/sprawling.profdata.sha256"
          echo "llvm-profdata merge -o sprawling.profdata <raw>" >> "$out/commands.txt"
          echo "RUSTFLAGS=-Cprofile-use=$out/sprawling.profdata just package $TRIPLE" >> "$out/commands.txt"
          RUSTFLAGS="-Cprofile-use=$out/sprawling.profdata" just package "$TRIPLE"
          rustc --version --verbose > "$out/toolchain.txt"
          sha256sum "target/$TRIPLE/release/sprawling.exe" > "$out/sprawling.exe.sha256"
          cp -r "$out" target/pgo-out
      - uses: actions/upload-artifact@v7
        with:
          name: release-pgo-${{ steps.tree.outputs.sha }}
          path: |
            target/${{ env.TRIPLE }}/release/sprawling.exe
            target/package/*
            target/pgo-out/*
          if-no-files-found: error

  # A fresh account walks from the archive to the first dispatch (Roadmap
  # G2, and G6 on its Windows row): the archive of this tree is built, then
  # unpacked into a directory nothing else has written, and run with the
  # environment a new machine has - no CARGO_HOME, no RUSTUP_HOME, and a
  # PATH holding only the system directories and the unpacked binary's
  # directory. `sprawling doctor` runs under exactly that environment and
  # a home directory created empty, so its report is what a person who
  # has installed nothing else would read. The walk (`just acceptance`)
  # additionally has just, lake, cargo and, on Windows, Git Bash's
  # /usr/bin on its PATH, because those run the checker and the stand-in
  # provider, which are built before the environment narrows; the city it
  # serves is the archive's binary and nothing from the checkout.
  #
  # What a hosted runner cannot show: its account is an administrator on
  # Windows and has passwordless sudo on macOS and Linux, so "without
  # administrator rights" (D20) is the environment here, not the account;
  # the Windows row prints whether the account is elevated so the reading
  # says which it was. Nor does a runner have a desktop session, so the
  # first-run browser a person sees is not opened (the walk serves with
  # --no-console and reads the city through the wire). The checklist and
  # every log are uploaded on a failed run too.
  fresh:
    if: inputs.job == 'fresh'
    name: fresh (${{ matrix.os }})
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: ""
          - os: macos-latest
            target: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    # The same musl compiler release.yml's archive job names, for the same
    # reason: the Linux archive a person downloads is the static one.
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain
        run: rustup show
      - uses: ./.github/actions/zig
      - name: the musl target and a C compiler that targets musl
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fresh
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          save-if: false
      - uses: ./.github/actions/client-artifacts
      - uses: ./.github/actions/lean
      - id: tree
        shell: bash
        run: echo "sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: the archive a person downloads
        shell: bash
        run: just package "${{ matrix.target }}"
      - name: the checker and the stand-in, built before the environment narrows
        shell: bash
        run: |
          set -euo pipefail
          cargo build --package citysim --bin provider --locked
          lake build Sprawling acceptance
      - name: unpack the archive into a directory nothing else has written
        id: fresh
        shell: bash
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/fresh"
          rm -rf "$fresh"
          mkdir -p "$fresh/unpacked" "$fresh/home" "$fresh/logs"
          archive="$(ls "$PWD"/target/package/*.zip)"
          test "$(echo "$archive" | wc -l)" -eq 1
          unzip -q "$archive" -d "$fresh/unpacked"
          binary="$(find "$fresh/unpacked" -type f \( -name sprawling.exe -o -name sprawling \) | head -n 1)"
          test -n "$binary"
          case "$RUNNER_OS" in
            Windows) system="/c/Windows/System32:/c/Windows:/c/Windows/System32/Wbem:/c/Windows/System32/WindowsPowerShell/v1.0" ;;
            macOS) system="/usr/bin:/bin:/usr/sbin:/sbin" ;;
            Linux) system="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" ;;
          esac
          {
            echo "dir=$fresh"
            echo "archive=$archive"
            echo "binary=$binary"
            echo "path=$system:$(dirname "$binary")"
          } >> "$GITHUB_OUTPUT"
      - name: whether this account is an administrator
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if net session > /dev/null 2>&1; then elevated=yes; else elevated=no; fi
          echo "the account running this row is elevated: $elevated" | tee "${{ steps.fresh.outputs.dir }}/logs/elevation.txt"
      - name: sprawling doctor with nothing else installed
        shell: bash
        run: |
          set -uo pipefail
          home="${{ steps.fresh.outputs.dir }}/home"
          ! command -v cygpath > /dev/null 2>&1 || home="$(cygpath -w "$home")"
          env -u CARGO_HOME -u RUSTUP_HOME HOME="$home" USERPROFILE="$home" \
            PATH="${{ steps.fresh.outputs.path }}" \
            "${{ steps.fresh.outputs.binary }}" doctor --no-color \
            > "${{ steps.fresh.outputs.dir }}/logs/doctor.out" 2> "${{ steps.fresh.outputs.dir }}/logs/doctor.err"
          status=$?
          cat "${{ steps.fresh.outputs.dir }}/logs/doctor.out" "${{ steps.fresh.outputs.dir }}/logs/doctor.err"
          echo "doctor exited $status" | tee "${{ steps.fresh.outputs.dir }}/logs/doctor.exit"
          # A missing develop tool is the report's subject on this PATH, so
          # the exit code is recorded rather than judged; a report that says
          # nothing is the failure.
          test -s "${{ steps.fresh.outputs.dir }}/logs/doctor.out"
      - name: the walk from the archive to the first dispatch
        shell: bash
        run: |
          set -euo pipefail
          tools=""
          for tool in just lake cargo unzip; do tools="$tools:$(dirname "$(command -v "$tool")")"; done
          walk="${{ steps.fresh.outputs.path }}$tools"
          [ "$RUNNER_OS" != Windows ] || walk="/usr/bin:$walk"
          env -u CARGO_HOME -u RUSTUP_HOME PATH="$walk" \
            just acceptance "${{ steps.fresh.outputs.archive }}" 2>&1 | tee "${{ steps.fresh.outputs.dir }}/logs/acceptance.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fresh-${{ matrix.os }}-${{ steps.tree.outputs.sha }}
          path: |
            target/acceptance/checklist.md
            target/acceptance/script.json
            target/acceptance/record.jsonl
            target/acceptance/provider.*
            ${{ runner.temp }}/fresh/logs
          if-no-files-found: warn
