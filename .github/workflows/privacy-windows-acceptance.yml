# Real privacy writes on disposable Windows runners
# (crates/sprawling/spec/Privacy.lean section 16).
#
# The ignored tests in crates/sprawling/tests/privacy_disposable.rs write
# the registry, the user environment and scheduled tasks through the
# built binary's privacy verbs, and refuse to run anywhere but here. The
# step that runs them exports every registry key the controls write before
# and after, in the same step, and fails when a key that existed before
# reads differently after; a key the run created is listed as a residual
# key. Nothing here reads a secret, and the runner is thrown away after.
#
# The `page` job serves the release archive and drives the privacy page
# in a browser through .github/workflows/privacy-ui.mjs: it enters the
# page from the Advanced group's link, checks the page against the city's
# own answer, applies and restores one user-scope and one machine-scope
# control by pressing the page's buttons, reads every write back with
# reg.exe, and keeps the cropped screenshots of every state.
name: privacy-windows-acceptance
on:
  push:
    branches: ["s10/**"]
    paths:
      - crates/sprawling/src/privacy/**
      - crates/sprawling/spec/Privacy*
      - crates/sprawling/spec/Privacy/**
      - crates/sprawling/tests/privacy_disposable.rs
      - .github/workflows/privacy-windows-acceptance.yml
      - .github/workflows/privacy-ui.mjs
      - .github/workflows/acceptance-focus.mjs
      - client/src/views/setup/privacy/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: privacy-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  privacy:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      CARGO_INCREMENTAL: "0"
      SPRAWLING_DISPOSABLE_PRIVACY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/zig
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: privacy-windows-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Record exact source and host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force privacy-evidence | Out-Null
          git rev-parse HEAD | Out-File -Encoding utf8 privacy-evidence/head.txt
          git rev-parse 'HEAD^{tree}' | Out-File -Encoding utf8 privacy-evidence/tree.txt
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' |
            Select-Object EditionID, CurrentBuild, UBR, DisplayVersion |
            ConvertTo-Json | Out-File -Encoding utf8 privacy-evidence/host.json
          @(
            'The runner account is an elevated administrator, so this run cannot show',
            'whether a standard account may write HKCU\Software\Policies; a write there',
            'that Windows refuses ends not_applied with the code access_denied.'
          ) | Out-File -Encoding utf8 privacy-evidence/README.txt
      - name: Build the binary and the disposable tests
        shell: pwsh
        run: cargo test -p sprawling --test privacy_disposable --no-run
      - name: Write, read back, restore, and compare the registry
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $keys = @(
            'HKCU\Control Panel\International\User Profile',
            'HKCU\Environment',
            'HKCU\Software\Microsoft\InputPersonalization',
            'HKCU\Software\Microsoft\Speech_OneCore\Settings\OnlineSpeechPrivacy',
            'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced',
            'HKCU\SOFTWARE\Policies\Microsoft\Windows\CloudContent',
            'HKLM\SOFTWARE\Microsoft\OneDrive',
            'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer',
            'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\TextInput',
            'HKLM\SOFTWARE\Policies\Microsoft\Camera',
            'HKLM\SOFTWARE\Policies\Microsoft\Dsh',
            'HKLM\SOFTWARE\Policies\Microsoft\FindMyDevice',
            'HKLM\SOFTWARE\Policies\Microsoft\InputPersonalization',
            'HKLM\SOFTWARE\Policies\Microsoft\SQMClient\Windows',
            'HKLM\SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo',
            'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppCompat',
            'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy',
            'HKLM\SOFTWARE\Policies\Microsoft\Windows\CloudContent',
            'HKLM\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\PushNotifications',
            'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection',
            'HKLM\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization',
            'HKLM\SOFTWARE\Policies\Microsoft\Windows\HandwritingErrorReports',
            'HKLM\SOFTWARE\Policies\Microsoft\Windows\LocationAndSensors',
            'HKLM\SOFTWARE\Policies\Microsoft\Windows\Messaging',
            'HKLM\SOFTWARE\Policies\Microsoft\Windows\OneDrive',
            'HKLM\SOFTWARE\Policies\Microsoft\Windows\System',
            'HKLM\SOFTWARE\Policies\Microsoft\Windows\TabletPC',
            'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting',
            'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search',
            'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsAI'
          )
          $tasks = @(
            @('\Microsoft\Windows\Customer Experience Improvement Program\', 'Consolidator'),
            @('\Microsoft\Windows\Customer Experience Improvement Program\', 'UsbCeip'),
            @('\Microsoft\Windows\Device Information\', 'Device'),
            @('\Microsoft\Windows\Device Information\', 'Device User')
          )
          function Export-State($side) {
            $dir = "privacy-evidence/$side"
            New-Item -ItemType Directory -Force $dir | Out-Null
            for ($i = 0; $i -lt $keys.Count; $i++) {
              $file = Join-Path $dir ('{0:d2}.reg' -f $i)
              reg export $keys[$i] $file /y 2>$null | Out-Null
              if ($LASTEXITCODE -ne 0) { Set-Content -Path $file -Value 'absent' -Encoding utf8 }
            }
            $tasks | ForEach-Object {
              $found = Get-ScheduledTask -TaskPath $_[0] -TaskName $_[1] -ErrorAction SilentlyContinue
              [ordered]@{ path = $_[0]; name = $_[1]; state = if ($found) { "$($found.State)" } else { 'absent' } }
            } | ConvertTo-Json | Out-File -Encoding utf8 "$dir/tasks.json"
          }
          Export-State 'before'
          $env:SPRAWLING_PRIVACY_EVIDENCE = (Resolve-Path privacy-evidence).Path
          cargo test -p sprawling --test privacy_disposable -- --ignored --test-threads=1 2>&1 | Tee-Object privacy-evidence/tests.log
          $tested = $LASTEXITCODE
          Export-State 'after'
          $changed = @(); $residual = @()
          for ($i = 0; $i -lt $keys.Count; $i++) {
            $name = '{0:d2}.reg' -f $i
            $before = [IO.File]::ReadAllBytes("privacy-evidence/before/$name")
            $after = [IO.File]::ReadAllBytes("privacy-evidence/after/$name")
            if ([Convert]::ToBase64String($before) -eq [Convert]::ToBase64String($after)) { continue }
            if ((Get-Content "privacy-evidence/before/$name" -Raw).Trim() -eq 'absent') { $residual += $keys[$i] } else { $changed += $keys[$i] }
          }
          $taskBefore = Get-Content privacy-evidence/before/tasks.json -Raw
          $taskAfter = Get-Content privacy-evidence/after/tasks.json -Raw
          [ordered]@{
            tests_exit = $tested
            changed_keys = $changed
            residual_keys = $residual
            tasks_equal = ($taskBefore -eq $taskAfter)
          } | ConvertTo-Json | Out-File -Encoding utf8 privacy-evidence/comparison.json
          Get-Content privacy-evidence/comparison.json
          if ($tested -ne 0) { exit $tested }
          if ($changed.Count -gt 0) { throw "registry keys differ after the run: $($changed -join ', ')" }
          if ($taskBefore -ne $taskAfter) { throw 'scheduled task states differ after the run' }
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: privacy-windows-${{ matrix.os }}-${{ github.sha }}
          path: privacy-evidence
          if-no-files-found: error

  page:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      SPRAWLING_DISPOSABLE_PRIVACY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install pinned toolchain
        run: rustup show
      - uses: ./.github/actions/zig
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: privacy-page
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/client-artifacts
      - uses: ./.github/actions/lean
      - name: The archive a person downloads, and the checker that serves it
        shell: bash
        run: |
          set -euo pipefail
          just package
          lake build Sprawling acceptance
      - name: Unpack the archive and record what is judged
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/privacy-page"
          rm -rf "$out"
          mkdir -p "$out/unpacked" "$out/evidence"
          archive="$(ls "$PWD"/target/package/*.zip)"
          test "$(echo "$archive" | wc -l)" -eq 1
          unzip -q "$archive" -d "$out/unpacked"
          binary="$(find "$out/unpacked" -type f -name sprawling.exe | head -n 1)"
          test -n "$binary"
          git rev-parse HEAD 'HEAD^{tree}' > "$out/evidence/source.txt"
          sha256sum "$archive" "$binary" > "$out/evidence/archive-binary.sha256"
          {
            echo "dir=$out"
            echo "binary=$(cygpath -m "$binary")"
          } >> "$GITHUB_OUTPUT"
      - name: Browser for the served client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/acceptance-browser"
          bun add --cwd "$RUNNER_TEMP/acceptance-browser" playwright@1.58.2
          "$RUNNER_TEMP/acceptance-browser/node_modules/.bin/playwright" install chromium
          echo "PLAYWRIGHT_MODULE=$(cygpath -m "$RUNNER_TEMP/acceptance-browser/node_modules/playwright/index.mjs")" >> "$GITHUB_ENV"
      - name: Apply and restore through the page, read back with reg.exe
        shell: bash
        run: |
          set -euo pipefail
          SPRAWLING_BIN="${{ steps.archive.outputs.binary }}" lake exe acceptance client-ui .github/workflows/privacy-ui.mjs "${{ steps.archive.outputs.dir }}/evidence/ui"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: privacy-page-${{ github.sha }}
          path: ${{ runner.temp }}/privacy-page/evidence
          if-no-files-found: error
