# The gate a change closes on, run by a machine.
#
# Every job calls the recipes `just check` is made of and spells no command
# of its own, so the check a person runs at their desk and the check a pull
# request gets are one set of commands rather than two copies that drift.
# The jobs together are exactly `just check`, plus the two things a tree
# alone cannot hold: the commit messages of the range under review, and the
# kani proofs, which need a Linux host.
#
#   gates-sources / gates-artifacts / gates
#             source half (fmt, source gates, commits, Zig leaf tests) and
#             artifact half (bundle gates) in parallel; `gates` collects
#             both so branch protection keeps one name
#   swap      every look under client/swap/ drawn in place of the shipped
#             one, and judged by render as the shipped bundle is
#   models    the Lean specifications under `crates/`
#   clippy    the zero-warning build of every target and feature, and the
#             feature combinations `just features` runs
#   nix-eval  evaluation of the Nix package when one of its inputs moves
#   test build, test (<slice>), test
#             the suite, compiled once into a nextest archive and run in
#             four slices on separate runners; `test` collects all
#             verdicts, so the check a branch protection names stays one
#   core      clippy and the suite of the packages every platform ships
#             (`just check-core`), on ubuntu when Rust paths moved; macOS
#             check-core lives in `platforms.yml`
#   supply    licences, bans and sources; compiles nothing
#   client    the client's own linter, typecheck and tests
#   proof     the kernel propositions kani can hold; `changes` decides
#             whether a change touched anything a proof is about
#
# The nine phases of `just check-all` map onto these jobs one to one or
# into a job that holds several: fmt, desktop and source gates ->
# gates-sources, build-web and artifact gates -> gates-artifacts, clippy
# and features -> clippy, test -> the test jobs, the supply-chain read of
# `just gates` -> supply, models -> models, client -> client.
#
# The order a red arrives in is fmt, then the source gates, then clippy,
# then the suite, then the client, because every job that can start does
# so in the first second and the cheap ones finish first. Chaining the
# heavy jobs with `needs` would buy the same order and cost the sum of
# the jobs as wall clock instead of the slowest one.
#
# A job is a runner, and the account runs about twenty at once across
# every workflow, so a run that starts more jobs than it needs queues
# behind itself and behind the next branch's run. Path filters therefore
# split `rust` from `client` from `lean`: a client-only change skips the
# Windows suite and clippy; a Rust-only change skips `client` and `swap`.
# Each verdict step in a multi-verdict job runs even after an earlier one
# failed (`!cancelled()`), so one red does not hide the others.
#
# Which jobs a pull request must pass is a repository setting rather than a
# line in this file. `changes` is deliberately not required: it exists to
# let `proof`, `nix-eval`, and the heavy suite jobs skip when their paths
# did not move (docs-only changes keep `gates` and `supply`), and a
# skipped required check counts as met while a required check that never
# starts blocks the branch for ever. Warming the release dependency cache
# after a green main push lives in `release-warm.yml`, not here.
#
# Windows for everything a person can reproduce at their desk, because it is
# the platform the project is developed on, so a red job is a red local run.
# Jobs on ubuntu because the tool they drive runs better or only there, or
# because their verdict cannot depend on the host: `client` drives bun,
# `models` drives Lean, `proof` drives kani, whose upstream builds for
# Linux only, `supply` reads `Cargo.lock` for every target (`deny.toml`
# names none) and compiles nothing, and `core` lints the packages a Linux
# person runs. macOS check-core and the macOS source gates, byte-identity
# and the Nix leg are `platforms.yml`; nightly and the runs nobody waits
# for on every push - mutation, citysim, the screenshots, a release build
# of a ref - are `on-demand.yml`. The stable compile of the standalone
# fuzz targets rides in `nightly.yml` with the sanitizer campaign.
#
# Any branch can ask for this run by hand (`gh workflow run ci.yml --ref
# wave/<name>`); nothing below assumes the ref is `main` except the cache
# writes, which only `main` makes.
#
# Rust cache hashes the installed toolchains, Cargo/Rust environment and
# dependency files; shared-key separates each compilation use. Bun keys on
# `client/bun.lock`, and only the branch everyone builds on writes a cache:
# a pull request's save is readable by that pull request alone, and it
# pushes the shared entry out of the repository's cache budget by age.
# Every job that compiles installs its toolchain through
# `./.github/actions/toolchain`, which leaves the pinned toolchain alone
# in its rustup home, so a runner image that moves its own `stable` no
# longer moves every cache key, and on Windows keeps Cargo's home on the
# work drive with the checkout, because the system drive writes small
# files several times slower.
#
# Every job carries a timeout. GitHub's default is six hours, so a hung job
# would burn a runner for a working day while the person waited on a
# verdict that was never coming; twenty minutes sits a little above the
# cold-cache floor.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    # `edited` belongs to `title-judge.yml`, which judges the title
    # alone: a description edit re-runs one short job, not this matrix.
    # The title is judged with the commits (crates/xtask/Spec.lean
    # §8-35) because a squash merge lands it on main as the subject.
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:
    inputs:
      release-validation:
        description: Preserve the release blocking scope; omit core and conditional kani.
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Incremental compilation caches work for the *next* build in the same
  # tree, and CI throws the tree away. It buys nothing here and it makes
  # the artifact the cache has to carry substantially larger.
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

# A second push supersedes the first: nobody reads the verdict on a commit
# that has already been replaced.
concurrency:
  # A release invocation must not cancel another release or a main CI run.
  group: ci-${{ inputs.release-validation && github.run_id || github.ref }}
  cancel-in-progress: ${{ !inputs.release-validation }}

jobs:
  # Which of this change's paths a proof could possibly be about.
  #
  # Installing kani and its own toolchain is minutes, and a pull request
  # that edits a README has nothing for a solver to hold. `proof` below
  # runs only when a path it judges moved: the kernel it proves over, this
  # workflow, the xtask that owns the harness roster, and the kani pin.
  changes:
    if: ${{ !inputs.release-validation }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proof: ${{ steps.filter.outputs.proof }}
      nix: ${{ steps.filter.outputs.nix }}
      rust: ${{ steps.filter.outputs.rust }}
      client: ${{ steps.filter.outputs.client }}
      code: ${{ steps.filter.outputs.code }}
      lean: ${{ steps.filter.outputs.lean }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            proof:
              - 'crates/kernel/**'
              - 'crates/xtask/src/proof.rs'
              - 'crates/xtask/src/proof/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/kani-version.txt'
            nix:
              - 'flake.nix'
              - 'flake.lock'
              - 'rust-toolchain.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'justfile'
              - 'client/package.json'
              - 'client/bun.lock'
              - 'crates/sprawling/build.rs'
              - 'crates/sprawling/Cargo.toml'
              - 'crates/desktop/ffi/zig-version'
              - 'crates/xtask/src/package/**'
              - 'crates/xtask/src/bundle.rs'
            # Rust product code, gates machinery, and the files that
            # change what the Rust half of `just check` compiles or judges.
            rust:
              - 'crates/**'
              - 'tools/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - '.cargo/**'
              - 'justfile'
              - 'flake.nix'
              - 'flake.lock'
              - 'architecture.toml'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'deny.toml'
            # Client sources and the formatter config that judges them.
            client:
              - 'client/**'
              - 'bunfig.toml'
            # Either product face: kept for readers that still want one bit.
            code:
              - 'crates/**'
              - 'client/**'
              - 'tools/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - '.cargo/**'
              - 'justfile'
              - 'flake.nix'
              - 'flake.lock'
              - 'bunfig.toml'
              - 'architecture.toml'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'deny.toml'
            lean:
              - '**/*.lean'
              - 'lean-toolchain'
              - 'lakefile.toml'
              - 'lake-manifest.json'

  # Evaluation catches a malformed flake input without paying for the full
  # build. The complete Nix build and its installation acceptance stay in
  # platforms.yml; this job exists so a deterministic failure such as a bad
  # fetcher hash is met on the change that wrote it.
  nix-eval:
    needs: changes
    if: ${{ !inputs.release-validation && (needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: the committed builder lock is present and unchanged
        run: |
          test -f flake.lock
          nix flake metadata --no-update-lock-file
          git diff --exit-code -- flake.lock
      - name: evaluate the complete application without building it
        run: nix eval --raw .#packages.x86_64-linux.default.drvPath --no-update-lock-file

  # Source half of the gates: fmt, the gates that read sources, commit
  # messages, and the Zig leaves' own tests. Parallel with the artifact
  # half so render does not sit behind zig test on the same runner.
  #
  # `fetch-depth: 0` because the commit-message check judges every commit
  # in the change-set, and a base branch can sit any distance back.
  gates-sources:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/toolchain
      # The Zig the desktop's leaf is built with and formatted by
      # (`crates/desktop/Spec.lean` section 8-12). The one job whose Zig
      # cache pays: `just check-desktop` runs `zig test`.
      - uses: ./.github/actions/zig
        with:
          cache: true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: gates
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: just
      # `fmt-check` includes `bun fmt --check`, so Bun has to be present.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: client/package.json
      - name: native payloads in system channel validation
        if: ${{ !cancelled() }}
        env:
          PYTHONUTF8: "1"
        run: python crates/xtask/src/channel/validate_test.py
      - name: fmt
        if: ${{ !cancelled() }}
        run: just fmt-check
      - name: the gates that read sources
        if: ${{ !cancelled() }}
        run: just gates-sources
      - name: nightly publication decisions, without GitHub
        if: ${{ !cancelled() }}
        run: sh .github/workflows/test-nightly-release.sh
      # The judged range, the pattern and the recovery live in the
      # action, so this job and `title-judge.yml` read one authority
      # (crates/xtask/Spec.lean §8-35).
      - name: commit messages
        if: ${{ !cancelled() }}
        uses: ./.github/actions/commit-messages
      # The desktop server and its FFI seam are workspace members, so
      # clippy and the suite judge them; what is left is the Zig leaf's
      # own tests, which no cargo command runs (`crates/desktop/Spec.lean`
      # section 8-12).
      - name: the Zig leaf's own tests
        if: ${{ !cancelled() }}
        run: just check-desktop
      # The console renderer's own Zig tests, which no cargo command runs
      # either (`crates/console_ffi/Spec.lean`).
      - name: the console leaf's own tests
        if: ${{ !cancelled() }}
        run: just check-console

  # Bundle half of the gates: npm, render and budget. Its own runner so
  # the five render passes do not share four processors with zig test
  # (crates/xtask/Spec.lean D27).
  gates-artifacts:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/zig
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: gates
          save-if: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: just
      - uses: ./.github/actions/client-artifacts
      # `--no-deps` because the action above has just run `build-web`.
      - name: the gates that judge the client bundle
        run: just --no-deps gates-artifacts

  # The one gates verdict branch protection names. Reads both halves.
  gates:
    needs: [gates-sources, gates-artifacts]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: both halves passed
        run: |
          test "${{ needs.gates-sources.result }}" = success
          test "${{ needs.gates-artifacts.result }}" = success

  # Every replacement look under client/swap/ drawn in place of the
  # shipped one, and the client still typechecks, keeps its wiring tests
  # and passes render (crates/xtask/Spec.lean section 8-13).
  #
  # A job of its own rather than a step of `gates-artifacts`: its render
  # opens the five passes again, and a render pass keeps two to three
  # processors busy, so the two renders cannot share one four-processor
  # runner without slowing each other.
  swap:
    needs: changes
    # `always()` so a release-validation call still runs when `changes` is
    # skipped; client-only (and full-code) pull requests turn `client` on.
    if: ${{ always() && !cancelled() && (inputs.release-validation || github.event_name == 'workflow_dispatch' || (needs.changes.result == 'success' && needs.changes.outputs.client == 'true')) }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/zig
      # The entry `gates-sources` saves holds what xtask is built from.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: gates
          save-if: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: just
      - uses: ./.github/actions/client-artifacts
      - name: the swap test
        run: just swap

  # The Lean specifications. The checker in `crates/adversary/` is not built here:
  # it attacks the binary from outside and stays out of every required
  # check (`adversary.yml` runs it nightly).
  models:
    needs: changes
    if: ${{ always() && !cancelled() && (inputs.release-validation || github.event_name == 'workflow_dispatch' || (needs.changes.result == 'success' && needs.changes.outputs.lean == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: just
      - uses: ./.github/actions/lean
      - name: the specifications
        run: just models

  clippy:
    needs: changes
    if: ${{ always() && !cancelled() && (inputs.release-validation || github.event_name == 'workflow_dispatch' || (needs.changes.result == 'success' && needs.changes.outputs.rust == 'true')) }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/toolchain
      # The Zig the desktop's leaf is built with; every Windows build of
      # `sprawling` compiles it (`crates/desktop/Spec.lean` section 8-12).
      - uses: ./.github/actions/zig
      # Without this every run compiles the whole graph from zero, including
      # aws-lc-sys and libgit2, which are C. A key per job, because
      # check-mode metadata and real rlibs are different artifacts and one
      # key would make two jobs overwrite each other's cache all day.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: just
      - name: clippy
        run: just clippy
      # Check-mode passes, seconds on the cache this job already holds,
      # so they ride here rather than paying a runner of their own.
      # The standalone fuzz workspace's stable compile lives in
      # `nightly.yml` with the sanitizer campaign (D27).
      - name: the feature combinations
        run: just features

  # The suite, compiled once. The archive carries every test binary and
  # the workspace binaries they spawn; the slices below run it on
  # runners whose checkout path is the same as this one, which is what
  # lets a path cargo baked in at compile time resolve there.
  #
  # The suite links with rust-lld (lld-link) rather than Microsoft's
  # link.exe: the archive's linked binaries are whatever
  # `cargo nextest archive` lists for the tree (citysim's scenarios are
  # one binary; sprawling/wire top-level `tests/*.rs` files are still one
  # each — `crates/xtask/Spec.lean` D27). On a warm cache the compile from
  # the first workspace crate to the archive took 171 s and 194 s in two
  # runs against 201 s with link.exe. This archive is a test build that
  # nobody downloads; `release.yml` builds what ships with link.exe, so
  # the linker of a released binary is not this one.
  #
  # The target directory starts warm: `./.github/actions/warm-target`
  # restores the one the newest push to main left and ages every input
  # that has not changed since, so cargo compiles the packages a change
  # reached and nothing else. Rust cache keeps only Cargo's registry here,
  # because the warm target carries the dependencies' artifacts too, and
  # the bundle comes from its own cache entry when `client/` is unchanged.
  test-build:
    name: test build
    needs: changes
    if: ${{ always() && !cancelled() && (inputs.release-validation || github.event_name == 'workflow_dispatch' || (needs.changes.result == 'success' && needs.changes.outputs.rust == 'true')) }}
    outputs:
      slices: ${{ steps.plan.outputs.slices }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/toolchain
      # The Zig the desktop's leaf is built with; every Windows build of
      # `sprawling` compiles it (`crates/desktop/Spec.lean` section 8-12).
      - uses: ./.github/actions/zig
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test-registry
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-nextest,just
      # The binary embeds the bundle, so the archive carries the one a
      # person runs rather than the placeholder page.
      - uses: ./.github/actions/client-artifacts
        with:
          want: bundle
      # After the bundle, because the bundle is one of the inputs the warm
      # target compares.
      - uses: ./.github/actions/warm-target
        with:
          mode: restore
      - name: the suite, compiled once
        run: just test-archive target/nextest-archive.tar.zst
      - name: prove every test belongs to exactly one slice
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          just test-slice-plan target/nextest-archive.tar.zst target/test-slices
          echo "slices=$(cat target/test-slices/matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-slice-coverage
          path: target/test-slices
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nextest-archive
          path: target/nextest-archive.tar.zst
          retention-days: 1
          if-no-files-found: error
      - uses: ./.github/actions/warm-target
        if: github.ref == 'refs/heads/main'
        with:
          mode: save

  # Disjoint slices, whose union is checked before the matrix starts.
  # A `compile` slice installs the toolchain and Zig; `plain` and `client`
  # only install nextest and just, because running an archive needs no
  # rustc (`crates/xtask/Spec.lean` D27). The rest of the setup follows
  # the `environment` `just test-slice-plan` gives it.
  test-slice:
    name: test (${{ matrix.name }})
    needs: test-build
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-build.outputs.slices) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/toolchain
        if: matrix.environment == 'compile'
      # trybuild compiles `sprawling-runtime`, which builds the Zig leaf.
      - uses: ./.github/actions/zig
        if: matrix.environment == 'compile'
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-nextest,just
      # The trybuild suites are cold rather than slow: one suite is 21.4s
      # against an empty scratch and 0.9s against a warm one, so the
      # scratch is cached on its own. trybuild gives every suite one
      # target directory, `target/tests/trybuild`, so the one slice that
      # runs them all keeps one entry.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: matrix.environment == 'compile'
        id: trybuild-scratch
        with:
          path: target/tests
          key: trybuild-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/*/tests/**') }}
          restore-keys: trybuild-${{ runner.os }}-${{ matrix.name }}-
      # xtask's npm gate has tests that read the installed client tree and
      # refuse when it is missing, which is what a bare runner has.
      - uses: ./.github/actions/client-artifacts
        if: matrix.environment == 'client'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nextest-archive
          path: target
      - name: tests
        env:
          TEST_ENVIRONMENT: ${{ matrix.environment }}
          TEST_FILTER: ${{ matrix.filter }}
        shell: bash
        run: just test-slice target/nextest-archive.tar.zst "$TEST_ENVIRONMENT" "$TEST_FILTER"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: ${{ matrix.environment == 'compile' && github.ref == 'refs/heads/main' && steps.trybuild-scratch.outputs.cache-hit != 'true' }}
        with:
          path: target/tests
          key: trybuild-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/*/tests/**') }}

  # The one verdict of the suite, under the name branch protection
  # requires. It reads the build and all slices, so a slice that
  # failed, or never started because the build failed, fails it. A
  # docs-only change skips the build; both sides of the need are then
  # skipped together and this job agrees.
  test:
    needs: [test-build, test-slice]
    # Stay skipped with the build on a docs-only change; still run when
    # the build failed so the missing slices fail this check by name.
    if: ${{ always() && needs.test-build.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every slice passed
        run: |
          test "${{ needs.test-build.result }}" = success
          test "${{ needs.test-slice.result }}" = success

  # The packages a person on Linux runs, linted and tested where they
  # run. Not a required check: a red here is read and fixed forward, and
  # the required set stays the one a Windows desk reproduces. macOS
  # check-core lives in `platforms.yml` (D27): it was the longest single
  # job on every PR without blocking the merge.
  core:
    needs: changes
    if: ${{ always() && !cancelled() && !inputs.release-validation && (github.event_name == 'workflow_dispatch' || (needs.changes.result == 'success' && needs.changes.outputs.rust == 'true')) }}
    name: core (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/toolchain
      # The Zig the console's renderer is built with on every platform
      # (`crates/console_ffi/Spec.lean` D1).
      - uses: ./.github/actions/zig
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-nextest,just
      # The same scratch the `compile` test slice keeps, for the same
      # reason: cold, the trybuild suites dominate this job's test run.
      # Restored after the Rust cache, which never holds `target/tests`.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: trybuild-scratch
        with:
          path: target/tests
          key: trybuild-${{ runner.os }}-core-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/*/tests/**') }}
          restore-keys: trybuild-${{ runner.os }}-core-
      - name: clippy and the suite of the core packages
        run: just check-core
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: ${{ github.ref == 'refs/heads/main' && steps.trybuild-scratch.outputs.cache-hit != 'true' }}
        with:
          path: target/tests
          key: trybuild-${{ runner.os }}-core-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/*/tests/**') }}
      # The Rust cache's save step cannot walk trybuild's scratch
      # (rust-cache#193), so the scratch leaves before that step runs.
      - name: clear the trybuild scratch before the cache is saved
        if: always()
        shell: bash
        run: rm -rf target/tests

  # Licences, banned crates and where they came from. It reads `Cargo.lock`
  # and compiles nothing. `advisories` is deliberately absent from
  # `just deny`: an advisory published today against a dependency nobody
  # touched would turn a pull request red for a reason its author did not
  # write. It runs in `nightly.yml`, which files each finding as an issue
  # rather than repeating the same red run after the issue is already open.
  supply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-deny,just
      - name: licences, bans and sources
        run: just deny

  # The client, which is the one part of this repository the Rust toolchain
  # does not judge: its own linter forbids `any`, `as`, `throw`, `try` and a
  # non-exhaustive switch.
  client:
    needs: changes
    if: ${{ always() && !cancelled() && (inputs.release-validation || github.event_name == 'workflow_dispatch' || (needs.changes.result == 'success' && needs.changes.outputs.client == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: client/package.json
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: just
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('client/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # eslint's own cache, which is what makes this lane cost seconds
      # instead of the two minutes the type-aware rules take: every rule
      # that wants a type rebuilds the TypeScript program, and a file the
      # cache says is unchanged is not linted again. A pull request
      # restores `main`'s entry and lints only what it changed; the key
      # moves with the linter's own inputs, so a rule or a version change
      # starts from nothing rather than from a stale verdict.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: client/node_modules/.cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('client/eslint.config.ts', 'client/tsconfig.json', 'client/bun.lock') }}
          restore-keys: eslint-${{ runner.os }}-
      - name: lint, typecheck and test the client
        run: just check-client

  # The propositions only a proof can hold, against real MIR.
  #
  # Which harnesses run is not written here: `cargo xtask proof --list`
  # prints the roster, so a harness added to the kernel cannot be proved
  # locally and forgotten in CI. A harness over one concrete value, or one
  # that builds a `Vec`, a `String` or a `BTreeSet` whose loops CBMC cannot
  # bound, is held by a `#[test]` or a proptest instead; `crates/kernel/Spec.lean`
  # section 2 records which and why.
  proof:
    needs: changes
    # A change that touches nothing a proof is about skips this job, and
    # a skipped job reports success to a required check. Asking for the
    # ordinary CI run by hand always proves. Release keeps its existing scope.
    if: ${{ !inputs.release-validation && (needs.changes.outputs.proof == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Not `./.github/actions/toolchain`: the kani cache below was
      # written against the image's own rustup and Cargo homes, and
      # moving them under kani is a change nobody has measured.
      - name: install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: proof
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # kani's own toolchain is hundreds of megabytes and changes when the
      # pin changes and at no other time, so the pin file is the whole key.
      # `nightly.yml` reads the same pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: kani-cache
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani
          key: kani-${{ runner.os }}-${{ hashFiles('.github/workflows/kani-version.txt') }}
      - name: install the pinned kani
        if: steps.kani-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat .github/workflows/kani-version.txt)
          cargo install --locked "kani-verifier@$version"
          cargo kani setup
      # `cargo xtask proof` skips with one line where kani is absent, which is
      # right at a Windows desk and would be an empty verdict here: this
      # step stops the job before the proof can pass by proving nothing.
      - name: kani answers, so the proof step cannot skip
        run: cargo kani --version
      # `cargo xtask proof`, which is the whole of `just proof`, spelled
      # out because the `proof` gate reads this job for exactly that
      # command (crates/xtask/src/proof.rs).
      - name: the proofs
        run: cargo xtask proof

  # D27 in crates/xtask/Spec.lean: a path-filtered skip is allowed for the
  # optional heavy jobs; gates and supply must still succeed, and a
  # failure or cancel anywhere fails the tree. `changes` is on this list
  # so a red or broken filter job cannot skip the suite and still leave
  # validation green. This is the shared verdict, so release has no
  # second list of checks. `gates` here is the collector over both halves.
  validation:
    needs: [changes, models, clippy, test, gates, swap, supply, client]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every required job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            all(.[]; .result == "success" or .result == "skipped")
            and (.gates.result == "success")
            and (.supply.result == "success")
            and (all(.[]; .result != "failure" and .result != "cancelled"))
          ' <<<"$RESULTS"
