# V10, on a schedule, and never on a push.
#
# nightly.yml states the rule this file obeys: a scheduled run earns its slot
# only by answering what a push cannot, and names the two inputs that change
# while nobody pushes - the world outside this repository, and a fresh draw of
# random bytes. Only the second one applies here, so it carries the whole
# justification: `adversary/lake-manifest.json` declares no packages, so there
# is no dependency graph to resolve and nothing outside this repository that
# tonight's run could disagree with yesterday's about. What moves is the seed,
# which follows the run number, so tonight walks traces last night did not.
#
# A failure prints the seed it drew. Passing that seed back through
# SPRAWLING_SEED - `just adversary` reads it too - reproduces the run on a
# developer machine, which is the difference between a finding and a rumour.
#
# This is not a gate. `just check` never reaches it, no push waits for it, and a
# red run here blocks nothing: it reports a finding, and the finding is then
# fixed in Rust, where the rule lives (adversary/adversary-SPEC.md section 2).
#
# **Every check this runs is one that must pass, so red here always means news.**
# Nothing is kept in the tree because it is expected to fail: a job that is red
# by construction trains everyone who sees it to stop looking, and the next real
# finding then lands in a run nobody reads.
name: adversary

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "the seed to draw traces from; empty means the run number"
        required: false
        type: string

permissions:
  contents: read

jobs:
  adversarial-properties:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SPRAWLING_BIN: ${{ github.workspace }}/target/debug/sprawling
      SPRAWLING_SEED: ${{ inputs.seed || github.run_number }}
    steps:
      - uses: actions/checkout@v7

      # `sprawling` reaches `keyring`, whose Linux backend is secret-service and
      # whose build wants dbus headers this runner does not carry. nightly.yml
      # records the night that fact was learned; naming the package here is what
      # keeps this job from relearning it.
      - name: install the dbus headers keyring builds against
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev pkg-config

      - name: build the binary the adversary drives
        run: |
          rustup show
          cargo build -p sprawling --locked

      # The toolchain is the only thing downloaded, and `lean-toolchain` pins
      # which one, so the key is that file and nothing else. Build output is
      # deliberately not cached: it takes seconds to produce and a stale entry
      # would be a red nobody could reproduce.
      - uses: actions/cache@v6
        with:
          path: ~/.elan
          key: adversary-${{ runner.os }}-elan-${{ hashFiles('adversary/lean-toolchain') }}

      - name: install the toolchain the checker is written in
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -fsSL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
            sh elan-init.sh -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Named rather than left to happen inside the build, so a download that
      # fails says so where a reader is looking, and so the cache above saves a
      # toolchain that is already whole.
      - name: fetch the pinned toolchain
        working-directory: adversary
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          lake --version

      - name: build the checker
        working-directory: adversary
        run: lake build

      # The whole tree, in one step. A failure prints the check's name, the seed
      # and the shrunk trace, which is everything needed to reproduce it with
      # `just adversary --select "<name>"` and the seed in SPRAWLING_SEED.
      - name: the properties
        working-directory: adversary
        run: lake exe adversary
