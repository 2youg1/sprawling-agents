name: native-windows-acceptance
on:
  push:
    branches: [main, "s10/**"]
    paths:
      - crates/runtime/**
      - crates/desktop/ffi/**
      - crates/kernel/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/native-windows-acceptance.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      SPRAWLING_DISPOSABLE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/zig
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-native-runtime
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Record exact source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-evidence | Out-Null
          git rev-parse HEAD | Out-File -Encoding utf8 native-evidence/head.txt
          git rev-parse 'HEAD^{tree}' | Out-File -Encoding utf8 native-evidence/tree.txt
      - name: Native foreign boundary conformance
        shell: pwsh
        run: |
          cargo nextest run -p sprawling-desktop-ffi --no-tests fail --no-fail-fast --failure-output immediate-final -E 'test(native_)' 2>&1 | Tee-Object native-evidence/boundary.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native production axes and cancellation
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          cargo nextest run -p sprawling-runtime --run-ignored ignored-only --no-tests fail --no-fail-fast --failure-output immediate-final -E 'test(native_windows_disposable)' 2>&1 | Tee-Object native-evidence/production.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native priority and declared Rust build regressions
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $filter = 'test(a_dispatched_command_runs_below_the_core) | binary(exec_builds)'
          cargo nextest list -p sprawling-runtime -E $filter --message-format json > native-evidence/regressions.json 2> native-evidence/regressions-list.stderr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $suites = (Get-Content native-evidence/regressions.json -Raw | ConvertFrom-Json).'rust-test-suites'.PSObject.Properties.Value
          $priority = @($suites | ForEach-Object { $_.testcases.PSObject.Properties } | Where-Object { $_.Name -ceq 'tools::exec::tests::yielding::a_dispatched_command_runs_below_the_core' -and $_.Value.'filter-match'.status -eq 'matches' -and -not $_.Value.ignored })
          $build = @($suites | Where-Object { $_.'binary-name' -ceq 'exec_builds' } | ForEach-Object { $_.testcases.PSObject.Properties } | Where-Object { $_.Value.'filter-match'.status -eq 'matches' -and -not $_.Value.ignored })
          if ($priority.Count -ne 1 -or $build.Count -eq 0) { throw 'Both native regressions must be selected and runnable.' }
          cargo nextest run -p sprawling-runtime --no-tests fail --no-fail-fast --failure-output immediate-final --success-output immediate -E $filter 2>&1 | Tee-Object native-evidence/regressions.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Hash the actual probe binaries
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem target/debug/deps/runtime-*.exe,target/debug/deps/exec_builds-*.exe | Get-FileHash -Algorithm SHA256 | Select-Object Hash,Path | ConvertTo-Json | Out-File -Encoding utf8 native-evidence/binaries.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-windows-${{ github.sha }}
          path: native-evidence
          if-no-files-found: error
