# What ci.yml deliberately does not ask on every push.
#
# Two claims live here, and both are about machines rather than about a
# change. A4/V8 assert byte identity across platforms, so a platform this
# workflow does not run is a promise rather than a fact. The flake claims
# a person on NixOS can build this tree with the Rust version
# `rust-toolchain.toml` names, and only an evaluation of the flake can say
# whether that is so.
#
# V5 used to be the third, and it left rather than lapsed. The kani job
# is in `ci.yml` now: its reason for being nightly was that it was the
# one ubuntu build in the pipeline, and that stopped being true, so a
# proof arriving a day after the merge it judges had nothing left
# defending it.
#
# They run on a schedule and on demand instead of on every push because a
# gate nobody waits for is a gate nobody runs - and a twenty-minute wait
# on every commit is how the fast gates stopped being read at all.
#
# Both are functions of the commit: judged twice, one commit gives one
# verdict. So the schedule asks first whether main has moved, and a night
# that changed nothing costs one checkout instead of two runners.
name: platforms
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Has main moved since the last scheduled run? The window is 25 hours,
  # one hour wider than the cron interval, so a commit that lands minutes
  # before a run is never missed by an off-by-one. Asking by hand always
  # runs: `workflow_dispatch` is itself the answer to "is this worth a
  # runner". The commit date comes from git rather than from an API, so
  # this job needs nothing but a checkout, so it was legal on ubuntu even
  # while Linux was kept out of the builds. That has since been
  # re-argued (sprawling-SPEC.md section 8-9): a native Linux runner never
  # touches a cross toolchain, which was the whole of the original reason.
  moved:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.head.outputs.verdict }}
    steps:
      - uses: actions/checkout@v7
      - id: head
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "verdict=run" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -lt 90000 ]; then
            echo "verdict=run" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=skip" >> "$GITHUB_OUTPUT"
            echo "main last moved $(( age / 3600 )) hours ago; nothing new to judge" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  # The same commands ci.yml runs, on the platform ci.yml never sees.
  #
  # macOS alone: this matrix used to carry a windows leg as well, which
  # was the same four commands ci.yml already runs on windows for every
  # push. A gate that repeats a gate teaches nobody anything and costs a
  # runner an hour a night, so the leg is gone rather than kept for
  # symmetry.
  macos:
    needs: moved
    if: needs.moved.outputs.verdict == 'run'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      # `guard` and `apisync` read one commit and its parent; ci.yml
      # gives the reasoning.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-public-api
      - name: nightly toolchain (rustdoc JSON for apisync)
        run: rustup toolchain install nightly --profile minimal
      # One job rather than ci.yml's five: nobody is waiting for this
      # one, and the sum of two builds costs a schedule nothing.
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: xtask gates
        run: cargo xtask gates
      - name: tests
        run: cargo nextest run --workspace --locked --all-features
      # See ci.yml: the cache's save step cannot walk trybuild's scratch.
      - name: clear the trybuild scratch before the cache is saved
        if: always()
        shell: bash
        run: rm -rf target/tests

  # The flake, judged the only way a flake can be judged: by evaluating it.
  #
  # Nightly rather than push, on the same policy as the macOS leg above,
  # and for a reason particular to Nix: it does not share
  # `Swatinem/rust-cache`, so without a binary cache one build compiles
  # the whole dependency graph from zero and far exceeds the push
  # pipeline's time budget. Nobody waits for this verdict, so it costs a
  # schedule nothing.
  #
  # `nix flake check` is what enforces the load-bearing rule: the flake
  # derives its Rust version from `rust-toolchain.toml`, and
  # `checks.toolchain-version-is-derived` turns a flake wanting any other
  # version red. `nix build` then proves the devshell's toolchain can
  # actually build the binary on a Linux the release now ships for.
  nix:
    needs: moved
    if: needs.moved.outputs.verdict == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: the version is derived, not restated
        run: nix flake check --print-build-logs
      - name: the binary this flake's toolchain builds
        run: nix build .#default --print-build-logs
