# What ci.yml deliberately does not ask on every push.
#
# Four claims live here, and each is about machines rather than about a
# change. The repository's gates hold on macOS, where ci.yml lints and
# tests the core packages but never runs xtask, so a platform this
# workflow does not run is a promise rather than a fact. The published
# packages build with the oldest compiler `rust-version` names, which
# every other job here, pinned to `rust-toolchain.toml`, never runs. The flake
# claims a person on NixOS can build this tree with the Rust version
# `rust-toolchain.toml` names, and only an evaluation of the flake can say
# whether that is so. And two builds of one tree are one artifact, which
# only a rebuild and a hash can answer - `repro` below is the first job
# in this repository that compares bytes at all.
#
# V5 used to be the third, and it left rather than lapsed. The kani job
# is in `ci.yml` now: its reason for being nightly was that it was the
# one ubuntu build in the pipeline, and that stopped being true, so a
# proof arriving a day after the merge it judges had nothing left
# defending it.
#
# They run on a schedule and on demand instead of on every push because a
# gate nobody waits for is a gate nobody runs - and a twenty-minute wait
# on every commit is how the fast gates stopped being read at all.
#
# Both are functions of the commit: judged twice, one commit gives one
# verdict. So the schedule asks first whether main has moved, and a night
# that changed nothing costs one checkout instead of two runners.
name: platforms
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Platform checks to run
        type: choice
        default: all
        options:
          - all
          - nix

permissions:
  contents: read

jobs:
  # Has main moved since the last scheduled run? The window is 25 hours,
  # one hour wider than the cron interval, so a commit that lands minutes
  # before a run is never missed by an off-by-one. Asking by hand always
  # runs: `workflow_dispatch` is itself the answer to "is this worth a
  # runner". The commit date comes from git rather than from an API, so
  # this job needs nothing but a checkout, so it was legal on ubuntu even
  # while Linux was kept out of the builds. That has since been
  # re-argued (`crates/sprawling/Spec.lean` §8-9): a native Linux runner never
  # touches a cross toolchain, which was the whole of the original reason.
  moved:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.head.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: head
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "verdict=run" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -lt 90000 ]; then
            echo "verdict=run" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=skip" >> "$GITHUB_OUTPUT"
            echo "main last moved $(( age / 3600 )) hours ago; nothing new to judge" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  # The repository's own gates, on macOS.
  #
  # Only the gates: ci.yml's `core` job lints and tests on macOS for every
  # push, and the desktop server is not a macOS target, so its
  # packages are judged on Windows alone. What is left for this job is
  # xtask, which judges the tree the same way on every platform and has
  # to be shown to.
  macos:
    needs: moved
    if: needs.moved.outputs.verdict == 'run' && (github.event_name != 'workflow_dispatch' || inputs.job == 'all')
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      # `guard` reads one commit and its parent; ci.yml
      # gives the reasoning.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - name: install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: . -> target
      # What the npm and render gates judge. This job repeats the commands
      # ci.yml runs, and repeated its omission as well: both gates refuse
      # an absent tree rather than skipping it, so without this step the
      # two below are red on a bare runner. The schedule has taken the
      # `moved` job's skip branch since that change landed, which is the
      # only reason this was still theoretical here and not there.
      - uses: ./.github/actions/client-artifacts
        if: ${{ !cancelled() }}
      # The render gate drives a Chromium-family engine with `--dump-dom`.
      # The full Google Chrome on this runner never exits from that call
      # (the gate kills it after two minutes and says so), while
      # chrome-headless-shell - the build Google ships for exactly this
      # kind of scripted, windowless use - does. SPRAWLING_BROWSER is the
      # gate's first tier, so naming the shell there is the whole change.
      - name: an engine the render gate can finish with
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path "$RUNNER_TEMP/engines"
          shell=$(find "$RUNNER_TEMP/engines" -type f -name chrome-headless-shell -perm -u+x | head -n 1)
          test -n "$shell"
          echo "SPRAWLING_BROWSER=$shell" >> "$GITHUB_ENV"
      - name: archive-derived channel fixtures on macOS
        if: ${{ !cancelled() }}
        run: cargo test -p xtask channel::tests
      - name: xtask gates
        if: ${{ !cancelled() }}
        run: cargo xtask gates

  # The oldest compiler a `cargo install sprawling` may use, exactly.
  #
  # clippy's `incompatible_msrv` refuses a standard-library API newer than
  # `rust-version`, and nothing else reads the claim: a language feature
  # stabilised after it, or a dependency whose own `rust-version` is
  # newer, passes every pinned job and breaks the install. Linux, because
  # this compiles every package but the Windows-only code and a Windows
  # runner is the scarce one (`crates/sprawling/spec/Doctor.lean` D31).
  # The version is read from the root manifest, its one authority.
  msrv:
    needs: moved
    if: needs.moved.outputs.verdict == 'run' && (github.event_name != 'workflow_dispatch' || inputs.job == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: the release rust-version names
        id: floor
        shell: bash
        run: |
          set -euo pipefail
          floor=$(sed -n 's/^rust-version = "\([0-9.]*\)"$/\1/p' Cargo.toml)
          test -n "$floor" && test "$(printf '%s\n' "$floor" | wc -l)" -eq 1
          # A two-part `1.N` means `1.N.0` to Cargo, while rustup would
          # read it as the newest `1.N` patch release.
          case "$floor" in *.*.*) ;; *) floor="$floor.0" ;; esac
          rustup toolchain install "$floor" --profile minimal
          echo "toolchain=$floor" >> "$GITHUB_OUTPUT"
      - name: the workspace on that compiler
        env:
          FLOOR: ${{ steps.floor.outputs.toolchain }}
        run: |
          cargo "+$FLOOR" check --workspace --all-targets --locked
          cargo "+$FLOOR" check --workspace --all-targets --all-features --locked

  # Two builds of one tree, byte for byte (release item three).
  #
  # Windows, because that is where the nondeterminism lives: link.exe
  # mints a PE header timestamp and a debug-directory PDB GUID per run,
  # and a build records the absolute path of every source it compiled.
  # `/Brepro` in `.cargo/config.toml` settles the first two, so every
  # build of this tree carries what this job judges, the release
  # archives included. The third needs no switch here, because both
  # builds run in one checkout and record the same paths; it is why
  # this job claims one machine and not two.
  #
  # Nightly rather than on a push: `cargo xtask repro` clears the
  # release artefacts of one crate and builds twice, and nobody waits on
  # a verdict that costs two links. The client bundle is built first
  # through the recipe a person runs, because the binary under
  # comparison has to be the one a release ships rather than the page
  # shell a bundle-less build embeds.
  repro:
    needs: moved
    if: needs.moved.outputs.verdict == 'run' && (github.event_name != 'workflow_dispatch' || inputs.job == 'all')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install pinned toolchain
        run: rustup show
      # The Zig the desktop's leaf is built with; every Windows build of
      # `sprawling` compiles it (`crates/desktop/Spec.lean` section 8-12).
      - uses: ./.github/actions/zig
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: just
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('client/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: the client bundle the binary embeds
        run: just build-web
      - name: two builds of one tree
        run: cargo xtask repro

  # The flake, judged the only way a flake can be judged: by evaluating it.
  #
  # Nightly rather than push, on the same policy as the macOS leg above,
  # and for a reason particular to Nix: it does not share
  # `Swatinem/rust-cache`, so without a binary cache one build compiles
  # the whole dependency graph from zero and far exceeds the push
  # pipeline's time budget. Nobody waits for this verdict, so it costs a
  # schedule nothing.
  #
  # `nix flake check` is what enforces the two load-bearing rules: the
  # flake derives its Rust version from `rust-toolchain.toml`, and
  # `checks.toolchain-version-is-derived` turns a flake wanting any other
  # version red; `checks.devshell-covers-just-check` then reads
  # `just prereqs list` and refuses a devshell missing a tool the loop
  # requires. `nix build` proves the devshell's toolchain can actually
  # build the binary on a Linux the release now ships for.
  nix:
    needs: moved
    if: needs.moved.outputs.verdict == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: the committed builder lock is present and unchanged
        run: |
          test -f flake.lock
          nix flake metadata --no-update-lock-file
          git diff --exit-code -- flake.lock
      - name: the complete application in the network sandbox
        run: nix build .#default --no-update-lock-file --print-build-logs
      - name: the version and devshell still obey their authorities
        run: nix flake check --no-update-lock-file --print-build-logs
      - name: read the flake's installation layout
        shell: bash
        run: |
          nix eval --json .#packages.x86_64-linux.default --apply 'p: {
            inherit (p) pname version resourceDir;
            inherit (p.meta) mainProgram;
          }' > "$RUNNER_TEMP/nix-layout.json"
          echo "NIX_LAYOUT=$RUNNER_TEMP/nix-layout.json" >> "$GITHUB_ENV"
      - name: the installed application and its resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, zipfile
          root = pathlib.Path.cwd()
          package = root / 'result'
          layout = json.loads(pathlib.Path(os.environ['NIX_LAYOUT']).read_text())
          archive = root / 'target/nix-acceptance.zip'
          archive.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive, 'w', strict_timestamps=False) as output:
              output.write(package / 'bin' / layout['mainProgram'], 'application/' + layout['mainProgram'])
              for resource in (package / layout['resourceDir']).rglob('*'):
                  if resource.is_file():
                      output.write(resource, 'application/' + str(resource.relative_to(package / layout['resourceDir'])))
          PY
          name=$(jq -r .pname "$NIX_LAYOUT")
          version=$(jq -r .version "$NIX_LAYOUT")
          program=$(jq -r .mainProgram "$NIX_LAYOUT")
          SPRAWLING_BIN="$PWD/result/bin/$program" nix develop --command lake exe acceptance version "$name" "$version"
          nix develop --command just acceptance target/nix-acceptance.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: nix-acceptance
          path: |
            target/acceptance/checklist.md
            target/acceptance/provider.err
