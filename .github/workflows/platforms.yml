# What ci.yml deliberately does not ask on every push.
#
# Three claims live here, and all three are about machines rather than
# about a change. A4/V8 assert byte identity across platforms, so a
# platform this workflow does not run is a promise rather than a fact. V5
# proves nine kernel properties against real MIR, which is Linux-only
# upstream and minutes long either way. The flake claims a person on NixOS
# can build this tree with the Rust version `rust-toolchain.toml` names,
# and only an evaluation of the flake can say whether that is so.
#
# They run on a schedule and on demand instead of on every push because a
# gate nobody waits for is a gate nobody runs - and a twenty-minute wait
# on every commit is how the fast gates stopped being read at all.
#
# Both are functions of the commit: judged twice, one commit gives one
# verdict. So the schedule asks first whether main has moved, and a night
# that changed nothing costs one checkout instead of two runners.
name: platforms
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Has main moved since the last scheduled run? The window is 25 hours,
  # one hour wider than the cron interval, so a commit that lands minutes
  # before a run is never missed by an off-by-one. Asking by hand always
  # runs: `workflow_dispatch` is itself the answer to "is this worth a
  # runner". The commit date comes from git rather than from an API, so
  # this job needs nothing but a checkout, so it was legal on ubuntu even
  # while Linux was kept out of the builds. That has since been
  # re-argued (sprawling-SPEC.md section 8-9): a native Linux runner never
  # touches a cross toolchain, which was the whole of the original reason.
  moved:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.head.outputs.verdict }}
    steps:
      - uses: actions/checkout@v7
      - id: head
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "verdict=run" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -lt 90000 ]; then
            echo "verdict=run" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=skip" >> "$GITHUB_OUTPUT"
            echo "main last moved $(( age / 3600 )) hours ago; nothing new to judge" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  # The same commands ci.yml runs, on the platform ci.yml never sees.
  #
  # macOS alone: this matrix used to carry a windows leg as well, which
  # was the same four commands ci.yml already runs on windows for every
  # push. A gate that repeats a gate teaches nobody anything and costs a
  # runner an hour a night, so the leg is gone rather than kept for
  # symmetry.
  macos:
    needs: moved
    if: needs.moved.outputs.verdict == 'run'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      # `guard` and `apisync` read one commit and its parent; ci.yml
      # gives the reasoning.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-public-api
      - name: nightly toolchain (rustdoc JSON for apisync)
        run: rustup toolchain install nightly --profile minimal
      # One job rather than ci.yml's five: nobody is waiting for this
      # one, and the sum of two builds costs a schedule nothing.
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: xtask gates
        run: cargo xtask gates
      - name: tests
        run: cargo nextest run --workspace --locked --all-features
      # See ci.yml: the cache's save step cannot walk trybuild's scratch.
      - name: clear the trybuild scratch before the cache is saved
        if: always()
        shell: bash
        run: rm -rf target/tests

  # The flake, judged the only way a flake can be judged: by evaluating it.
  #
  # Nightly rather than push, on the same policy as the macOS leg above,
  # and for a reason particular to Nix: it does not share
  # `Swatinem/rust-cache`, so without a binary cache one build compiles
  # the whole dependency graph from zero and far exceeds the push
  # pipeline's time budget. Nobody waits for this verdict, so it costs a
  # schedule nothing.
  #
  # `nix flake check` is what enforces the load-bearing rule: the flake
  # derives its Rust version from `rust-toolchain.toml`, and
  # `checks.toolchain-version-is-derived` turns a flake wanting any other
  # version red. `nix build` then proves the devshell's toolchain can
  # actually build the binary on a Linux the release now ships for.
  nix:
    needs: moved
    if: needs.moved.outputs.verdict == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: the version is derived, not restated
        run: nix flake check --print-build-logs
      - name: the binary this flake's toolchain builds
        run: nix build .#default --print-build-logs

  # V5: the propositions only a proof can hold. Linux-only upstream -
  # the one ubuntu build left in the pipeline, kept because the tool runs
  # nowhere else.
  #
  # Two, not nine, and the two facts line up exactly. Six harnesses
  # assert something about one concrete address and one concrete taint
  # source - `Address::parse(".sprawling/ledger")`, `TaintSource::new(
  # "web:x")` - which is a unit test wearing a proof's clothing, and the
  # file beside each one already holds that proposition as a `#[test]` or
  # as a proptest with a wider domain than the harness has (discard's
  # `allow_implies_every_guard_passed` takes any u64; the harness fixes
  # one value). Those same seven are the ones that build a Vec, a String
  # or a BTreeSet, whose loops CBMC cannot bound: they spent six hours,
  # then forty-five minutes under `--default-unwind 32`, and returned
  # nothing either time.
  #
  # These two carry a domain sampling cannot reach - every u64, every
  # four-byte input - and their loops are constant-bounded, so no global
  # unwind is passed: CBMC derives the bounds (`log2_q10` iterates ten
  # times). Both returned inside a minute when they were last timed, on
  # 2026-08-29.
  #
  # A third leg is gone rather than repaired: it named
  # `budget::verification::admit_spend_…`, and the spending ceiling that
  # proposition was about no longer exists anywhere in this tree. A
  # matrix leg that names nothing cannot go green, and there is nothing
  # left to prove about a rule that was deleted.
  #
  # A third harness, `secret::entropy_is_total_on_short_inputs`, is left out and
  # not forgotten: `entropy_millibits_per_char` calls `log2_q10` once per
  # slot of a 256-slot count table, and each call squares a u128 ten
  # times, so the harness hands the solver some 2,560 symbolic non-linear
  # multiplications and does not return inside fifteen minutes. Nothing
  # about a bound fixes that. The arithmetic core is proved on its own by
  # `log2_q10_is_total`; proving the whole function needs a harness over
  # one slot rather than over the table (kernel-SPEC.md section 2).
  #
  # One matrix leg per harness, so a red names the proposition that broke
  # rather than the tool that ran. The ceiling is a backstop rather than
  # a budget: a leg that takes ten minutes is a leg that stopped
  # converging, and it cannot be wrapped in `timeout` because the command
  # belongs to the action.
  kani:
    needs: moved
    if: needs.moved.outputs.verdict == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        harness:
          - backpressure::verification::admit_is_total_and_monotone_in_depth
          # `secret::scan::`, not `secret::`: the entropy judgment moved
          # into a module of its own, and this filter is matched against
          # the harness's fully qualified name.
          - secret::scan::verification::log2_q10_is_total
    steps:
      - uses: actions/checkout@v7
      - name: install pinned toolchain
        run: rustup show
      - uses: model-checking/kani-github-action@v1
        with:
          args: -p kernel --harness ${{ matrix.harness }}
