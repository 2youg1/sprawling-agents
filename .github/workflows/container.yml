# Real daemon evidence for the boundaries in runtime's Container specification.
name: container
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    env:
      CARGO_INCREMENTAL: "0"
      SPRAWLING_CONTAINER_TEST_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v7
      - name: pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: prepare the disposable daemon and immutable local image
        shell: bash
        run: |
          set -euo pipefail
          engine="${{ matrix.engine }}"
          if [ "$engine" = podman ]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends podman
          fi
          program="$RUNNER_TEMP/container-cli"
          printf '#!/bin/sh\nexec sudo %s "$@"\n' "$engine" > "$program"
          chmod +x "$program"
          "$program" pull docker.io/library/python:3.13-slim
          image=$("$program" image inspect docker.io/library/python:3.13-slim --format '{{.Id}}')
          case "$image" in sha256:*) ;; *) image="sha256:$image" ;; esac
          echo "SPRAWLING_CONTAINER_TEST_PROGRAM=$program" >> "$GITHUB_ENV"
          echo "SPRAWLING_CONTAINER_TEST_IMAGE=$image" >> "$GITHUB_ENV"
      - name: production execution, five axes and process cleanup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/container-evidence
          git rev-parse HEAD 'HEAD^{tree}' > target/container-evidence/source.txt
          cargo nextest run -p sprawling-runtime --run-ignored only -E 'test(a_real_daemon)' 2>&1 | tee target/container-evidence/isolation.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-${{ matrix.engine }}-${{ github.sha }}
          path: target/container-evidence
          if-no-files-found: warn
