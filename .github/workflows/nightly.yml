# What earns a slot on a schedule, and what does not.
#
# A scheduled run answers the one question a push cannot: what changed
# while nobody pushed. Exactly two inputs change that way - the world
# outside this repository (an advisory published today, a version yanked
# today) and a fresh draw of random bytes. Everything else is a function
# of the commit, so running it tonight against the commit it judged last
# night spends a runner to recompute an answer already on record.
#
# Gone by that rule: the thousand-session freeze-leak job. It ran
# citysim's `freeze_leak` binary, which `cargo nextest run --workspace
# --all-features` in ci.yml already runs on every push - the same test,
# the same commit, one platform apart. It was also the only job here that
# built the whole workspace on Linux, where `keyring`'s secret-service
# backend wants libdbus headers the runner does not carry, so it had
# failed every night since it was written. platforms.yml states the rule
# it broke: a gate that repeats a gate teaches nobody anything.
#
# Gone by a ruling: the public-API comparison of kernel and wire against a
# baseline rendered by a pinned nightly rustdoc. The project keeps no
# nightly toolchain for its own checks, and fuzzing, which needs one for
# its sanitizers, installs it inside its own job.
name: nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # V4: hostile bytes against the three parse surfaces. A new draw of
  # random input every night is what makes this a schedule rather than a
  # push gate; sixty seconds a target is a smoke length, and a real
  # campaign belongs on a dedicated runner rather than in a CI slot.
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install pinned toolchain and nightly
        run: |
          rustup show
          rustup toolchain install nightly --profile minimal
      # install-action carries no recipe for cargo-fuzz and falls back to
      # cargo-binstall, which fetches the musl build. Which is fine, and
      # is also why the next step names a target.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-fuzz
      # Three things this loop had to learn, each from a red night.
      #
      # `--target` is not optional. cargo-fuzz defaults it to the triple
      # cargo-fuzz itself was built for, so the musl binary above asked a
      # gnu runner for a musl `std` it does not have, and the sanitizer
      # refused the statically linked libc besides (rust-fuzz/cargo-fuzz#398).
      #
      # The list is taken before the loop rather than in its header:
      # under `bash -e` a command substitution that fails inside a `for`
      # header yields an empty list and a green step, so "no fuzz target
      # ran at all" would have looked exactly like success.
      #
      # `+nightly` explicitly: rust-toolchain.toml pins a stable release, and
      # cargo-fuzz needs the nightly-only sanitizer flags.
      #
      # The ceiling is inside the step rather than on the job: a job that
      # `timeout-minutes` kills is reported as *cancelled*, which reads
      # as "somebody stopped it" instead of "it broke". `timeout` exits
      # 124, and 124 is red. The job keeps its own ceiling as a backstop.
      - name: each target, sixty seconds
        shell: bash
        run: |
          set -euo pipefail
          targets=$(cargo +nightly fuzz list --fuzz-dir tools/fuzz)
          test -n "$targets"
          for target in $targets; do
            timeout 20m cargo +nightly fuzz run "$target" --fuzz-dir tools/fuzz \
              --target x86_64-unknown-linux-gnu -- -max_total_time=60
          done

  # V5 leaf 15.4: the one kani entry that reads like clippy - it scans a
  # crate and generates a harness for every function whose parameters all
  # implement `kani::Arbitrary`, so it finds panics, overflows and UB in
  # code nobody wrote a proposition about.
  #
  # **This job is a lead, not a verdict, and it must stay one.** It is
  # barred from `just check` and from the pull request's required checks,
  # for two reasons that will not expire soon: `autoharness` is an
  # experimental feature behind `-Z` whose upstream tracking issue is
  # still open, and the solver time it spends is a function of whatever
  # signatures the tree happens to carry today, so a green run tells you
  # nothing a person can hold a change against. The verdict a change is
  # held against is `proof` in ci.yml, whose roster `cargo xtask proof`
  # owns.
  #
  # It also cannot make another nightly job red: it is a job of its own,
  # it runs nothing the others need, and `continue-on-error` keeps the
  # workflow's own conclusion clear of it. What a finding costs is a
  # reading, and the report below is what gets read - the summary names
  # the failing harnesses, the artifact carries the counterexample
  # traces. Nothing files an issue from here, because an automatic issue
  # per night is a queue nobody drains; `issues: write` is deliberately
  # not granted.
  #
  # Scope is `kernel`, the crate whose invariants are worth a solver's
  # time and the only crate `cargo xtask proof` names. Inside it, the scan
  # skips what serde's derive and `#[derive(Eq)]` generate: paths through
  # the `_serde` alias the derive declares, and `assert_fields_are_eq`.
  # Nobody here wrote that code, it was more than half of the harnesses,
  # and a full scan did not finish in the ceiling. A hand-written serde or
  # Eq impl carries neither name and is still scanned. The derived Debug,
  # Clone and PartialEq impls stay in: their paths look exactly like
  # hand-written ones, and a hand-written Debug that redacts a secret is
  # worth a solver's time. Widen or narrow this with a measured run in
  # hand, not by default.
  #
  # kani is installed exactly as ci.yml's `proof` job installs it, from
  # the same pinned version, and for the same reason it lives on ubuntu
  # there: upstream builds kani for Linux only. A lead read against one
  # kani and a verdict held by another would disagree for a reason
  # nobody could see in the report.
  #
  # It runs when asked for (`gh workflow run nightly.yml`) and not on the
  # schedule: a lead that reads red every night teaches a reader to skip
  # the nightly verdict, and the advisories beside it are the red that
  # must be read the next morning.
  autoharness:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: autoharness
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: kani-cache
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani
          key: kani-${{ runner.os }}-${{ hashFiles('.github/workflows/kani-version.txt') }}
      - name: install the pinned kani
        if: steps.kani-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat .github/workflows/kani-version.txt)
          cargo install --locked "kani-verifier@$version"
          cargo kani setup
      # A broken install would produce an empty report, and an empty
      # report reads exactly like a clean one, so kani is made to answer
      # before the scan step can pass by scanning nothing.
      - name: kani answers, so the scan cannot report nothing
        run: cargo kani --version
      # The ceiling is inside the step as well as on the job: a job killed
      # by `timeout-minutes` is reported as *cancelled*, which reads as
      # "somebody stopped it". `timeout` exits 124. `shell: bash` runs with
      # `-e`, which is switched off around the scan alone, so the exit code
      # is recorded rather than ending the step, and "the scan ran out of
      # time" and "the scan found something" stay distinguishable in the
      # summary.
      - name: scan the kernel for what no proposition covers
        id: scan
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p target/autoharness
          set +e
          timeout 50m cargo kani autoharness -Z autoharness -p sprawling-kernel \
            --exclude-pattern '_serde' --exclude-pattern 'assert_fields_are_eq' \
            2>&1 | tee target/autoharness/report.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
      # The job reads red whenever the scan was not clean, which is what a
      # lead looks like; `continue-on-error` keeps the workflow's conclusion
      # clear of it.
      - name: what the scan says
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status='${{ steps.scan.outputs.status }}'
          report=target/autoharness/report.txt
          {
            echo "## kani autoharness (nightly lead, not a gate)"
            case "${status:-missing}" in
              0) echo "Every generated harness held. Nothing to read below." ;;
              124) echo "The scan hit its fifty-minute ceiling. The partial output is attached; narrow the scope before reading it as a finding." ;;
              *) echo "The scan reported failures (exit ${status:-missing}). Each line below names a function whose generated harness did not hold - read it as a lead and reproduce it with a written \`#[kani::proof]\` before changing any code." ;;
            esac
            if [ -s "$report" ]; then
              echo
              echo '```'
              grep -E 'Failed|FAILURE|Status: |VERIFICATION' "$report" | head -n 60 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          test "${status:-missing}" = 0
      # The full log, counterexample traces included: the summary holds
      # the headline, and the trace is what a person needs to write the
      # harness that turns a lead into a proposition.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: autoharness-report
          path: target/autoharness/report.txt
          if-no-files-found: warn

  # Advisories and yanked versions: the one check in this repository whose
  # input is written by other people at a time of their choosing. On a
  # pull request it would turn a change red for a reason its author cannot
  # act on, which is how people learn to ignore a red build; here red
  # means "go and look today". It compiles nothing - it reads Cargo.lock -
  # so it is also the cheapest job in the repository.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-deny
      - name: what has been published against what we depend on
        run: cargo deny check advisories
