[package]
name = "sprawling-agent-protocols"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "MCP out to a server, ACP in from an editor and ACP out to a harness, as a sprawling city speaks them."

[lib]
name = "agent_protocols"

[features]
# A child that answers every line with one fixed result, for the tests of
# a crate that wires MCP servers in. Off in every build a person runs.
conformance = []

[dependencies]
# An MCP stdio server and an ACP agent both start from `child::command`:
# off the city's console, without the city's secret keys
# (`crates/agent_protocols/Spec.lean` D16, `crates/child/Spec.lean`).
child = { workspace = true }
kernel = { workspace = true }
# An MCP server reached over HTTP gets its client from
# `gateway::client_for`, and a `secret:realm/name` reference beside a
# server is redeemed through `gateway::SecretResolver`.
gateway = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
