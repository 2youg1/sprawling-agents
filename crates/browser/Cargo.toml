[package]
name = "sprawling-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "A browser a sprawling city drives over WebDriver BiDi, and what a model may see of a page and do to it."

[lib]
name = "browser"

[dependencies]
kernel = { workspace = true }
# The probe answers with three named strings; naming them in a
# type is cheaper than three hand-written lookups at each reader.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# A screenshot arrives base64-encoded on the protocol and is measured and
# compared as pixels. Neither is a parser this crate should write itself.
base64 = { workspace = true }
png = { workspace = true }

[lints]
workspace = true
