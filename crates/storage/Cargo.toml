[package]
name = "sprawling-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "The append-only, hash-chained Ledger of a sprawling city, its content store, checkpoints and worktrees."

[lib]
name = "storage"

[dependencies]
kernel = { workspace = true }
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
thiserror.workspace = true
# Checkpoints: git is the restoration authority for tracked files, so
# the pre-wave commit oid is what a file_discarded points back at.
git2.workspace = true

# The link count of a file on Windows: std reads it only on the unstable
# `windows_by_handle` feature, and this crate writes no unsafe
# (`crates/storage/spec/Alias.lean` §8-25).
[target.'cfg(windows)'.dependencies]
winapi-util.workspace = true

[features]
fault = []
conformance = ["kernel/conformance"]

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
trybuild.workspace = true

[lints]
workspace = true
