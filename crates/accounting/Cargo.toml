[package]
name = "sprawling-accounting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "The one writer of a sprawling city's Ledger, the views every page is answered from, and the ports it reaches outside through."

[lib]
name = "accounting"

[dependencies]
kernel = { workspace = true }
storage = { workspace = true }
# A stored version's bytes reach a page base64-encoded
# (`crates/wire/spec/Answer/DocumentBytes.lean` §8-80).
base64 = { workspace = true }
gateway = { workspace = true }
runtime = { workspace = true }
agent_protocols = { workspace = true }
city = { workspace = true }
collab = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The bytes a views snapshot is written in (`crates/sprawling/Spec.lean` §8-91).
postcard = { workspace = true }
# The person's own layer is TOML for the reason a city's CONFIG.toml is:
# it is a file somebody edits by hand while the city is stopped.
toml = { workspace = true }
# The vocabulary only: the port hands back a wire answer and never listens.
wire = { workspace = true }
# What a document's bytes are and where its windows are cut
# (`crates/accounting/Spec.lean` §8-21).
documents = { workspace = true }
# A secret the worker holds for a moment is wiped when it is dropped.
zeroize = { workspace = true }
# A playback page read as a browser's parser builds it, and the CSS inside
# it read by the CSS Syntax tokenizer (`crates/accounting/Spec.lean` §8-13).
html5ever = { workspace = true }
cssparser = { workspace = true }
# Two questions a playback export asks before it lands: does git track
# this name, and does it ignore it. Read-only; the same libgit2 storage
# links (`crates/accounting/Spec.lean` §8-13, accounting D25 (h)).
git2 = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
# The deterministic power-loss model, so a test above the ledger can lose
# one named line and assert the city did not move. Kept to dev only.
storage = { workspace = true, features = ["fault"] }
# The Ledger port's own assertion suite, so the relay adapter is held to
# the same assertions as the two adapters that own a medium.
kernel = { workspace = true, features = ["conformance"] }
# A child that answers every line with one fixed result, so the wiring
# of a building's servers is driven through a real pipe.
agent_protocols = { workspace = true, features = ["conformance"] }

[lints]
workspace = true
