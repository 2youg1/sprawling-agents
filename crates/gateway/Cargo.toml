[package]
name = "sprawling-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "Everything between a sprawling city's decision to call a model and the bytes on the wire, and the vault for its credentials."

[lib]
name = "gateway"

[dependencies]
kernel = { workspace = true }
# The prefix of the environment keys the vault reads, defined once where
# every child process's environment is scrubbed of them (`crates/child/Spec.lean`).
child = { workspace = true }
serde.workspace = true
serde_json.workspace = true
# Constitution B.7: HTTP with rustls; the wire format stays self-written,
# the transport does not (`crates/gateway/Spec.lean` §10). Blocking: the turn loop is
# synchronous, and one HTTP call must not asyncify the library.
reqwest = { workspace = true }
# Named for one call: `reach::tls` installs aws-lc-rs as the process's
# rustls provider before any client is built (`crates/gateway/Spec.lean` §8-15).
rustls.workspace = true
# Custody: platform credential service binding + zeroizing storage.
# keyring-core carries the entry and its errors; each target names its
# own store below (`crates/gateway/spec/Credential.lean` §8-4; gateway D15 says why not `keyring`).
#
# The Linux store is keyutils (the kernel's own keyring, reached by
# syscall) rather than a secret service, and the release artifact is
# what decides it: a static musl binary and a D-Bus secret service
# cannot both be true, because `libdbus-sys` links the host's glibc
# D-Bus. keyutils needs no bus, no dynamic library and no desktop
# session, so it holds for a container and a login shell alike. What it
# costs is stated in the type: a value kept there lives for one boot,
# which is `Persistence::ThisBoot` and nothing longer.
keyring-core = "1"
zeroize.workspace = true
# The one base64 encoder both provider wires take pictures in, and the
# encoding the encrypted vault file records a nonce and a ciphertext in.
base64.workspace = true
# The encrypted vault file (`crates/gateway/Spec.lean` §8-21): one AEAD, one password KDF.
# `FileVault` is the only reader of either, and it reaches them only on a
# machine whose credential service refuses to keep a value.
chacha20poly1305.workspace = true
argon2.workspace = true
# The salt and the nonce come from the operating system, never from the
# seeded generator the simulator runs on.
getrandom.workspace = true

[target.'cfg(windows)'.dependencies]
# Without `search`, which would bring regex for a listing nothing reads.
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1"

[dev-dependencies]
insta.workspace = true
proptest.workspace = true

[lints]
workspace = true
