[package]
name = "sprawling-wire"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "The process boundary of a sprawling city: the frames its clients speak, and the server that answers them."

[lib]
name = "wire"

[features]
# The listener. Off for the crates that need this crate's vocabulary and
# not a TCP stack (accounting, xtask, fuzz).
default = ["server"]
server = ["dep:tokio", "dep:axum", "dep:futures-util"]
# The JSON Schema of the whole envelope, which `cargo xtask wire-ts` turns
# into the TypeScript client's types (`crates/wire/spec/Frames.lean` §8-16). Off
# for the product binary: it does not ask what its frames look like, and
# the answer must not travel to a browser.
schema = ["dep:schemars", "kernel/schema", "documents/schema"]

[dependencies]
kernel = { workspace = true }
# The document answers carry its spans, formats, encodings and windows
# (crates/documents/Spec.lean D1).
documents = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true }
axum = { workspace = true, features = ["ws"], optional = true }
# `feed` and `flush` on the socket, so a frame of records is flushed once
# (`crates/wire/spec/Server/Socket.lean` §8-47h).
futures-util = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
trybuild = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
