[package]
name = "memory"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kernel = { path = "../kernel" }
serde_json.workspace = true
blake3.workspace = true
thiserror.workspace = true
# Checkpoint fences: git is the restoration
# authority for tracked files, so the pre-wave commit oid is what a
# file_discarded points back at. vendored libgit2, no system dependency.
git2 = { version = "0.21", default-features = false }

[features]
fault = []
conformance = ["kernel/conformance"]

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
