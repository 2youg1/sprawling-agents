[package]
name = "sprawling-desktop-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "The Zig leaf behind the desktop server's one FFI seam, offered as safe functions."
# The leaf is built by `build.rs` with the standard library alone, and
# linked under this one name (`crates/desktop/Spec.lean` D12).
links = "sprawling_desktop_leaf"

[lib]
name = "desktop_ffi"
path = "src/lib.rs"

[features]
# The window a contract test opens in its own process, and the made-up
# handles a bookkeeping test names: test scaffolding, which only the
# desktop server's Windows dev-dependencies switch on, so no shipped
# binary carries it (`xtask artifact`).
fixture = ["dep:windows"]

[target.'cfg(windows)'.dependencies]
winsafe = { workspace = true }
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# The workspace's lint table, written out because one line differs:
# `unsafe_code` is `deny` rather than `forbid`, so each call into the Zig
# leaf can relax it at that one statement, with a written reason. Every
# other key is the workspace's own, and `xtask guard` holds this table to
# `[workspace.lints]` key by key (`crates/desktop/Spec.lean` D14).
[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(kani)"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
dbg_macro = "deny"
wildcard_enum_match_arm = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
fn_params_excessive_bools = "deny"
