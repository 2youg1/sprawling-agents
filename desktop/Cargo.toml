# The desktop server and its one FFI seam, `ffi`, built outside the root
# workspace (root `Cargo.toml`, `exclude`). The two packages share the one
# wall below: the package metadata, the lint table and the version of
# `winsafe` are stated here once and inherited by both, and `xtask guard`
# compares this wall with the root workspace's key by key
# (desktop-SPEC.md section 8-12).
[workspace]
members = ["ffi"]

[workspace.package]
version = "0.0.7"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.97"
publish = false

[workspace.dependencies]
# Safe Rust over the Win32 calls admitted operation by operation
# (desktop-SPEC.md sections 8-11 and 12.9): input, the facts of a window,
# and the handle and error types the seam hands back. `user` is those
# calls and nothing of the GUI layer above them; `ole` is the guard that
# enters and leaves the tree's COM apartment, and the HRESULT type.
winsafe = { version = "0.0.29", features = ["user", "ole"] }

# The workspace lint table, copied rather than inherited: these packages
# are not members of the root workspace. One line differs: `unsafe_code`
# is `deny` rather than `forbid`, so each call into the Zig leaf can
# relax it at that one statement, with a written reason.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
dbg_macro = "deny"
wildcard_enum_match_arm = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
fn_params_excessive_bools = "deny"

[package]
name = "sprawling-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "An MCP server that gives an agent eyes and hands on this Windows desktop."

[lib]
name = "sprawling_desktop"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# An image crosses this wire base64-encoded, as it does on both
# provider wires in the workspace. Same version line as the workspace's
# own, which `guard`'s wall compares key by key - a copy that drifts is
# a second answer to which base64 this build links.
base64 = "0.23"
# The three encoders `desktop.screenshot` names, and nothing
# else — no decoders, no other formats. `webp` here is the lossless
# encoder, which is why `quality` does not reach it (desktop-SPEC.md §14).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(windows)'.dependencies]
# The seam: enumeration, capture, the clipboard and DPI awareness, the
# four call groups with no admitted safe interface (desktop-SPEC.md
# sections 8-11 and 8-12).
desktop_ffi = { package = "sprawling-desktop-ffi", path = "ffi" }
# The constants the safe calls read, the `HWND` UI Automation is handed,
# and the error type a Win32 failure is told in. No function of this
# binding is called outside tests, so no namespace that exists only to
# call one is switched on.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
winsafe = { workspace = true }
# The UI Automation tree, read through safe calls (desktop-SPEC.md
# section 12.10). Its `control` default adds control matching, and its
# other features add screenshots and the clipboard, which this package
# does elsewhere or not at all, so they stay off. `input` stays on only
# because the crate's core module does not compile without it.
uiautomation = { version = "0.25.1", default-features = false, features = ["input"] }

[dev-dependencies]
tempfile = "3"

# What the tests call to build windows of their own and to count the GDI
# objects this process holds; nothing here reaches the server.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_System_Threading"] }

[lints]
workspace = true

# The same release profile as the workspace's own, for the same reason:
# a size is a fact about the linker that produced it, and this connector
# ships to the same machines. `"z"` was chosen there on a measurement -
# see the `[profile.release]` comment in the root manifest.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
