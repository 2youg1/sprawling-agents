[package]
name = "sprawling-desktop"
version = "0.0.4"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.97"
publish = false
description = "An MCP server that gives an agent eyes and hands on this Windows desktop."

[lib]
name = "sprawling_desktop"
path = "src/lib.rs"

[[bin]]
name = "sprawling-desktop"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# An image crosses this wire base64-encoded, as it does on both
# provider wires in the workspace. Same version line as the workspace's own.
base64 = "0.22"
# The three encoders `desktop.screenshot` names, and nothing
# else — no decoders, no other formats. `webp` here is the lossless
# encoder, which is why `quality` does not reach it (desktop-SPEC.md §14).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# The Win32 and UI Automation bindings. Only the namespaces the
# six tools reach are switched on, so a call this package never makes is
# not even nameable here.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

# The workspace lint table, copied rather than inherited: this package is not a
# workspace member (root `Cargo.toml`, `exclude`). One line differs, and the
# difference is the reason this package sits outside — `unsafe_code` is `deny`
# rather than `forbid`, so the Win32 boundary can relax it at one
# call site with a written reason instead of everywhere. This card writes no
# `unsafe` at all.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
dbg_macro = "deny"
