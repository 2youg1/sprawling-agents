[package]
name = "sprawling-desktop"
version = "0.0.3"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.97"
publish = false
description = "An MCP server that gives an agent eyes and hands on this Windows desktop."

[lib]
name = "sprawling_desktop"
path = "src/lib.rs"

[[bin]]
name = "sprawling-desktop"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[dev-dependencies]
tempfile = "3"

# The workspace lint table, copied rather than inherited: this package is not a
# workspace member (root `Cargo.toml`, `exclude`). One line differs, and the
# difference is the reason this package sits outside — `unsafe_code` is `deny`
# rather than `forbid`, so the Win32 boundary of card 7.2 can relax it at one
# call site with a written reason instead of everywhere. This card writes no
# `unsafe` at all.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
dbg_macro = "deny"
