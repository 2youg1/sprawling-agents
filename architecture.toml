# The module map: one entry per module file, and the duty of each crate.
#
# This is the machine's data face. `cargo xtask modmap` is its only reader
# and refuses a `.rs` file under `crates/*/src` that has no entry here, as
# well as an entry whose file is gone. A reader who wants one module asks
# for it by name rather than scanning a table.
#
# `owns` and `since` are for a person: no gate reads them. Every other
# field is checked — `file` against the tree, `shape` by `length`, `spec`
# by `specalign`, and `status` against whether the file exists.

