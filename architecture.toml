# What each family of modules is for. Keyed by the prefix its module
# names carry, which is the crate for all but `bin`, whose files sit in
# `crates/sprawling/src`. This is the one list of duties: ARCHITECTURE.md
# section 1 draws the units and their wiring only, and the crate table in
# crates/README.md is rendered from these lines.

[family.kernel]
duty = "every decision in the city, and nothing that touches a disk"

[family.storage]
duty = "persistence, and every view derived from it"

[family.gateway]
duty = "everything between a decision to call a model and the bytes on the wire"

[family.runtime]
duty = "one run, from dispatch to freeze"

[family.collab]
duty = "several residents in one building, without stepping on each other"

[family.city]
duty = "space, identity, and the documents a building keeps"

[family.wire]
duty = "the process boundary"

[family.remote_access]
duty = "the remote door, and the routes that carry its bytes and decide nothing"

[family.browser]
duty = "a browser driven over WebDriver BiDi, and what a model may see of a page and do to it"

[family.documents]
duty = "the rules of a document a person reads and edits through a page: its version, its characters, its windows, and what one save changes"

[family.agent_protocols]
duty = "MCP out to a server, ACP in from an editor, and ACP out to a harness"

[family.accounting]
duty = "the city's one writer, the views every page is answered from, and the ports the writer reaches outside itself through"

[family.bin]
duty = "the assembly root: every concrete type, the one clock, the one spawn point, and the command line"

[family.desktop]
duty = "this Windows desktop, offered as an MCP server, and the one FFI seam beneath it"

[family.citysim]
duty = "out of product: scripted scenarios on a counted clock, and the benches that time the product"
