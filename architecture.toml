# What each family of modules is for. Keyed by the prefix its module
# names carry, which is the crate for all but `bin`, whose files sit in
# `crates/sprawling/src`.

[family.kernel]
duty = "every decision in the city, and nothing that touches a disk"

[family.memory]
duty = "persistence, and every view derived from it"

[family.gateway]
duty = "everything between a decision to call a model and the bytes on the wire"

[family.runtime]
duty = "one run, from dispatch to freeze"

[family.collab]
duty = "several residents in one building, without stepping on each other"

[family.city]
duty = "space, identity, and the documents a building keeps"

[family.eval]
duty = "whether a change made the city better"

[family.channels]
duty = "the process boundary"

[family.desktop]
duty = "out of tree: this Windows desktop, offered as an MCP server"
