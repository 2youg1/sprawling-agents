# A test that hangs never fails: without a limit, nextest waits on it for
# as long as its parent lives, and when the parent is killed the hung
# test binary outlives it and holds the target directory open. Three
# minutes is five times the slowest ordinary test on a slow four-core
# machine; the trybuild suites compile counterexamples, and a cold cache
# takes them past ten minutes, so they have their own limit.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# Every desktop test whose name carries `clipboard` touches the machine's
# real clipboard. `TURN` and `PAIRS` are one-per-process locks, and this
# runner gives every test its own process, so between these tests the
# exclusion is this group's single thread rather than any lock in the
# code: two of them side by side swap each other's text between a write
# and the read that follows it.
[test-groups]
clipboard = { max-threads = 1 }

[[profile.default.overrides]]
filter = '(package(sprawling-desktop) | package(sprawling-desktop-ffi)) & test(clipboard)'
test-group = 'clipboard'

[[profile.default.overrides]]
filter = 'binary(trybuild)'
slow-timeout = { period = "120s", terminate-after = 10 }

# The throughput instrument includes provider holds over all selected arms.
# Its measured arm exceeds the ordinary-test timeout; only the opt-in bench
# profile gives this instrument an hour to finish the full matrix.
[profile.bench]

[[profile.bench.overrides]]
filter = 'package(sprawling-accounting) & test(instrument_throughput)'
slow-timeout = { period = "60s", terminate-after = 60 }
