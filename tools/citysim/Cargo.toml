[package]
name = "citysim"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The simulator is a tool of this repository, not part of the product:
# the members reader keeps a tool out of the crate graph and the module
# map, and reads every line of it as a check (xtask-SPEC.md sections 8-39
# and 12-4).
[package.metadata.sprawling]
role = "tool"

[dependencies]
kernel = { workspace = true, features = ["conformance"] }
storage = { workspace = true }
runtime = { workspace = true }
gateway = { workspace = true }
collab = { workspace = true }
wire = { workspace = true, features = ["server"] }
sprawling = { workspace = true }
# The bench times the production rebuild through accounting::views::ask.
accounting = { workspace = true }
serde_json.workspace = true
# The nesting instrument reads the TOML shape it grades (citysim-SPEC.md 8-8).
toml.workspace = true
# The install action prices the release archive's digest and its unpack
# (citysim-SPEC.md 8-5): sha2 is the digest the release publishes, zip
# is the archive format `cargo xtask package` writes.
sha2.workspace = true
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true
zeroize.workspace = true

[lints]
workspace = true
