best_count = 14
slack_count = 0

# Text-only spec parts under the anchors of `state machine` and `typestate` modules; may only fall (tools/xtask/Spec.lean §8-42, assertion 6).
[spec_parts_without_theorem]
pinned = 9

# Backticked crate paths in .lean, .md and rustdoc that resolve to no item; may only fall (§8-42, assertion 7). TP2 removes the gateway::admission ones.
