# The performance register. One row per budget the design states, and the
# best reading recorded so far.
#
# `xtask budget` refuses two things: a reading above `budget_bytes`, and a
# reading worse than `best_bytes` by more than `slack_bytes`. The second is
# the ratchet - a number may improve freely and may drift only within the
# slack, so a gradual regression cannot arrive one commit at a time.
#
# A metric is gated only when a machine can measure it the same way twice.
# Wall-clock figures depend on the machine that ran them, so they are
# measured and reported with their machine rather than gated; gating them
# would make a busy runner look like a defect. Each such row says what it
# needs, so nobody has to guess why it is not enforced.
#
# Every duration a field holds is a whole number of microseconds, and the
# field's name ends in `_us` (`_ns` for an in-process reading below one
# microsecond): a millisecond field cannot tell 0.4 ms from 0 ms, and a
# reading taken in microseconds is never rounded twice. A page or a
# terminal shows a duration below 10 ms in µs and one of 10 ms or more in
# ms (`crates/sprawling/spec/Main.lean` §8-129-2, *单位*).

# The reading is the bundle a browser downloads, gzipped, walked
# recursively so every chunk the page loads is on the scale.
#
# 288,972 is this version's reading, and it is two changes rather than a
# drift. **Half of it is two faces**: Geist Sans and Geist Mono ship as
# variable woff2 (145,724 B of the reading, already compressed, so gzip
# takes nothing more off them), because a client whose type stack begins
# with whatever the machine happens to have is a different product on
# every machine. The other half is the screens: one implementation per
# control instead of a class string per view, a model table that can state
# an output ceiling, a keyboard whose chords are data, an MCP page built
# around what a person already knows from another tool, and a city page
# that says what it is showing.
#
# The row's `what` lost its "fonts excluded" clause in the same pass: a
# browser downloads the faces, so a reading that leaves them out reports
# on something nobody receives. The slack is unchanged at 20 KB, and the
# headroom against the 2 MB budget is 7.3x - which is still not where the
# next reading deserves attention.
#
# The earlier readings on this row weighed a WebAssembly client that has
# since left the tree, so none of them is comparable and none is kept.
#
# Reset once more at V0.0.6, and for the same reason: the client the
# browser downloads is no longer the one 288,972 B described. Four
# screens arrived together - the artefact panel beside a conversation,
# the read-only code view with its own lexer, the external-asset
# registry, and the tool-trace summary - and they are 22 KB of the
# 311,050 B recorded here. The ratchet is not being loosened: the slack
# stays at 20 KB, so the next gradual regression is caught exactly as
# before, against a figure that describes what ships today.
# The syntax highlighter (client/Spec.lean §4-26) is weighed here too, though
# the first screen never downloads it: the directory holds it, and the
# binary embeds every byte the directory holds. It adds 166,127 B
# gzipped - the highlighter chunk 9,918 B and ten grammar chunks from
# 1,067 B to 32,840 B - while the entry chunk lost about 660 B with the
# lexer it replaced. The best reading moves by that difference and the
# slack stays at 20 KB.
# Several screens arrived together once more, each inside the slack on
# its own and 24 KB over it together: the city's runs board and its
# lineage tree, the drawn wire fields, the prefilled recovery form,
# browser notifications, the editor links, the combobox and the empty
# states, with their gallery fixtures. The best reading is what ships
# with them; the slack stays at 20 KB.
[frontend_artifact]
what = "the client the browser downloads, gzipped, the two shipped faces included"
budget_bytes = 2097152
# The bundle the deliverable ships, gzipped, fonts included: the view
# tree carries the storybook and its fixture tables, which ship with
# the client on the `#/gallery` route (client/Spec.lean §7), and this is
# what the client weighs with them. The row is a reading, not a gate:
# runtime speed comes before size, so the bytes are printed and nothing
# refuses them; best_bytes is the last recorded reading. The
# reading rose by 30 KB when the talk thread, the setup screens, the
# building and monitor views and their gallery fixtures grew by about
# nine thousand lines of view code, none of it dead. It rose by 20 KB
# more when the wire schema the client decodes grew by four queries,
# the guide command, the versioned document and range shapes and the
# remote door's five event kinds, and the client gained the document
# reader and the guide command that use them. It rose by 78 KB when the
# shell's client halves landed: RefRain's editor chunk, the inspector,
# the workbench, the settings panel, the mailbox and the redesigned
# pages with their fixtures, and the move from Effect 3 to Effect 4.
best_bytes = 677073
measured_by = "just build-web, then cargo xtask budget (the whole dist directory, recursive)"
status = "reported, not gated: the person's ruling that runtime speed comes before size"

# The remediation pass found the single-binary promise was hollow: build.rs
# embedded a 1,306-byte placeholder and the real client never shipped. The
# binary now carries the whole gzipped bundle (about +330 KB), and the gate
# refuses a release binary whose file table lacks the client assets, so this
# cannot regress silently. The ratchet holds the line from the first honest
# reading.
# The reading is taken from a freshly linked binary rather than off a stale
# artifact. Two earlier growths are on record and both were bought rather
# than drifted: tokio's `signal` feature, which is what lets a Windows
# console deliver both of its stop signals to a city that must close its
# ledger cleanly - a binary that exits without that is smaller and wrong -
# and the client bundle itself, once build.rs stopped embedding a
# placeholder.
#
# 9,937,920 is this version's reading, 1.26 MB above the last one. What the
# binary gained: a browser it drives over BiDi and the image handling that
# carries a screenshot back as evidence, a doctor that answers what the
# running machine has, a search tool beside `read`, and the compressor that
# fits a tool result into a window. Each is a capability a resident calls,
# not a dependency that arrived unasked. 13.5x headroom against the 128 MB
# budget says the next reading to spend attention on is not this one.
#
# **The ratchet moved on 2026-09-21.** The previous number was taken on
# 2026-09-13 from a tree fourteen commits behind this one, and the
# machine that reads this row now links every MSVC target with
# `lld-link`, a build setting that lives in the machine's own cargo
# configuration rather than in the repository. Which of the two moved
# the figure is not separated here, and it does not need to be: a size
# is a fact about the linker that produced it, which is why this row
# names the platform its reading was linked on. The release profile is
# `opt-level = 3`, chosen on runtime speed rather than against this row,
# and the row records a binary linked that way: 26,819,584 B, against
# 15,135,744 B for the same tree at `"z"` and 17,560,576 B at `"s"`.
[release_binary]
what = "the single binary a person installs, with the execution engine its sandbox needs and the web client already inside it"
budget_bytes = 134217728
# The reading rose by 1.3 MB when the console, the health readings and
# the sandbox's file capabilities arrived: crossterm, sysinfo, cap-std
# and memory-stats, with about 28,000 lines of Rust around them.
# It rose by 243,712 B more when the desktop connector moved into this
# binary as the `desktop` verb (`crates/sprawling/Spec.lean` §8-4d): 12,916,224 B on
# the tree before, 13,159,936 B after, linked the same way. That buys no
# second executable to install and no hand-written [[mcp]] row. The
# separate executable weighed 670,720 B, most of it std, serde_json, toml
# and png, which this binary already carried; what is new is the
# package's own code, the image encoders and the Win32 bindings. Since
# the person ruled that runtime speed comes before size, this row is a
# reading, not a gate: the bytes are printed and nothing refuses them,
# and best_bytes is the last reading recorded here. UI Automation (uiautomation, winsafe, chrono)
# brought the reading to 13,524,992 B, 365,056 B over the best and inside
# that slack, so the connector stays linked here.
best_bytes = 26819584
measured_by = "just build-web, just dist, then cargo xtask budget, on windows-x86_64"
status = "reported, not gated: the person's ruling that runtime speed comes before size"

# The unit is a production function because the alternative was measured:
# any honest file threshold lights up eight files across four crates at
# once, which is a project rather than a gate. Across 1,800 production
# functions the median is 9 lines, p90 is 39 and p99 is 145, so 200 sits
# well above where the repository actually writes; what it catches is a
# whole flow of control written into one body. `dispatch_in` was 1,069
# lines when R2 opened and is 158 now, in nine cuts.
#
# Not measured, each read from an authority that already exists rather
# than from a list kept beside the gate: an item marked `#[cfg(test)]`,
# and a file whose module-map row states the shape `data`.
[function_length]
what = "one production function, from its `fn` to its closing brace"
budget_lines = 200
measured_by = "cargo xtask length (syn spans, not brace counting)"
status = "gated"

# A long function hides a flow of control; a long file hides where
# anything is. The second is what the person asked for on 2026-09-02,
# after the largest file reached 12,078 lines and iteration on it began
# costing more than the split would.
#
# Tests count. A `#[cfg(test)] mod tests` is exempt from the *function*
# rule, because a long test is a different question from a long body -
# but a reader looking for one thing pays for every line above it either
# way, and in the file that prompted this rule the tests were 6,133 of
# the 12,078.
# "The ideal number of arguments for a function is zero. Next comes one,
# followed closely by two. Three arguments should be avoided where
# possible. More than three requires very special justification - and
# then shouldn't be used anyway." A long parameter list is a data clump:
# the values that always travel together are one value that has not been
# given a name yet, and this repository already contains the fix it is
# asking for. `Reporter` says it in its own doc - "Four values that
# always travel together and are never chosen independently, so they
# travel as one".
#
# The budget is 4 rather than Bob's 3, because 3 is the number a
# constructor for a three-field value legitimately needs and the gate
# should not argue with those.
[argument_count]
what = "one function's parameters, not counting a receiver"
budget_arguments = 4
measured_by = "cargo xtask length (syn signatures)"
status = "gated, with a register of the signatures that predate the rule"

# The signatures that predate the rule (2026-09-02), worst first. A name
# not on this list is refused outright, so the list cannot grow; a
# signature is struck from it by giving the values that travel together a
# name, never by widening the budget. How many remain is what the list
# below says; a count written here as well would be the second home of a
# number this file already states, and it was wrong within four commits
# of being written.
#
# The register cleans itself. `cargo xtask length` reports a name that
# has come back inside the budget, and a name that is no longer in the
# tree, in the same words the file register and `boundary`'s use — so an
# exception disappears when it is spent instead of silently re-excusing
# whatever is written at that address next.
#
# Sixteen of the original forty-two were in `bin::assembly`, and so were
# the worst six. That was the file rule's finding reached from another
# direction: the module is declared `adapter` - "thin, no policy" - and
# held the city's dispatch policy instead, and an eleven-parameter
# private method is what policy looks like when it has no object to live
# in. Fifteen of them were spent splitting that file, because putting it
# `assembly/` would otherwise have carried each excuse to a new address -
# which is the one budgets.toml edit `guard` will not treat as a strike.
[argument_count.predating]
names = [
  "crates/collab/src/workshop.rs::new",            # 9
  "crates/collab/src/inbox.rs::new",               # 7
  "crates/collab/src/signal_tool.rs::new",         # 6
  "crates/runtime/src/turn.rs::assemble",          # 6
  "crates/accounting/src/effect.rs::of",            # 6
  "crates/accounting/src/effect.rs::shelf",         # 6
  "crates/browser/src/act.rs::frame_for",          # 5
  "crates/city/src/archive.rs::entry",             # 5
  "crates/collab/src/pr_tool.rs::new",             # 5
  "crates/kernel/src/config.rs::freeze",           # 6  # 5→6: the second-rung ladder is the sixth concern of crates/kernel/Spec.lean §8-22
  "crates/runtime/src/digest.rs::digest_once",     # 5
  "crates/runtime/src/fork/lineage.rs::fork_draft",        # 5
  "crates/runtime/src/handoff.rs::new",            # 5
  "crates/runtime/src/run.rs::drive",              # 5
  "crates/runtime/src/turn.rs::call",              # 5
]

# **Re-priced from 1000 to 400 on the person's ruling, 2026-09-05.** The
# 1000-line line was drawn against a tree whose largest file was 12,078
# lines, and it did what it was drawn to do: the register it arrived with
# emptied, and `bin::assembly` went from 10,695 lines to an `assembly/`
# directory. A budget whose register is empty has stopped being a budget -
# it now permits every file in the tree - and the reader it was drawn for
# is no longer only a person. A file is read into a model's context whole,
# and 400 lines is where a module still arrives as one unit next to the
# other files a change has to be read against.
#
# The new line lights up 97 of the 250 files it measures. That is the
# project the previous re-pricing named and deferred, and it is deferred
# again on the same ruling: **the register below is the backlog, worst
# first, and working it off is the next version's P0.** What is bought
# today is the ratchet - nothing new may be born over 400 lines, and
# nothing already over it may grow.
[file_length]
what = "one source file under a crate's src/ or under client/src, every line of it, tests included"
budget_lines = 400
measured_by = "cargo xtask length"
status = "gated, with a register of the files that predate the rule"

# The files that were already over the line on the day it was re-drawn
# (2026-09-05), each pinned at the length it had that day, worst first.
# Ninety-seven of them on that day; the last row was struck on
# 2026-09-08, and the Rust half of the table below is empty by
# construction - it keeps its three properties over nothing.
#
# **The client arrived on 2026-09-19**, when `xtask length` reached
# `client/src`. The 400-line rule had been stated for the whole
# repository and executed on Rust only, so 18,000 lines of TypeScript
# were read by the same two readers with nothing holding the line - the
# six rows below are what that cost, and they are pinned at the length
# each file had on the day the gate reached it. They carry the same
# three properties every other row does, and they are worked off the
# same way: by splitting the file, never by raising its number.
#
# `client/src/wire.ts` (2,445 lines) is not here and never will be.
# `cargo xtask wire-ts` writes it from the Rust wire, so its length is a
# fact about the generator; the gate reads the exemption from the banner
# the generator puts at the top rather than from a path written here.
#
# `tools/xtask/src/length.rs` is on this list, which is correct: the gate that
# states the rule is not exempt from it.
#
# This list has three properties, and it needs all three to be an
# honest debt rather than a licence. A file it does not name is refused
# at budget_lines outright, so **it cannot grow**. A file it does name
# may not exceed its pin, so **no offender grows**. And a file that comes
# back under budget_lines must be struck from the list, so **it removes
# itself** as the work gets done.
#
# Delete a row by doing the split, never by raising its number.
[file_length.predating]
# Empty. The one entry this register held (`talk/composer.tsx = 478`) was
# struck when the Solid client retired with the port; a stale entry is
# refused by the gate, which is exactly how the list stays honest.

# White box is Rust, black box is Lean (the person's ruling).
# `cargo xtask boundary` refuses a Rust check that reaches this product
# across a process boundary; `tools/adversary/` is where such a check belongs,
# in a language with none of this repository's vocabulary, so it can
# testify about a client that shares none of its assumptions.
#
# Nothing predates the rule any longer. `crates/wire/tests/enrolment.rs`
# used to stand up the enrolment endpoint on a loopback port and write
# the HTTP request out by hand; what it checks - three fates of one
# credential, told apart by a worker the test stands in for - is a
# white-box question, so it now drives the router in process
# (`tower::ServiceExt::oneshot` with axum's `MockConnectInfo`) and
# crosses nothing. The black-box half it could not honestly carry - a
# real vault on a real machine - stays out of `tools/adversary/` too, because
# a served city writes to the platform credential service and the wire
# has no verb that takes a credential back. A file this list does not
# name is refused outright, so the register stays empty by construction.
#
# `crates/sprawling/src/assembly/driving.rs` is deliberately absent. Its
# sockets reach a fake model provider the test stood up, never this
# product, and its three lines carry `boundary-ok:` with that reason. A
# waiver is right there and a register row would be wrong: the debt is
# not one anybody intends to pay.
[boundary]
what = "a Rust check that reaches this product across a process boundary"
measured_by = "cargo xtask boundary"
status = "gated, with a register of the files that predate the rule"

[boundary.predating]
files = []

# Which platforms a release publishes for, and what each archive is
# called, is stated once in `tools/xtask/src/platform.rs`. The workflow matrix,
# the two install scripts and the npm shim each restate it in another
# language, and `cargo xtask artifact` holds all four to that table:
# `install.sh` had come to offer a suffix the matrix never produces, and
# only the shim was ever compared against anything.
#
# The register records an archive name a file spells out that no release
# builds. It holds one row, and that row is a decision somebody else has
# to make: `install.sh` offers `-linux-x86_64.zip` "for a gnu build that
# may join it later", and no such build exists, so a Linux machine is
# told to look for an asset the matrix cannot produce. Striking it is a
# one-line edit to a file outside this change-set. The register cleans
# itself in both directions: the row goes when a platform row claims that
# suffix, and it goes when nobody spells it any more.
[archive_naming]
what = "the suffix every archive a release publishes ends with"
measured_by = "cargo xtask artifact (the table in tools/xtask/src/platform.rs)"
status = "gated, with a register of the names spelled before the rule"

[archive_naming.predating]
suffixes = ["-linux-x86_64.zip"]

