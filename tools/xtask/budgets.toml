[kernel_mutation]
what = "the share of kernel mutants the tests kill"
minimum_percent = 90
measured_by = "just mutants"
status = "gated by just mutants, not by just check: a full mutation run is minutes, and a gate nobody waits for is a gate nobody runs"

[ledger_append]
what = "append plus fsync, p50 and p99"
budget_p50_us = 5000 # was 5 ms
budget_p99_us = 20000 # was 20 ms
measured_by = "just bench (citysim bench bin, release)"
status = "measured, not gated: p50 0.555 ms / p99 0.688 ms, nearest rank (fixture 1dc560ad5766de65, features sprawling/sandbox, windows-x86_64, 16 cores, NVMe, release, 2026-10-01); batched append_all moves 140,934 records/s. The two readings the register used to carry (about 335k records/s batched, run_history 3.3 ms) were re-read on the two trees either side of 2ff1859b: its parent gives 206,501 records/s and 4.177 ms, 2ff1859b itself 135,831 records/s and 6.429 ms, so most of the later drop is the bench load changing shape in 2ff1859b, not the product; the parent itself sits below the old figures, a gap that is either in 2feeb2d6..2ff1859b^ or the machine and has not been bisected. A wall-clock figure is the machine's, so it is recorded, never gated"

# What one durability barrier costs per record as the batch under
# it grows. The absolute figures belong to the disk class they were
# read on; the ratio between the rows is a fact about the design, and
# it is the reason `Ledger::append_all` exists: a barrier is a fixed
# cost, so a wave of fifty records is very nearly the price of one.
#
# Production writes through that batch: the serving relay drains every
# draft that arrived while the previous barrier ran and appends them
# with one `append_all`, so a busy city pays a row far below the top
# one and a quiet city pays the top row. `RealFs` holds the segment
# handle across the append and the sync, the way `LineReader` does on
# the read side, so no `CreateFile` sits under a record.
[durability_barrier]
what = "one fsync barrier, amortised over the records under it"
measured_by = "just bench (citysim bench bin, release)"
status = "measured, not gated: 562.3 us/record at one record per barrier, 55.2 at ten, 14.8 at fifty (fixture 1dc560ad5766de65, features sprawling/sandbox, windows-x86_64, 16 cores, NVMe, release, 2026-10-01). A wall-clock figure is the machine's, so it is recorded, never gated"

# Opening yesterday's session: the whole of what `bin::assembly`'s
# `run_history` does, over the same public faces it calls - refresh the
# resident index, name the newest `limit` sequences that session wrote,
# read those lines, parse them. The socket and the JSON frame are left
# out because they are the same for every query and would hide what this
# measures.
#
# The fixture is a city that has been working: fifty thousand records,
# eight interleaved sessions, and the question asked about the oldest of
# them. Before the index existed, the same question on the same fixture in the same
# process measured 27.6 ms, because the answer was found by reading every
# line back from the tail and discarding what belonged to somebody else.
# What is left is almost entirely the cost of parsing the 500 records that
# are the answer, which no index can remove.
[run_history]
what = "one session's newest 500 records, out of a ledger holding eight sessions"
measured_by = "just bench (citysim bench bin, release)"
status = "measured, not gated: p50 3.287 ms, three runs 2.978-3.355 ms (fixture 1dc560ad5766de65, windows-x86_64, 16 cores, NVMe, release at opt-level 3; 4.151-4.261 ms at opt-level \"z\"), against 6.009 ms on the same fixture before the run's sequences were taken lazily, and 27.6 ms before the index. The registered 3.3 ms is explained under ledger_append. A wall-clock figure is the machine's, so it is recorded, never gated"

[prefix_assembly]
what = "assembling one frozen prefix"
budget_us = 1000 # was 1 ms
measured_by = "just bench (citysim bench bin, release)"
status = "measured, not gated: p50 0.009 ms for 16.5 KB over four slots, 1000 rounds (fixture 1dc560ad5766de65, features sprawling/sandbox, windows-x86_64, 16 cores, NVMe, release, 2026-10-01)"

# What one query pays for the appends that arrived since the last one.
# `Views` refreshes the resident index before every history query, so a
# city that just wrote a record charges this to the next reader.
#
# The reading is the byte count `LedgerIndex::refresh` returns, which is
# the whole difference between seeking to the tail and lifting the
# segment that carries it: both fold the same records and answer the
# same queries, and only one of them costs the length of the ledger. A
# segment rolls at 64 MiB, so the reading a whole-segment read would
# give is bounded by that, while the reading below is bounded by the
# records that actually arrived.
#
[index_refresh_read]
what = "bytes read by one LedgerIndex::refresh that folds a single appended record"
measured_by = "cargo test -p sprawling-storage --lib -- --nocapture a_refresh_reads_the_appended_tail_rather_than_the_segment (the test prints the Refreshed::Appended reading beside the segment length)"
status = "measured, not gated: 191 B read out of a 76,180 B segment, which is the one appended record and nothing else (2026-09, 401-record fixture). The test asserts the equality rather than a threshold, so a gate here would be a second authority over the same claim"

# One rules lookup the read bound makes when a model-chosen path lands in
# another building. `city::RulesCache` keeps what a run read while the
# file's modification time and length hold, so a repeat costs one stat
# instead of a read and a TOML evaluation. On Windows the stat opens a
# handle, which is the floor of this design.
[rules_lookup]
what = "ns per rules lookup for another building, a fresh city::load against city::RulesCache::load, alternating rounds"
measured_by = "cargo test --release -p sprawling-city --lib rules_lookup_reading -- --ignored --nocapture"
status = "measured, not gated: median of 15 rounds of 2000, three runs, load 186,793-212,885 ns against cache 76,112-91,730 ns (release test profile, Windows NTFS, sixteen cores shared by eight build lanes)"

# Read amplification on a range retrieval: the bytes a `Vfs` hands back
# while `Cas::get_range` answers, over the bytes in the answer.
#
# The retrieval that motivated the row is a small window into a large
# offloaded object, where lifting the object and re-hashing it charged
# the whole object per window. `B` now costs the window; `L` costs the
# bytes before the line it names, because line numbers can only be found
# by counting newlines from the front.
#
# Not gated: the test asserts the readings directly (a five-byte range
# must move five bytes, a line near the front one scan chunk), so a gate
# here would be a second authority over the same claim.
[cas_range_read]
what = "bytes a Vfs returns while Cas::get_range answers, over the bytes in the answer"
measured_by = "cargo test -p sprawling-storage --lib -- --nocapture a_range_read_lifts_the_range_rather_than_the_object (FaultFs::bytes_read deltas around each retrieval)"
status = "measured, not gated: on a 5,888,890 B object a five-byte `B` range moves 5 B and line 2 moves 65,536 B, against 5,888,890 B for the verifying full read (2026-09). Before this row existed both range reads moved the whole object and re-hashed it"

# How much of one message this city reads from an MCP server before it
# refuses. A server named in `CONFIG.toml` is an outside party, its
# output is untrusted input, and the process reading it is also the
# city's only writer - so a message with no end is not a slow tool call
# but an interrupted history.
#
# The figure is derived rather than chosen: `IMAGE_MAX_BYTES` is 2 MiB,
# base64 grows it to 2,796,203 B, and 8 MiB leaves a tool result room
# for such a picture, its text and the JSON-RPC envelope, with 3x over
# the largest payload the city already accepts.
#
# Not gated by `xtask budget`: the number is a constant in the source
# rather than a reading off a build, and `agent_protocols::mcp::reading`'s
# tests assert both edges of it - a message of exactly the ceiling is
# read, one byte more is refused with the ceiling named. A gate here
# would be a second authority over the same claim. The one home is
# `agent_protocols::mcp::MESSAGE_CEILING`; this row records the reading and the
# reasoning, never a second copy of the value that decides.
[mcp_message_ceiling]
what = "one message read from an MCP server over stdio, before its framing newline"
measured_by = "cargo test -p sprawling-agent-protocols --lib reading (a_message_at_the_ceiling_is_read and a_message_above_the_ceiling_is_refused_with_the_ceiling_named)"
status = "measured, not gated: 8,388,608 B, refused whole rather than truncated, and the connection ends because the unread remainder of a refused message is indistinguishable from the next one (2026-09). Before this row existed the stdio reader grew one String until the machine ran out"

# --- What K-05 and K-07 asked for, and what already had a home --------
#
# Four readings were proposed: the p99 of a ledger append, a view
# rebuild priced per megabyte, the work a dispatch does before a model
# is called, and how many packages this tree resolves. Only three rows
# are below.
#
# **The p99 of an append is not among them, because it already has a
# home.** `[ledger_append]` states `budget_p99_us` and carries the
# reading; a row named `ledger_append_p99` would be a second place to
# state one number, and the two would be edited on different days by
# different people. Price the append where the append is already
# priced.

# What a rebuild of every view costs, denominated in the thing that
# actually varies. A record is not a fixed size, so records per second
# answers "how fast did this fixture fold" and not "what will
# rebuilding my city cost"; a person with a 400 MB ledger can multiply
# a per-megabyte figure and cannot multiply a per-record one.
#
# **One rebuild, one row.** The cold view this figure used to share the
# subject with is gone with `storage::projection`, so the per-record row
# went with it: the views a city rebuilds today live in the process.
#
# The denominator removes the fixture's size from the figure, which is
# what made the rows above it facts about a machine rather than about
# the design. The reading exists and the ceiling does not: `xtask
# budget` reads two units, bytes and packages, and gating this row is
# that unit's work, not the reading's.
#
# **One reading, one home.** The large-ledger fold of `just bench` is
# this same rebuild under the registered fixture, so its p50/p95/p99
# live here and ARCHITECTURE.md quotes them through `cargo xtask docnum`
# (`budget_figure:views_rebuild_per_mb.<field>`) rather than typing a
# second copy.
[views_rebuild_per_mb]
what = "microseconds to rebuild every view, per megabyte of ledger folded"
measured_by = "just bench (citysim bench bin, release), over a ledger large enough that the fold rather than the open dominates: the bench writes 50,000 records into a scratch city and drives the whole production rebuild through `sprawling::ask`, which verifies the chain, parses every line and folds it into every view before answering one CityView"
fold_records = 50000
best_p50_us = 436676 # was 437 ms, the same reading rounded up
best_p95_us = 438127 # was 439 ms
best_p99_us = 438127 # was 439 ms
status = "measured, not gated: 5 rebuilds of the registered fixture (`bench::scenarios::REGISTERED`), floor 434.222 ms, p50 436.676 ms, p95 and p99 438.127 ms under the nearest-rank rule, the median of three runs whose p50 read 417.348-437.723 ms, the best_* fields the same readings in whole microseconds (fixture 1dc560ad5766de65, windows-x86_64, 16 cores, NVMe, release at opt-level 3). The same runs read p50 676.402-707.773 ms at opt-level \"z\". The reading fell from 1277.206 ms when a rebuild from genesis stopped proving the history before folding it, since the fold checks every line itself (accounting D31 (b)); what remains is one line check, one parse and one fold per line. The per-megabyte figure is best_p50_us over the ledger's size, which the bench does not print yet; a ceiling waits on `xtask budget` learning a time unit"

# What a dispatch spends before the model is called: opening the room,
# writing the brief, standing the run up, and assembling the tools -
# including, today, starting every MCP server this building declares
# and shaking hands with each of them. All of it runs on the accounting
# thread, so it is time during which no lane's append is served.
#
# **Measure first, gate later, and the order is the point.** K-05
# proposes keeping MCP connections open across dispatches; a ceiling
# written before the reading exists would be a guess that either passes
# trivially or blocks the change that fixes it. What this row buys
# today is that the reading gets taken and recorded where the next
# person will find it.
[prepare_dispatch]
what = "one dispatch, from the command arriving to the lane taking the drive, on the accounting thread"
measured_by = "the instrument is two reads of the monotonic clock `Hands.monotonic` around `stage_dispatch` (crates/accounting/src/worker/dispatching/running.rs) and two more around `Laying::mcp_tools` (crates/accounting/src/worker/workbench/servers.rs), which runs in the lane that drives the run (`crates/sprawling/Spec.lean` §8-93), written out at `Level::Trace`; the assembly hands the worker that clock beside the city's own (`crates/accounting/Spec.lean` §8-11), so a span never reads a city clock that a test or a correction can move. Read it off `a_dispatch_says_what_it_spent_before_the_drive` (cargo nextest run -p sprawling-accounting --release -E 'test(a_dispatch_says_what_it_spent_before_the_drive)' --no-capture), or off any served city running at that floor"
status = "measured, not gated: 58 ms median on windows-x86_64, 16 cores, NVMe (2026-09-21, release, four runs: 50, 50, 51, 66; ~70 ms unoptimized when idle), for a dispatch into a fresh city with **no MCP server declared** - so this figure is the floor, and the `mcp_tools` line beside it read 0 ms over 0 servers in every run. The two lines are reported apart because a resident connection table (K-05) removes only the second, and the reading is K-05's own verdict: at 0 ms the table saves nothing, so it stays unbuilt until a served building declares servers and the second line shows them dominating. Not gated - a wall-clock reading is the machine's, and this one also depends on how many MCP servers a building declares"

# T14's four-action pressure reading (deepening plan section 3 T14): the
# first path a person walks - install, start, raise a city, open a session
# - priced at its own boundary. Each action owes three pieces: whether its
# tail fits the second tier (p99 <= 1 ms), the limit reading, and the
# dominant cost. Optimisation is a later wave; these are readings.
#
# **No action reaches the second tier.** The closest, `open_session`, is
# seven times outside it at p99 and the furthest, `install`, is thirteen
# thousand. For two of the four the machine's on-access scanner rather
# than the product is what the boundary mostly prices, which is a fact
# about this class of machine and the reason these rows are measured
# rather than gated.
#
# **The spread between two runs is wider than anything these actions have
# changed.** An earlier run of this same logic read `startup` at p50
# 100.661 ms and `open_session` at p99 49.884, against 26.290 and 7.230
# below. One reading of this family is one sample of a machine, and a
# later reader comparing two of them compares two machines' worth of
# scheduling as much as two revisions - so a row here records what was
# seen, never what is promised.
#
# Every action reports a floor beside its middle. The floor is what the
# action costs while the machine is quiet; the peak is what the machine's
# other work cost the sample that met it. `suspicious` counts the samples
# above three times the middle - flagged and never removed, because a
# reading that hid its tail would describe a machine nobody has.
#
# `just bench-startup` is the only instrument. It builds the client
# bundle and the release binary first, so the archive the install action
# unpacks was built from the tree under test and no run is driven by a
# stale artifact. T14's two red lines hold in every row below: the digest
# stays inside the install boundary, and no fsync was removed to move a
# number.
[install]
what = "the archive in place to the unpacked executable answering `version`: digest, unpack, launch"
measured_by = "just bench-startup (citysim bench_startup bin, release), 200 samples, p50/p95/p99 nearest-rank over all of them"
status = "measured, not gated: p50 1856.382 ms, p95 1880.174, p99 1886.169; floor 1819.708, peak 1890.297; none of the 200 above three times the middle (fixture 1dc560ad5766de65, windows-x86_64, 16 cores, NVMe, release at opt-level 3; p50 1485.98-1490.38 ms at opt-level \"z\", whose executable is 11.7 MB smaller). **Dominant: `launch`**, 1674.365 ms, against 170.557 ms to unpack and 10.953 ms to SHA-256 the 11,601,869 B archive: the first launch of an unpacked executable prices the on-access scanner as much as the install. One process and one file per sample, no barriers"

[startup]
what = "`CreateProcess` sent to the light command's exit observed: create, run"
measured_by = "just bench-startup (citysim bench_startup bin, release), 200 samples"
status = "measured, not gated: p50 15.586 ms, p95 16.201, p99 16.775; floor 14.791, peak 26.498; none of the 200 above three times the middle (fixture 1dc560ad5766de65, features sprawling/sandbox, windows-x86_64, 16 cores, NVMe, release, 2026-09-30). **Dominant: `run`**, 13.498 ms against 2.041 ms for the spawn call. One process per sample, no files, no barriers"

[raise_city]
what = "`assembly::init_city` called to the genesis record on disk, its barrier included"
measured_by = "just bench-startup (citysim bench_startup bin, release), 200 samples"
status = "measured, not gated: p50 36.774 ms, p95 40.794, p99 46.569; floor 25.573, peak 60.448; none of the 200 above three times the middle (fixture 1dc560ad5766de65, features sprawling/sandbox, windows-x86_64, 16 cores, NVMe, release, 2026-09-30). No sub-step split, so the dominant cost is attributed rather than measured: one sample writes 12 files and 3 barriers, and 3 barriers at the durability_barrier floor are about 1.7 ms of the middle; the rest is creating the tree and reading the config layers. 0 processes per sample"

[open_session]
what = "`Command::OpenSession` arriving to the call returning, `session_opened` on disk"
measured_by = "just bench-startup (citysim bench_startup bin, release), 200 samples"
status = "measured, not gated: p50 1.540 ms, p95 1.735, p99 1.984; floor 1.358, peak 7.968; 1 of 200 above three times the middle, at #0 (fixture 1dc560ad5766de65, features sprawling/sandbox, windows-x86_64, 16 cores, NVMe, release, 2026-09-30). No sub-step split: one sample writes 2 files and 1 barrier, and that barrier is about 0.6 ms of the middle. 0 processes per sample"

[first_byte]
what = "`serve` spawned to the first byte of GET /, over the three fixture cities, with the product's own split of the opening"
measured_by = "just bench-startup first-byte"
status = "measured, not gated: p50 in ms over three bench runs - the empty city 45-47 (city fixture 7e6fda8b5653dd7f), l100k 110-112 (6615c4052f604f8c), l400k 210-212 (99909ec1f02d58fc) (windows-x86_64, 16 cores, NVMe, release at opt-level 3; the same runs read 47-48, 121-125 and 257-263 at opt-level \"z\"). The l400k serve says fold 0 lines from the snapshots 101 ms, open the ledger 42, copy the views 20. The history is proved behind the first byte, its segments hashed in parallel waves of eight (storage PROOF_WAVE): l400k proof 138 ms, commands taken 310 ms after opening began; l100k proof 84 ms, bounded by one 64 MiB segment; commands wait for the proof (E_HISTORY_UNPROVEN). The remaining snapshot fold is the dominant phase (`crates/sprawling/Spec.lean` §8-154)"

# How large this tree's dependency graph is, counted off the resolved
# lockfile rather than off any manifest: a manifest states what was
# asked for, and what a person compiles is what the resolution settled.
#
# **One count, three readers.** `budget::lockfile_packages` takes it;
# `docnum`'s `dependency_count` fact quotes it into `ARCHITECTURE.md`
# and `docs/third-party.md`; `cargo xtask budget` prints it beside this
# row. The number used to sit in four documents at four different
# values, none of them right, which is the whole reason it is measured
# rather than written.
#
# **Reported, never gated (the person's ruling).** Dependencies are
# welcome; they are worth cutting where a cut makes the project less of
# a black box, and a ceiling on the count cannot tell which cut that is.
# tools/xtask/Spec.lean section 8-25 holds the reasoning and what would reopen it.
[dependency_count]
what = "packages in Cargo.lock once every transitive dependency is resolved, workspace members included"
measured_by = "cargo xtask budget (budget::lockfile_packages, counting [[package]] in Cargo.lock)"
status = "reported, not gated: the dependency count is read and printed, and no count is refused (tools/xtask/Spec.lean section 8-25)"

# T13: where the two latency tiers are stated. One latency metric in two
# stages: the first is p95 inside one frame's budget (a person sees no
# delay), the second is p99 tighter still and covering the first (an
# agent waits on nothing this harness does). Stages, not two percentiles
# of one distribution: on one distribution p99 >= p95 holds, so a claim
# of "p95 16 ms and p99 1 ms" over one sample would be false by
# construction. The second stage is reached after the first one is.
#
# The sub-metric split is what keeps a disk's floor from masking harness
# overhead (tools/citysim/Spec.lean section 8-6): `harness` carries no durability
# commit and is the only sub-metric these tiers price; `whole` is disk
# work whose seam does not split and gets no tier. Multi-run parallel is
# read by `[relay_round_trip]`, where the `store=memory` line is the
# harness and the gap to `store=disk` is the disk. The target values
# live here and nowhere else; the readings and their machine class live
# in the performance book in ARCHITECTURE.md.
#
# Ratchet: under the registered fixture a reading only goes down. A
# relaxed tier or a fattened fixture lands in a commit of its own.
[local_latency]
what = "the harness's own processing latency over the four load scenarios, one metric in two stages"
stage_one_p95_us = 16000
stage_two_p99_us = 1000
scope = "sub-metric `harness` only, and the `store=memory` line of `[relay_round_trip]` for multi-run parallel; `whole` carries no tier (tools/citysim/Spec.lean section 8-6)"
measured_by = "just bench, release: the citysim bench bin gives one reading line per scenario and sub-metric for three scenarios, and `instrument_relay_round_trip` gives multi-run parallel; each line carries its machine class"
status = "staged targets, not gated: a wall-clock figure is the machine's. Baselines sit in the ARCHITECTURE.md performance book. Under the registered fixture a reading only goes down; relaxing a tier or fattening the fixture lands in a commit of its own"

[relay_round_trip]
what = "one relay append from a lane to the accounting thread and back, while a run is in flight, with `attend` as the city runs it"
measured_by = "cargo nextest run -p sprawling-accounting --run-ignored only -E 'test(/::instrument_relay/)' --no-capture (crates/accounting/src/worker/driving/tests/instruments.rs, `crates/sprawling/Spec.lean` §8-84), 200 samples per store"
status = "measured, gated at p50 <= 1 ms on the memory store only: unoptimized build, windows-x86_64, 16 cores, three other builds running beside it. Polling loop before the one queue: store=disk p50 31198 us, store=memory p50 31313 us, both the two timed waits. The one queue: store=memory p50 45 us against 29 us for the store's own append with no crossing; store=disk p50 2351 us, floor 1458 us, which is the device's fsync, a physical floor. The release reading and the 10 us memory target are not yet taken"

[throughput]
what = "N runs dispatched at once (N in 1, 4, 16, 64), three model-latency arms, 4 tool calls per run alternating status and edit: runs/s, records/s, tool calls/s, and the waits lane, first_call, relay_under_load, relay_idle at p50/p99/p999 (p999 only at n >= 1000) and max"
measured_by = "cargo nextest run -p sprawling-accounting --run-ignored only -E 'test(instrument_throughput)' --no-capture (crates/accounting/src/worker/driving/tests/throughput.rs, tools/citysim/spec/Throughput.lean section 8-14); SPRAWLING_TP1_RUNS and SPRAWLING_TP1_LATENCY narrow the arms"
status = "measured, not gated: no target until the baseline is read and the User confirms one (M0 item 9)"

[view_backlog]
what = "how far the view fold falls behind a burst of 2,000 records while readers keep asking"
measured_by = "just bench (instrument_view_backlog, crates/sprawling/src/serving/folding/tests/instruments.rs)"
status = "measured, not gated: 2,003 records in a 12.255 ms burst, 60 reader questions; a record waits floor 184 us, p50 7118 us, p99 8312 us, max 8350 us for its broadcast, and at most 1,945 records wait at once; the median of three runs whose p50 read 5861-8340 us (windows-x86_64, 16 cores, NVMe, release at opt-level 3; 7853-11347 us at opt-level \"z\")"

# What one beat of the monitor costs the process it watches, per kind of
# platform reading: the summary counters, the whole page, and one
# process tree. The count gate in `monitor::counters` holds how many
# readings a beat takes; how long each takes is the machine's, so it is
# recorded here and never gated, for the reason `[local_latency]` gives.
[monitor_beat]
what = "one platform reading of the monitor's beat: the summary counters, the whole page, or one process tree"
measured_by = "just bench (instrument_monitor_beat, crates/sprawling/src/monitor/counters/tests.rs), 200 samples per reading, nearest rank through `bin::monitor::spread::Spread`"
status = "measured, not gated: summary floor 2 us, p50 2 us, p99 3 us; page floor 95 us, p50 121 us, p99 440 us; tree floor 5019 us, p50 5738 us, p99 9441 us (features sprawling/sandbox, windows-x86_64, 16 cores, NVMe, release, 2026-10-01)"

# The wall time of a tool wave whose leading calls only read. The
# concurrent-wave test judges the behaviour (every read of the wave in
# flight at once, and the serial ledger byte for byte); how long the wave
# takes is the machine's, so it is recorded here and never asserted.
[tool_wave_reads]
what = "one wave of three read calls of 50 ms each, from the first call started to the last result accounted"
measured_by = "not instrumented: taken with a wall-clock bound before that bound became the rendezvous check, which now lives in crates/runtime/tests/run_driver.rs"
status = "measured, not gated: serial 153.0 ms; concurrent 51-60 ms on an idle machine and 82.8 ms under a merge-train build (debug build, windows-x86_64, 16 cores). A wall-clock figure is the machine's, so it is recorded, never gated"

# What the client pays to fold one animation frame of stream into the
# belief, with one subscriber reading the run table the way the views do.
# A fold that told subscribers once per record paid the table's length
# once per record; `belief.batch` tells them once per frame, and a token
# into a run the `$state` table holds tells them nothing at all.
[client_fold]
what = "one animation frame of 50 token deltas folded into a belief of R runs, one subscriber reading the run table"
measured_by = "bun test --conditions=browser client/src/core/belief/fold_cost.test.ts (the frame test prints one client_fold line per R and holds the subscriber to one read per city answer; the delta test holds R=1e4 within 5x of R=1e2 in the same run)"
status = "measured, not gated here: per frame with the `$state` run table 30-37 us at R=1e3 and 30-54 us at R=1e4, and 30 us at R=1e2 once warm (the first size measured pays the runes runtime warm-up, 94-330 us), against 29-34 us, 58-73 us and 471-539 us with belief.batch alone, interleaved on the same instrument (x86_64 desktop class). A wall-clock figure is the machine's, so this register records it and the test guards only what every machine agrees on: the read count and the ratio between two sizes"

# What the page pays to read one event frame off the socket. Event and
# delta frames arrive once per ledger record and once per token, so they
# skip the Effect schema for JSON.parse and a narrow guard taken from it
# (client/Spec.lean §4-6); the schema path is measured beside it so the gap the
# guard buys stays visible.
[client_frame_decode]
what = "one event frame decoded from its text, by the hot decoder and by the Effect schema it stands in for"
measured_by = "cd client && bun scripts/frame_cost.ts (prints one client_frame_decode line: the fastest of 15 batches of 2000 decodes, per path)"
status = "measured, not gated: on Effect 4, hot 1.1-1.3 us against 6.9-8.4 us for the schema path, interleaved on the same instrument (x86_64 desktop class, 16 cores, other builds beside it). On Effect 3 the floor read 3.7-8.6 us with 32 busy loops beside it, so a wall-clock bound held as a unit test failed on a loaded machine; the register records the reading and nothing gates it"

# What one streamed token costs the page while a reply is still arriving
# (T12): script plus the layout the token forces. The raw shape drew the
# whole growing text in one pre-wrapped node and laid it out as blocks
# only when the record took over, so each token re-laid the whole reply
# and the turn jumped at the end. The block shape (`talk/saying.svelte`)
# lays out each block as it closes and keeps only the open tail as text.
# Headless Edge rounds its clock to 0.1 ms, so the mean over every token
# carries the finer figure. Not gated: a wall-clock reading is the machine's.
[stream_relayout]
what = "one streamed token in a live turn: script plus forced layout, and how far the turn jumps when the record takes over"
measured_by = "cd client && bun scripts/relayout.ts - headless Edge, a 2,753-character reply with lists, tables, code and headings in 689 four-character tokens, 7 interleaved rounds of each shape"
status = "measured, not gated: on windows-x86_64, 16 cores, NVMe, three runs each - raw shape mean 426-441 us, p99 1.0 ms, takeover 3.8-4.3 ms, jump 793 px; block shape mean 72-80 us, p99 0.5-0.6 ms, takeover 2.5-2.8 ms, jump 0 px"

# What the city pays, in results-only mode, to sort its runs into the
# three outcomes a person acts on and keep the newest few of each. The
# page then draws at most three times `FIRST` rows, so this triage is
# the only part of the frame that grows with the city.
[city_results]
what = "one triage of a 200-run city into waiting, failed and done, each cut to its FIRST newest (client/src/core/results.ts)"
measured_by = "bun test --conditions=browser client/src/core/results.test.ts (prints one city_results line and holds a triage to 1600 us, a tenth of a 16 ms frame)"
status = "measured, not gated here: 45-124 us per city across three runs (x86_64 desktop class, other builds running beside it). A wall-clock figure is the machine's, so this register records it and the test guards only what every machine agrees on: the read count and the ratio between two sizes"

# How many controls stand on the conversation page at once (refrain P11,
# docs/frontend-method.md §4-43): the edge keys, the composer's row and the inspect
# side's handle, counted on every shell fixture of the gallery by
# `cargo xtask render` (tools/xtask/Spec.lean §8-51). A control inside a
# message, a fact's detail or an opened panel is not standing and is not
# counted. The design aims at 8; the number held here is the reading of
# the fixtures as accepted, and it is a ratchet like every other row: it
# may fall freely and rise only within the slack. A necessary recovery
# control is never hidden to make the count.
[talk_controls]
what = "the operable controls standing on the most crowded conversation page of the gallery: edge keys, composer, inspect side"
measured_by = "cargo xtask render (the `talk` reading, on every pass)"
status = "held by render, not weighed by budget"
