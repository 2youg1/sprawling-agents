[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
# A tool of this repository, never sent to a registry.
publish = false

# The gates are a tool of this repository, not part of the product: the
# members reader keeps a tool out of the crate graph, the module map and
# the proof roster (tools/xtask/Spec.lean §8-39 and xtask D4).
[package.metadata.sprawling]
role = "tool"

[dependencies]
kernel = { workspace = true }
# The render gate and the `survey` tool take the same readings off a
# page and reach the same verdicts. The judging lives in the product
# crate so that there is one of it; what stays here is the engine that
# drives a headless browser and the walk over a source tree, neither of
# which a shipped binary has.
browser = { workspace = true }
# `wire-ts` reads the JSON Schema of the wire and writes the
# TypeScript client's types from it. Without `server`, so this crate does
# not pull tokio and axum in to ask what a frame looks like.
wire = { workspace = true, features = ["schema"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
# The frontend budget is stated compressed, so the gate compresses.
# Shelling out to gzip would make the reading depend on which gzip is
# on the path; this lands in workspace tooling only, never in the
# product binary.
flate2.workspace = true
# Measuring where a function begins and ends is a parsing problem: a
# brace counter gets `'{'`, a line-continued string and `#[cfg(test)]`
# wrong, and each mistake produces a wrong list of offenders. `visit`
# reaches every macro call inside a function body, where `packaged` finds
# the include calls a published package compiles. Workspace tooling only,
# never the product binary (tools/xtask/Spec.lean §13).
syn = { version = "3", features = ["full", "parsing", "printing", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
zip.workspace = true

[lints]
workspace = true
