# 禁用词数据面 — 退役说法的机器子集（xtask lexicon 消费）。
# 收录依据：语境无关、子串命中即可判错的词。语境依赖者（session 指本城运行时、
# 建筑指项目时、裸用「档」、persona/soul 会误伤英文正文）不入本表，由评审执行。
# 例外写法：命中行或其上一行携 `lexicon-ok: <理由>`。
# 本文件为 .toml，不在扫描范围内，故可安全罗列禁用词本身。

