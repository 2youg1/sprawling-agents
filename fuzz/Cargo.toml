# cargo-fuzz targets (V4: the parse surface is the taint boundary).
# Standalone workspace on purpose: fuzz builds need nightly + libFuzzer and
# never enter the product build graph.
[package]
name = "sprawling-fuzz"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kernel = { path = "../crates/kernel" }
memory = { path = "../crates/memory" }
# The three outside-the-process taint surfaces: inbound wire frames, the
# configuration file a person types, and what an MCP child writes back.
# `channels` is taken without its listener: a frame is decoded before any
# socket code sees it, and the server feature would drag tokio and axum
# into every fuzz binary.
channels = { path = "../crates/channels", default-features = false }
city = { path = "../crates/city" }
protocol = { path = "../crates/protocol" }
serde_json = "1"
tempfile = "3"

[[bin]]
name = "fuzz_address"
path = "fuzz_targets/fuzz_address.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_locator"
path = "fuzz_targets/fuzz_locator.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_jsonl_tail"
path = "fuzz_targets/fuzz_jsonl_tail.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_wire_frame"
path = "fuzz_targets/fuzz_wire_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_config_toml"
path = "fuzz_targets/fuzz_config_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_mcp_stdio"
path = "fuzz_targets/fuzz_mcp_stdio.rs"
test = false
doc = false
bench = false

[workspace]
