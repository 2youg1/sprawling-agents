[workspace]
resolver = "3"
members = [
    "crates/kernel",
    "crates/storage",
    "crates/gateway",
    "crates/runtime",
    "crates/collab",
    "crates/city",
    "crates/documents",
    "crates/wire",
    "crates/remote_access",
    "crates/browser",
    "crates/desktop",
    "crates/desktop/ffi",
    "crates/agent_protocols",
    "crates/accounting",
    "crates/sprawling",
    "tools/xtask",
    "tools/citysim",
]
default-members = [
    "crates/kernel",
    "crates/storage",
    "crates/gateway",
    "crates/runtime",
    "crates/collab",
    "crates/city",
    "crates/documents",
    "crates/wire",
    "crates/remote_access",
    "crates/browser",
    "crates/desktop",
    "crates/desktop/ffi",
    "crates/agent_protocols",
    "crates/accounting",
    "crates/sprawling",
    "tools/xtask",
    "tools/citysim",
]

# What every package says about itself on a registry, and the one place
# the release version is written: `guard` holds each of the workspace's
# own packages below to `=` this version, `xtask package` and `xtask
# channel` read it, and the binary reports it. Every package may be
# published unless its own manifest says `publish = false`, which the
# two tools of this repository do (sprawling-SPEC.md 8-157).
[workspace.package]
version = "0.0.7"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.97"
repository = "https://github.com/2youg1/sprawling-agents"
homepage = "https://github.com/2youg1/sprawling-agents"
readme = "README.md"
publish = true

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
# The person's face of `sprawling view` reads keys and draws frames in a raw
# terminal; no colour, clipboard or paste features, so it links the least.
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
toml = "1.1"
# Stage 1 pins: blake3 is the library-wide sole hash;
# uuid v7 is human-readable identity only (parse/format; no generation in kernel).
blake3 = "1.8"
uuid = { version = "1", features = ["serde"] }
# Dev-facing: property tests, golden snapshots, temp dirs. proptest keeps
# `std` (the regex string strategies need it) and drops fork, timeout
# and bit-set, which no test here uses; insta drops its coloured diff.
proptest = { version = "1", default-features = false, features = ["std"] }
insta = { version = "1", default-features = false }
tempfile = "3"
# S2: compile-fail proof that "unrepresentable" holds (V0 trybuild cases).
trybuild = "1"
# Pictures cross both provider wires base64-encoded. The
# package is already resolved beneath reqwest, so naming it adds nothing
# to the lock, and a second hand-written encoder would be a second
# authority for one transformation.
base64 = "0.23"
# A screenshot is evidence only if its size is read from its own
# bytes and two of them can be compared. Decoding only - nothing here
# writes a png - and the licence is MIT OR Apache-2.0, both already on
# `deny.toml`'s allow list. A hand-written IHDR reader would measure a
# picture without being able to compare two, so the second half of the
# work would have needed this crate anyway.
png = "0.18"
# How many names a file has, read on Windows through a handle, for the
# hard-link arm of the alias family (storage-SPEC 8-25). Already in the
# lock beneath same-file; the unsafe call is inside the crate.
winapi-util = "0.1.11"
# One Job Object per run in runtime (`crates/runtime/Spec.lean` §8-13-3), and the peak
# memory a measured command's process reached in `sprawling gauge`
# (sprawling-SPEC 8-129-4); the crate's public surface is safe.
win32job = "2.0.3"
# The desktop server's safe Win32 calls, and the handle and error types its
# FFI seam hands back (`crates/desktop/Spec.lean` D9 and section 8-12): the server
# and the seam both name it, so its version and features are written once.
winsafe = { version = "0.0.29", features = ["user", "ole"] }
# The Win32 binding the desktop server reads constants from, and the one
# its seam's test fixture opens windows through; each names its features.
windows = "0.62"
# S2 pins: Sealed<T> zeroization.
secrecy = "0.10"
zeroize = "1.9"
# S4 pins: the wire crate is the first true async
# consumer in the workspace - S3 deferred tokio to here on purpose. axum
# carries tokio-tungstenite itself, so the WS protocol has one version
# authority, not two.
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "sync", "time"] }
axum = "0.8"
# The in-process door to an axum router under test (`oneshot`). Already in
# the graph beneath axum; naming it adds no package to the lock.
tower = { version = "0.5", features = ["util"] }
# P3: the second client of the wire, in a terminal. This is the crate
# axum's `ws` feature already carries, at the version axum carries, so a
# direct dependency adds no package to the lock; the two move together
# (the Dependabot `axum` group), because a direct dependency one release
# ahead of axum's is a second implementation of one protocol in one
# binary. `connect` without TLS, because termination is not this
# binary's job: `ws://` reaches a loopback control surface, and a city
# served to another machine is served through a terminator that holds
# the certificate. What the city
# owes that deployment is the other half, and it is enforced rather than
# configured: a face reachable beyond this machine refuses to serve
# without a credential (wire-SPEC section 8-41). Loading a
# certificate, renewing it, and choosing cipher suites here would put
# "how the control surface is protected" in two homes at once - the
# proxy's configuration and the city's.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# OS entropy: the vault file's salt and nonce, a served door's minted
# pairing token, and the idempotency key of a dispatch typed at the CLI
# or the console. It is not the seeded RNG the simulator uses and must
# not become it - a token a third party can predict is a door a third
# party can open. Already in the tree as a transitive dependency, so
# this adds a name rather than a crate.
getrandom = "0.4"
# A skill package is read by walking directory handles, never by
# re-resolving a path: a directory swapped for a link after its judgement
# is then outside anything the walk can open (city-SPEC section 8-28).
# The standard library has no handle-relative open; these two crates are
# that open in safe Rust, and cap-primitives beneath them is already in
# the lock beneath wasmtime-wasi, under the same licence.
cap-std = "4"
cap-fs-ext = "4"
# A playback page is checked as a browser would build it: html5ever is the
# WHATWG tree builder, so `<svg><title>` and `<noscript>` read the way a
# browser reads them; a tokenizer that switches state by tag name
# (html5gum, no dependencies) reads an `img` inside SVG as text, and
# scraper adds selectors and pins another cssparser. CSS is read by the
# CSS Syntax tokenizer itself; its default features buy a faster byte
# match and a colour table, worth less than a microsecond on a page's
# kilobytes of CSS and not a proc macro and a phf table
# (accounting-SPEC.md 8-13, decision 25).
html5ever = "0.40"
cssparser = { version = "0.38", default-features = false }
# One HTTP client for the whole workspace: gateway speaks to providers,
# the bin speaks to MCP servers reached over HTTP, and two version
# authorities for one client is how two TLS stacks end up in one binary.
# The remote door's cryptography: ML-KEM-768, ML-DSA-44, X25519, Ed25519,
# HKDF and AES-GCM from one library that is already in the graph through
# rustls, with the features rustls turns on, so building `remote_access` alone
# needs no assembler either (crates/remote_access/Spec.lean section 13).
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "alloc", "prebuilt-nasm"] }
# The TLS stack's crypto backend is aws-lc-rs, installed once by
# `gateway::reach::tls` (`crates/gateway/Spec.lean` §8-15) rather than chosen by a
# reqwest feature name. The same aws-lc-rs line above serves the remote
# door's primitives, so the binary links one AWS-LC.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    # The backend is installed by gateway::reach::tls (`crates/gateway/Spec.lean` §8-15).
    "rustls-no-provider",
    "json",
    "http2",
    # A machine reaches a provider through whatever its owner already
    # configured, and on Windows and macOS that is a system setting
    # rather than an environment variable: without this the binary is
    # the one tool on the machine that cannot see the proxy, and the
    # symptom a person reports is a fifteen-second timeout.
    "system-proxy",
    # `socks = []` in reqwest 0.13: the implementation is in-tree and
    # this adds no package to the lock.
    "socks",
] }
# The bin's build script gzips the client bundle it embeds; xtask weighs
# the same artifacts. One version authority for both.
flate2 = "1"
# The digest the *release publishes* (`digest: sha256:` on the GitHub
# asset), verified on the install path and priced by citysim's
# `bench_startup`. blake3 above stays this product's sole content hash;
# this one addresses nothing inside a city and answers only to the
# outside world's spelling (consts_external family). Its one reader is
# citysim's `bench_startup`, whose install action digests the archive
# the way the install path does.
sha2 = "0.11"
# The release archive's format, written by `cargo xtask package` and
# read back by citysim's `bench_startup` install action. One version
# authority for both.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
# The checkpoint store is git: libgit2, vendored, no system dependency.
# storage links it; the tests that open the repository a merge landed in
# read it too. One version authority for all of them.
git2 = { version = "0.21", default-features = false }
# The encrypted vault file's two primitives (14.5, `crates/gateway/Spec.lean` §8-21), and
# nothing beyond them. ChaCha20-Poly1305 is an RFC 8439 AEAD that is fast in
# pure software on a machine without AES-NI, and Argon2id (RFC 9106) is the
# password KDF whose slowness is the feature that guards a passphrase.
# blake3 stays the sole content hash: a fast hash cannot derive a key from a
# passphrase, so these are two jobs rather than one authority split in two.
# ML-KEM and FN-DSA stay out until they have a reader; the reopen parameters
# are recorded in `crates/gateway/Spec.lean` §8-21.
# Both are taken without default features: the vault draws its salt and its
# nonce from `getrandom`, which this workspace already names, and a second
# path to the operating system's entropy would be a second authority for
# one fact. `zeroize` clears the key material each leaves behind.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
# The JSON Schema the TypeScript client is generated from. The
# derive reads the same serde attributes the wire is encoded with, so both
# ends of the socket have one authority; optional in kernel and wire
# (`schema`), turned on by xtask alone, never by the product binary.
schemars = { version = "1", features = ["uuid1"] }
# The QR code `/remote pair` prints on the city's console, so a phone scans
# the invitation instead of a person typing 80 characters into it
# (sprawling-SPEC.md 8-140). MIT, no dependencies, no I/O.
qrcodegen = "1.8"
# The one Markdown grammar: a document's preview and an export are laid
# out by the same parser, in the city rather than in the browser
# (crates/documents/Spec.lean D20). BSD-2-Clause, CommonMark and GFM.
# Without default features, because those are its command line and its
# syntect highlighter, and the client already colours code. Held at 0.50:
# from 0.51 comrak reads Unicode categories through finl_unicode, whose
# licence adds Unicode-DFS-2016, which deny.toml does not list
# (crates/documents/Spec.lean section 13).
comrak = { version = "0.50", default-features = false }
# The workspace's own packages: the one place their paths and published
# names are written. Each version pins `[workspace.package] version`
# exactly, because a path dependency without one cannot be published;
# Cargo refuses to resolve a pin that disagrees with it.
kernel = { package = "sprawling-kernel", path = "crates/kernel", version = "=0.0.7" }
storage = { package = "sprawling-storage", path = "crates/storage", version = "=0.0.7" }
gateway = { package = "sprawling-gateway", path = "crates/gateway", version = "=0.0.7" }
runtime = { package = "sprawling-runtime", path = "crates/runtime", version = "=0.0.7" }
collab = { package = "sprawling-collab", path = "crates/collab", version = "=0.0.7" }
city = { package = "sprawling-city", path = "crates/city", version = "=0.0.7" }
documents = { package = "sprawling-documents", path = "crates/documents", version = "=0.0.7" }
# `wire` turns its default features off here because accounting and
# xtask take it without its listener; sprawling and citysim name `server`
# themselves, so a feature later added to its default reaches neither.
wire = { package = "sprawling-wire", path = "crates/wire", version = "=0.0.7", default-features = false }
browser = { package = "sprawling-browser", path = "crates/browser", version = "=0.0.7" }
agent_protocols = { package = "sprawling-agent-protocols", path = "crates/agent_protocols", version = "=0.0.7" }
remote_access = { package = "sprawling-remote-access", path = "crates/remote_access", version = "=0.0.7" }
accounting = { package = "sprawling-accounting", path = "crates/accounting", version = "=0.0.7" }
sprawling = { path = "crates/sprawling", version = "=0.0.7" }
desktop = { package = "sprawling-desktop", path = "crates/desktop", version = "=0.0.7" }
desktop_ffi = { package = "sprawling-desktop-ffi", path = "crates/desktop/ffi", version = "=0.0.7" }

# C3 hardening: panicking constructs and silent numeric
# corruption are compile-time errors everywhere; tests relax locally.
[workspace.lints.rust]
unsafe_code = "forbid"
# V5 harnesses live behind cfg(kani); the cfg name is legal, kani itself
# runs in the CI Linux job (no Windows host support upstream).
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
dbg_macro = "deny"
# Added with G-22: with `#[non_exhaustive]` gone from every enum in this
# workspace, a wildcard arm is the remaining way to stop the compiler
# naming a new variant at each reader. The other three close the three
# shapes a decision is erased in: a Result thrown away, a binding with
# no type to check, and a boolean parameter whose meaning is at the
# call site rather than in the type.
wildcard_enum_match_arm = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
fn_params_excessive_bools = "deny"

# Dependencies carry debug info nobody here reads: a backtrace we act on ends
# in our own code, and the frames below it cost bytes in every .rlib and in
# the .pdb of every test binary that links one.
#
# Measured rather than assumed, on one windows-msvc machine, by building
# `cargo test -p sprawling-wire --no-run --all-features` into two empty target
# directories: 1.05 GB without this block against 0.86 GB with it, so 18.4%
# of what one crate's test build writes. Two thirds of the difference is
# .rlib and one third is .pdb - the opposite weighting to the one this block
# first carried. Like every wall-clock and disk figure in this repository the
# number is reported with the machine that produced it and gated by nothing.
#
# Workspace members stay at `debug = 2`, so source-level debugging and
# file-and-line backtraces of our own code are unchanged; only a frame inside
# a dependency loses its line number. The release profile is untouched, so
# nothing about the shipped binary moves.
[profile.dev.package."*"]
debug = false

# crash-only delivery profile
[profile.release]
# `"z"` rather than `3`, on a measurement rather than a preference:
# 6,927,360 B against 11,150,336 B and a median `sprawling --version`
# of 12.85 ms against 13.12 ms, thirty interleaved runs per arm on one
# machine in one sitting. The criterion was written down before the
# readings existed - at least 15% off the size and no more than 10%
# lost on cold start - so the number could not talk anybody into
# anything, and `"z"` passes both halves.
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
