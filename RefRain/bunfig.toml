# Local `bun add` and `bun update` use the same three-day cooldown as
# RefRain's Dependabot version updates in `.github/dependabot.yml`.
# `minimumReleaseAgeExcludes` can lift the wait for a security fix named
# by `name@version`. Frozen installs use the versions in `bun.lock`.
[install]
minimumReleaseAge = 259200

[run]
bun = true
