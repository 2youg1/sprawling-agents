[package]
name = "sprawling-mei"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
publish.workspace = true
description = "Mei, a minimal headless Agent Harness: one persistent python tool, bounded observable output, and a process Face for Calyx or scripts."
keywords = ["agents", "llm", "harness", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "mei"

[[bin]]
name = "mei"
path = "src/main.rs"

[[test]]
name = "cli"
path = "test/cli.rs"

[[test]]
name = "observation"
path = "test/observation.rs"

[[test]]
name = "workspace"
path = "test/workspace.rs"

[[test]]
name = "capture"
path = "test/capture.rs"

[[test]]
name = "acp"
path = "test/acp.rs"

[dependencies]
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
