# cargo-deny config (C12, B.7). Runs in CI; local when installed.
[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    # Unicode-DFS-2016: finl_unicode, through which comrak reads Unicode
    # character categories. The 2016 text of the Unicode licence whose
    # newer text, Unicode-3.0, is listed above; it is as permissive and
    # asks only that the notice travel with the data.
    "Unicode-DFS-2016",
    # CDLA-Permissive-2.0: webpki-root-certs, the platform root-store
    # certificate bundle rustls-platform-verifier uses (reqwest's desktop
    # trust store). A data license for a list of public certificates.
    "CDLA-Permissive-2.0",
    # BlueOak-1.0.0: minimatch, required at version ^10 by eslint itself,
    # by @eslint/config-array and by @typescript-eslint/typescript-estree.
    # OSI-approved in March 2022; permissive, and it grants patent rights
    # that MIT leaves unsaid. A development dependency of the client's
    # lint step, which reaches no user.
    "BlueOak-1.0.0",
]

[bans]
multiple-versions = "warn"
# C12 note: the regex ban is scoped to the kernel decision surface and is
# enforced by review plus kernel lints, not here.
deny = [
    { crate = "openssl-sys", reason = "TLS policy is rustls" },
    { crate = "native-tls", reason = "TLS policy is rustls" },
    # One password KDF for the whole tree, and it is `argon2`
    # (`crates/gateway/Spec.lean` §8-21). A second one is a second answer to "how slow
    # is slow enough", decided by whichever crate a future dependency
    # happened to pick. These three are the ones a person reaches for by
    # habit; a deliberate change replaces the entry rather than adding a
    # dependency beside it.
    { crate = "rust-argon2", reason = "the password KDF is the RustCrypto `argon2`" },
    { crate = "scrypt", reason = "the password KDF is the RustCrypto `argon2`" },
    { crate = "sodiumoxide", reason = "the AEAD is `chacha20poly1305` and the KDF is `argon2`" },
]

[advisories]
yanked = "deny"
# RUSTSEC-2026-0418 (libz-sys build script leaks the environment) and
# RUSTSEC-2026-0420/-0422/-0423/-0424 (the wasmtime 48.0.7 engine and
# wasi socket bugs), all published 2026-11-02, rest until the wasmtime
# rework, which the person has already decided and which clears this
# list by replacing the family, not by renewing the ignore. A patch
# bump of a family about to move would spend release verification on a
# throwaway tree. The engine sits behind the opt-in `wasm` feature of
# `sprawling-runtime`, off the default build; the libz-sys leak is
# build-time. Loosening a gate in the change it is failing carries the
# person's ruling, recorded as `Verdict: user-approved` on the commit.
ignore = [
    { id = "RUSTSEC-2026-0418", reason = "build-time env leak in libz-sys; cleared by the wasmtime rework's lockfile sweep, not worth a throwaway patch bump" },
    { id = "RUSTSEC-2026-0420", reason = "wasip3 UDP in the opt-in wasm engine 48.0.7; the wasmtime rework replaces the family" },
    { id = "RUSTSEC-2026-0422", reason = "i31/nullref panic in the opt-in wasm engine 48.0.7; the wasmtime rework replaces the family" },
    { id = "RUSTSEC-2026-0423", reason = "cross-engine type confusion in the opt-in wasm engine 48.0.7; the wasmtime rework replaces the family" },
    { id = "RUSTSEC-2026-0424", reason = "borrowed-resource memory in the opt-in wasm engine 48.0.7; the wasmtime rework replaces the family" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
