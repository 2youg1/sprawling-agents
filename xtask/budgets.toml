# The performance register. One row per budget the design states, and the
# best reading recorded so far.
#
# `xtask budget` refuses two things: a reading above `budget_bytes`, and a
# reading worse than `best_bytes` by more than `slack_bytes`. The second is
# the ratchet - a number may improve freely and may drift only within the
# slack, so a gradual regression cannot arrive one commit at a time.
#
# A metric is gated only when a machine can measure it the same way twice.
# Wall-clock figures depend on the machine that ran them, so they are
# measured and reported with their machine rather than gated; gating them
# would make a busy runner look like a defect. Each such row says what it
# needs, so nobody has to guess why it is not enforced.

# The reading is the bundle a browser downloads, gzipped, walked
# recursively so every chunk the page loads is on the scale.
#
# 288,972 is this version's reading, and it is two changes rather than a
# drift. **Half of it is two faces**: Geist Sans and Geist Mono ship as
# variable woff2 (145,724 B of the reading, already compressed, so gzip
# takes nothing more off them), because a client whose type stack begins
# with whatever the machine happens to have is a different product on
# every machine. The other half is the screens: one implementation per
# control instead of a class string per view, a model table that can state
# an output ceiling, a keyboard whose chords are data, an MCP page built
# around what a person already knows from another tool, and a city page
# that says what it is showing.
#
# The row's `what` lost its "fonts excluded" clause in the same pass: a
# browser downloads the faces, so a reading that leaves them out reports
# on something nobody receives. The slack is unchanged at 20 KB, and the
# headroom against the 2 MB budget is 7.3x - which is still not where the
# next reading deserves attention.
#
# The earlier readings on this row weighed a WebAssembly client that has
# since left the tree, so none of them is comparable and none is kept.
#
# Reset once more at V0.0.6, and for the same reason: the client the
# browser downloads is no longer the one 288,972 B described. Four
# screens arrived together - the artefact panel beside a conversation,
# the read-only code view with its own lexer, the external-asset
# registry, and the tool-trace summary - and they are 22 KB of the
# 311,050 B recorded here. The ratchet is not being loosened: the slack
# stays at 20 KB, so the next gradual regression is caught exactly as
# before, against a figure that describes what ships today.
# The syntax highlighter (client-SPEC 4-26) is weighed here too, though
# the first screen never downloads it: the directory holds it, and the
# binary embeds every byte the directory holds. It adds 166,127 B
# gzipped - the highlighter chunk 9,918 B and ten grammar chunks from
# 1,067 B to 32,840 B - while the entry chunk lost about 660 B with the
# lexer it replaced. The best reading moves by that difference and the
# slack stays at 20 KB.
# Several screens arrived together once more, each inside the slack on
# its own and 24 KB over it together: the city's runs board and its
# lineage tree, the drawn wire fields, the prefilled recovery form,
# browser notifications, the editor links, the combobox and the empty
# states, with their gallery fixtures. The best reading is what ships
# with them; the slack stays at 20 KB.
[frontend_artifact]
what = "the client the browser downloads, gzipped, the two shipped faces included"
budget_bytes = 2097152
# The bundle the deliverable ships, gzipped, fonts included: the view
# tree carries the storybook and its fixture tables, which ship with
# the client on the `#/gallery` route (client-SPEC §6), and this is
# what the client weighs with them. The register is a ratchet: a
# number may improve freely and drift only within slack_bytes. The
# reading rose by 30 KB when the talk thread, the setup screens, the
# building and monitor views and their gallery fixtures grew by about
# nine thousand lines of view code, none of it dead.
best_bytes = 578422
slack_bytes = 20480
measured_by = "just build-web, then just gates (the whole dist directory, recursive)"
status = "gated"

# The remediation pass found the single-binary promise was hollow: build.rs
# embedded a 1,306-byte placeholder and the real client never shipped. The
# binary now carries the whole gzipped bundle (about +330 KB), and the gate
# refuses a release binary whose file table lacks the client assets, so this
# cannot regress silently. The ratchet holds the line from the first honest
# reading.
# The reading is taken from a freshly linked binary rather than off a stale
# artifact. Two earlier growths are on record and both were bought rather
# than drifted: tokio's `signal` feature, which is what lets a Windows
# console deliver both of its stop signals to a city that must close its
# ledger cleanly - a binary that exits without that is smaller and wrong -
# and the client bundle itself, once build.rs stopped embedding a
# placeholder.
#
# 9,937,920 is this version's reading, 1.26 MB above the last one. What the
# binary gained: a browser it drives over BiDi and the image handling that
# carries a screenshot back as evidence, a doctor that answers what the
# running machine has, a search tool beside `read`, and the compressor that
# fits a tool result into a window. Each is a capability a resident calls,
# not a dependency that arrived unasked. 13.5x headroom against the 128 MB
# budget says the next reading to spend attention on is not this one.
#
# **The ratchet moved on 2026-09-21.** The previous number was taken on
# 2026-09-13 from a tree fourteen commits behind this one, and the
# machine that reads this row now links every MSVC target with
# `lld-link`, a build setting that lives in the machine's own cargo
# configuration rather than in the repository. Which of the two moved
# the figure is not separated here, and it does not need to be: a size
# is a fact about the linker that produced it, which is why this row
# names the platform its reading was linked on. The
# `opt-level = "z"` decision was weighed against this row and taken on
# 2026-09-21; the row records a binary linked the way that decision
# chose.
[release_binary]
what = "the single binary a person installs, with the execution engine its sandbox needs and the web client already inside it"
budget_bytes = 134217728
# The reading rose by 1.3 MB when the console, the health readings and
# the sandbox's file capabilities arrived: crossterm, sysinfo, cap-std
# and memory-stats, with about 28,000 lines of Rust around them.
# It rose by 243,712 B more when the desktop connector moved into this
# binary as the `desktop` verb (sprawling-SPEC.md 8-4d): 12,916,224 B on
# the tree before, 13,159,936 B after, linked the same way. That buys no
# second executable to install and no hand-written [[mcp]] row. The
# separate executable weighed 670,720 B, most of it std, serde_json, toml
# and png, which this binary already carried; what is new is the
# package's own code, the image encoders and the Win32 bindings. The
# slack stays at 1 MiB, which is also the figure that reopens the
# choice to link it here.
best_bytes = 13159936
slack_bytes = 1048576
measured_by = "just build-web, cargo build --release, then just gates, on windows-x86_64"
status = "gated"

# The unit is a production function because the alternative was measured:
# any honest file threshold lights up eight files across four crates at
# once, which is a project rather than a gate. Across 1,800 production
# functions the median is 9 lines, p90 is 39 and p99 is 145, so 200 sits
# well above where the repository actually writes; what it catches is a
# whole flow of control written into one body. `dispatch_in` was 1,069
# lines when R2 opened and is 158 now, in nine cuts.
#
# Not measured, each read from an authority that already exists rather
# than from a list kept beside the gate: an item marked `#[cfg(test)]`,
# and a file whose module-map row states the shape `data`.
[function_length]
what = "one production function, from its `fn` to its closing brace"
budget_lines = 200
measured_by = "cargo xtask length (syn spans, not brace counting)"
status = "gated"

# A long function hides a flow of control; a long file hides where
# anything is. The second is what the person asked for on 2026-09-02,
# after the largest file reached 12,078 lines and iteration on it began
# costing more than the split would.
#
# Tests count. A `#[cfg(test)] mod tests` is exempt from the *function*
# rule, because a long test is a different question from a long body -
# but a reader looking for one thing pays for every line above it either
# way, and in the file that prompted this rule the tests were 6,133 of
# the 12,078.
# "The ideal number of arguments for a function is zero. Next comes one,
# followed closely by two. Three arguments should be avoided where
# possible. More than three requires very special justification - and
# then shouldn't be used anyway." A long parameter list is a data clump:
# the values that always travel together are one value that has not been
# given a name yet, and this repository already contains the fix it is
# asking for. `Reporter` says it in its own doc - "Four values that
# always travel together and are never chosen independently, so they
# travel as one".
#
# The budget is 4 rather than Bob's 3, because 3 is the number a
# constructor for a three-field value legitimately needs and the gate
# should not argue with those.
[argument_count]
what = "one function's parameters, not counting a receiver"
budget_arguments = 4
measured_by = "cargo xtask length (syn signatures)"
status = "gated, with a register of the signatures that predate the rule"

# The signatures that predate the rule (2026-09-02), worst first. A name
# not on this list is refused outright, so the list cannot grow; a
# signature is struck from it by giving the values that travel together a
# name, never by widening the budget. How many remain is what the list
# below says; a count written here as well would be the second home of a
# number this file already states, and it was wrong within four commits
# of being written.
#
# The register cleans itself. `cargo xtask length` reports a name that
# has come back inside the budget, and a name that is no longer in the
# tree, in the same words the file register and `boundary`'s use — so an
# exception disappears when it is spent instead of silently re-excusing
# whatever is written at that address next.
#
# Sixteen of the original forty-two were in `bin::assembly`, and so were
# the worst six. That was the file rule's finding reached from another
# direction: the module is declared `adapter` - "thin, no policy" - and
# held the city's dispatch policy instead, and an eleven-parameter
# private method is what policy looks like when it has no object to live
# in. Fifteen of them were spent splitting that file, because putting it
# `assembly/` would otherwise have carried each excuse to a new address -
# which is the one budgets.toml edit `guard` will not treat as a strike.
[argument_count.predating]
names = [
  "crates/collab/src/workshop.rs::new",            # 9
  "crates/collab/src/inbox.rs::new",               # 7
  "crates/collab/src/signal_tool.rs::new",         # 6
  "crates/runtime/src/turn.rs::assemble",          # 6
  "crates/accounting/src/effect.rs::of",            # 6
  "crates/accounting/src/effect.rs::shelf",         # 6
  "crates/browser/src/act.rs::frame_for",          # 5
  "crates/city/src/archive.rs::entry",             # 5
  "crates/collab/src/pr_tool.rs::new",             # 5
  "crates/kernel/src/config.rs::freeze",           # 6  # 5→6: the second-rung ladder is the sixth concern of kernel-SPEC 8-22
  "crates/runtime/src/digest.rs::digest_once",     # 5
  "crates/runtime/src/fork/lineage.rs::fork_draft",        # 5
  "crates/runtime/src/handoff.rs::new",            # 5
  "crates/runtime/src/run.rs::drive",              # 5
  "crates/runtime/src/turn.rs::call",              # 5
  "crates/sprawling/src/console/terminal.rs::drive",  # 5
]

# **Re-priced from 1000 to 400 on the person's ruling, 2026-09-05.** The
# 1000-line line was drawn against a tree whose largest file was 12,078
# lines, and it did what it was drawn to do: the register it arrived with
# emptied, and `bin::assembly` went from 10,695 lines to an `assembly/`
# directory. A budget whose register is empty has stopped being a budget -
# it now permits every file in the tree - and the reader it was drawn for
# is no longer only a person. A file is read into a model's context whole,
# and 400 lines is where a module still arrives as one unit next to the
# other files a change has to be read against.
#
# The new line lights up 97 of the 250 files it measures. That is the
# project the previous re-pricing named and deferred, and it is deferred
# again on the same ruling: **the register below is the backlog, worst
# first, and working it off is the next version's P0.** What is bought
# today is the ratchet - nothing new may be born over 400 lines, and
# nothing already over it may grow.
[file_length]
what = "one source file under a crate's src/ or under client/src, every line of it, tests included"
budget_lines = 400
measured_by = "cargo xtask length"
status = "gated, with a register of the files that predate the rule"

# The files that were already over the line on the day it was re-drawn
# (2026-09-05), each pinned at the length it had that day, worst first.
# Ninety-seven of them on that day; the last row was struck on
# 2026-09-08, and the Rust half of the table below is empty by
# construction - it keeps its three properties over nothing.
#
# **The client arrived on 2026-09-19**, when `xtask length` reached
# `client/src`. The 400-line rule had been stated for the whole
# repository and executed on Rust only, so 18,000 lines of TypeScript
# were read by the same two readers with nothing holding the line - the
# six rows below are what that cost, and they are pinned at the length
# each file had on the day the gate reached it. They carry the same
# three properties every other row does, and they are worked off the
# same way: by splitting the file, never by raising its number.
#
# `client/src/wire.ts` (2,445 lines) is not here and never will be.
# `cargo xtask wire-ts` writes it from the Rust wire, so its length is a
# fact about the generator; the gate reads the exemption from the banner
# the generator puts at the top rather than from a path written here.
#
# `xtask/src/length.rs` is on this list, which is correct: the gate that
# states the rule is not exempt from it.
#
# This list has three properties, and it needs all three to be an
# honest debt rather than a licence. A file it does not name is refused
# at budget_lines outright, so **it cannot grow**. A file it does name
# may not exceed its pin, so **no offender grows**. And a file that comes
# back under budget_lines must be struck from the list, so **it removes
# itself** as the work gets done.
#
# Delete a row by doing the split, never by raising its number.
[file_length.predating]
# Empty. The one entry this register held (`talk/composer.tsx = 478`) was
# struck when the Solid client retired with the port; a stale entry is
# refused by the gate, which is exactly how the list stays honest.

# White box is Rust, black box is Lean (the person's ruling).
# `cargo xtask boundary` refuses a Rust check that reaches this product
# across a process boundary; `adversary/` is where such a check belongs,
# in a language with none of this repository's vocabulary, so it can
# testify about a client that shares none of its assumptions.
#
# Nothing predates the rule any longer. `crates/wire/tests/enrolment.rs`
# used to stand up the enrolment endpoint on a loopback port and write
# the HTTP request out by hand; what it checks - three fates of one
# credential, told apart by a worker the test stands in for - is a
# white-box question, so it now drives the router in process
# (`tower::ServiceExt::oneshot` with axum's `MockConnectInfo`) and
# crosses nothing. The black-box half it could not honestly carry - a
# real vault on a real machine - stays out of `adversary/` too, because
# a served city writes to the platform credential service and the wire
# has no verb that takes a credential back. A file this list does not
# name is refused outright, so the register stays empty by construction.
#
# `crates/sprawling/src/assembly/driving.rs` is deliberately absent. Its
# sockets reach a fake model provider the test stood up, never this
# product, and its three lines carry `boundary-ok:` with that reason. A
# waiver is right there and a register row would be wrong: the debt is
# not one anybody intends to pay.
[boundary]
what = "a Rust check that reaches this product across a process boundary"
measured_by = "cargo xtask boundary"
status = "gated, with a register of the files that predate the rule"

[boundary.predating]
files = []

# Which platforms a release publishes for, and what each archive is
# called, is stated once in `xtask/src/platform.rs`. The workflow matrix,
# the two install scripts and the npm shim each restate it in another
# language, and `cargo xtask artifact` holds all four to that table:
# `install.sh` had come to offer a suffix the matrix never produces, and
# only the shim was ever compared against anything.
#
# The register records an archive name a file spells out that no release
# builds. It holds one row, and that row is a decision somebody else has
# to make: `install.sh` offers `-linux-x86_64.zip` "for a gnu build that
# may join it later", and no such build exists, so a Linux machine is
# told to look for an asset the matrix cannot produce. Striking it is a
# one-line edit to a file outside this change-set. The register cleans
# itself in both directions: the row goes when a platform row claims that
# suffix, and it goes when nobody spells it any more.
[archive_naming]
what = "the suffix every archive a release publishes ends with"
measured_by = "cargo xtask artifact (the table in xtask/src/platform.rs)"
status = "gated, with a register of the names spelled before the rule"

[archive_naming.predating]
suffixes = ["-linux-x86_64.zip"]

# One row per scenario `just mem` serves. The 3, 100k and 400k-record
# fixture cities (the ones bench_startup keeps in target/bench-cities)
# have no row until `just mem --city <dir>` has read each of them.
[resident_empty_idle]
what = "a served empty city's private memory, idle past its startup fold, in this platform's own counter"
budget_bytes = 31457280
best_bytes = 2469888
slack_bytes = 2097152
measured_by = "just mem"
status = "measured, not gated: private 2,469,888 B, peak private 2,469,888 B, working set 8,331,264 B on windows-x86_64, 16 cores, NVMe (release). The counter differs per platform, so one number cannot mean the same thing on three of them"

[kernel_mutation]
what = "the share of kernel mutants the tests kill"
minimum_percent = 90
measured_by = "just mutants"
status = "gated by just mutants, not by just check: a full mutation run is minutes, and a gate nobody waits for is a gate nobody runs"

[ledger_append]
what = "append plus fsync, p50 and p99"
budget_p50_ms = 5
budget_p99_ms = 20
measured_by = "just bench (citysim bench bin, release)"
status = "measured, not gated: p50 0.562 ms / p99 0.838 ms on windows-x86_64 NVMe (2026-09-02, after the segment stopped being reopened per write; 1.047 / 1.879 ms before it); batched append_all moves about 335k records/s. A wall-clock figure is the machine's, so it is recorded, never gated"

# What one durability barrier costs per record as the batch under
# it grows. The absolute figures belong to the disk class they were
# read on; the ratio between the rows is a fact about the design, and
# it is the reason `Ledger::append_all` exists: a barrier is a fixed
# cost, so a wave of fifty records is very nearly the price of one.
#
# Production writes through that batch: the serving relay drains every
# draft that arrived while the previous barrier ran and appends them
# with one `append_all`, so a busy city pays a row far below the top
# one and a quiet city pays the top row. `RealFs` holds the segment
# handle across the append and the sync, the way `LineReader` does on
# the read side, so no `CreateFile` sits under a record.
[durability_barrier]
what = "one fsync barrier, amortised over the records under it"
measured_by = "just bench (citysim bench bin, release)"
status = "measured, not gated: 562.4 us/record at one record per barrier, 57.3 at ten, 17.0 at fifty (windows-x86_64 NVMe, 2026-09-02, 200 waves per row). Of the 562 us, 2.5 us is the write and the rest is the barrier itself. A wall-clock figure is the machine's, so it is recorded, never gated"

# Opening yesterday's session: the whole of what `bin::assembly`'s
# `run_history` does, over the same public faces it calls - refresh the
# resident index, name the newest `limit` sequences that session wrote,
# read those lines, parse them. The socket and the JSON frame are left
# out because they are the same for every query and would hide what this
# measures.
#
# The fixture is a city that has been working: fifty thousand records,
# eight interleaved sessions, and the question asked about the oldest of
# them. Before the index existed, the same question on the same fixture in the same
# process measured 27.6 ms, because the answer was found by reading every
# line back from the tail and discarding what belonged to somebody else.
# What is left is almost entirely the cost of parsing the 500 records that
# are the answer, which no index can remove.
[run_history]
what = "one session's newest 500 records, out of a ledger holding eight sessions"
measured_by = "just bench (citysim bench bin, release)"
status = "measured, not gated: p50 3.311 ms against 27.6 ms before the index (windows-x86_64 NVMe, 2026-09-02, 50,000 records, 50 rounds). A wall-clock figure is the machine's, so it is recorded, never gated"

[prefix_assembly]
what = "assembling one frozen prefix"
budget_ms = 1
measured_by = "just bench (citysim bench bin, release)"
status = "measured, not gated: p50 0.022 ms for 16.5 KB over four slots on windows-x86_64 (2026-08-22)"

# What one query pays for the appends that arrived since the last one.
# `Views` refreshes the resident index before every history query, so a
# city that just wrote a record charges this to the next reader.
#
# The reading is the byte count `LedgerIndex::refresh` returns, which is
# the whole difference between seeking to the tail and lifting the
# segment that carries it: both fold the same records and answer the
# same queries, and only one of them costs the length of the ledger. A
# segment rolls at 64 MiB, so the reading a whole-segment read would
# give is bounded by that, while the reading below is bounded by the
# records that actually arrived.
#
[index_refresh_read]
what = "bytes read by one LedgerIndex::refresh that folds a single appended record"
measured_by = "cargo test -p sprawling-storage --lib -- --nocapture a_refresh_reads_the_appended_tail_rather_than_the_segment (the test prints the Refreshed::Appended reading beside the segment length)"
status = "measured, not gated: 191 B read out of a 76,180 B segment, which is the one appended record and nothing else (2026-09, 401-record fixture). The test asserts the equality rather than a threshold, so a gate here would be a second authority over the same claim"

# One rules lookup the read bound makes when a model-chosen path lands in
# another building. `city::RulesCache` keeps what a run read while the
# file's modification time and length hold, so a repeat costs one stat
# instead of a read and a TOML evaluation. On Windows the stat opens a
# handle, which is the floor of this design.
[rules_lookup]
what = "ns per rules lookup for another building, a fresh city::load against city::RulesCache::load, alternating rounds"
measured_by = "cargo test --release -p sprawling-city --lib rules_lookup_reading -- --ignored --nocapture"
status = "measured, not gated: median of 15 rounds of 2000, three runs, load 186,793-212,885 ns against cache 76,112-91,730 ns (release test profile, Windows NTFS, sixteen cores shared by eight build lanes)"

# Read amplification on a range retrieval: the bytes a `Vfs` hands back
# while `Cas::get_range` answers, over the bytes in the answer.
#
# The retrieval that motivated the row is a small window into a large
# offloaded object, where lifting the object and re-hashing it charged
# the whole object per window. `B` now costs the window; `L` costs the
# bytes before the line it names, because line numbers can only be found
# by counting newlines from the front.
#
# Not gated: the test asserts the readings directly (a five-byte range
# must move five bytes, a line near the front one scan chunk), so a gate
# here would be a second authority over the same claim.
[cas_range_read]
what = "bytes a Vfs returns while Cas::get_range answers, over the bytes in the answer"
measured_by = "cargo test -p sprawling-storage --lib -- --nocapture a_range_read_lifts_the_range_rather_than_the_object (FaultFs::bytes_read deltas around each retrieval)"
status = "measured, not gated: on a 5,888,890 B object a five-byte `B` range moves 5 B and line 2 moves 65,536 B, against 5,888,890 B for the verifying full read (2026-09). Before this row existed both range reads moved the whole object and re-hashed it"

# How much of one message this city reads from an MCP server before it
# refuses. A server named in `CONFIG.toml` is an outside party, its
# output is untrusted input, and the process reading it is also the
# city's only writer - so a message with no end is not a slow tool call
# but an interrupted history.
#
# The figure is derived rather than chosen: `IMAGE_MAX_BYTES` is 2 MiB,
# base64 grows it to 2,796,203 B, and 8 MiB leaves a tool result room
# for such a picture, its text and the JSON-RPC envelope, with 3x over
# the largest payload the city already accepts.
#
# Not gated by `xtask budget`: the number is a constant in the source
# rather than a reading off a build, and `agent_protocols::mcp::reading`'s
# tests assert both edges of it - a message of exactly the ceiling is
# read, one byte more is refused with the ceiling named. A gate here
# would be a second authority over the same claim. The one home is
# `agent_protocols::mcp::MESSAGE_CEILING`; this row records the reading and the
# reasoning, never a second copy of the value that decides.
[mcp_message_ceiling]
what = "one message read from an MCP server over stdio, before its framing newline"
measured_by = "cargo test -p sprawling-agent-protocols --lib reading (a_message_at_the_ceiling_is_read and a_message_above_the_ceiling_is_refused_with_the_ceiling_named)"
status = "measured, not gated: 8,388,608 B, refused whole rather than truncated, and the connection ends because the unread remainder of a refused message is indistinguishable from the next one (2026-09). Before this row existed the stdio reader grew one String until the machine ran out"

# --- What K-05 and K-07 asked for, and what already had a home --------
#
# Four readings were proposed: the p99 of a ledger append, a view
# rebuild priced per megabyte, the work a dispatch does before a model
# is called, and how many packages this tree resolves. Only three rows
# are below.
#
# **The p99 of an append is not among them, because it already has a
# home.** `[ledger_append]` states `budget_p99_ms` and carries the
# reading; a row named `ledger_append_p99` would be a second place to
# state one number, and the two would be edited on different days by
# different people. Price the append where the append is already
# priced.

# What a rebuild of every view costs, denominated in the thing that
# actually varies. A record is not a fixed size, so records per second
# answers "how fast did this fixture fold" and not "what will
# rebuilding my city cost"; a person with a 400 MB ledger can multiply
# a per-megabyte figure and cannot multiply a per-record one.
#
# **One rebuild, one row.** The cold view this figure used to share the
# subject with is gone with `storage::projection`, so the per-record row
# went with it: the views a city rebuilds today live in the process.
#
# The denominator removes the fixture's size from the figure, which is
# what made the rows above it facts about a machine rather than about
# the design. The reading exists and the ceiling does not: `xtask
# budget` reads two units, bytes and packages, and gating this row is
# that unit's work, not the reading's.
#
# **One reading, one home.** The large-ledger fold of `just bench` is
# this same rebuild under the registered fixture, so its p50/p95/p99
# live here and ARCHITECTURE.md quotes them through `cargo xtask docnum`
# (`budget_figure:views_rebuild_per_mb.<field>`) rather than typing a
# second copy.
[views_rebuild_per_mb]
what = "milliseconds to rebuild every view, per megabyte of ledger folded"
measured_by = "just bench (citysim bench bin, release), over a ledger large enough that the fold rather than the open dominates: the bench writes 50,000 records into a scratch city and drives the whole production rebuild through `sprawling::ask`, which verifies the chain, parses every line and folds it into every view before answering one CityView"
fold_records = 50000
best_p50_ms = 2759
best_p95_ms = 3765
best_p99_ms = 3765
status = "measured, not gated: windows-x86_64, 16 cores, NVMe, release, 5 rebuilds of the registered fixture (`bench::scenarios::REGISTERED`). The per-megabyte figure is best_p50_ms over the ledger's size, which the bench does not print yet; a ceiling waits on `xtask budget` learning a time unit"

# What a dispatch spends before the model is called: opening the room,
# writing the brief, standing the run up, and assembling the tools -
# including, today, starting every MCP server this building declares
# and shaking hands with each of them. All of it runs on the accounting
# thread, so it is time during which no lane's append is served.
#
# **Measure first, gate later, and the order is the point.** K-05
# proposes keeping MCP connections open across dispatches; a ceiling
# written before the reading exists would be a guess that either passes
# trivially or blocks the change that fixes it. What this row buys
# today is that the reading gets taken and recorded where the next
# person will find it.
[prepare_dispatch_ms]
what = "one dispatch, from the command arriving to the lane taking the drive, on the accounting thread"
measured_by = "the instrument is two clock reads around `stage_dispatch` (crates/sprawling/src/assembly/dispatching/running.rs) and two more around `Laying::mcp_tools` (crates/sprawling/src/assembly/workbench/servers.rs), which runs in the lane that drives the run (sprawling-SPEC.md 8-93), written out at `Level::Trace` through the city's own clock - the same shape `assembly/credentials/probing.rs` uses to report `elapsed_ms`, which is why no new sampling point was sanctioned for it. Read it off `a_dispatch_says_what_it_spent_before_the_drive` (cargo nextest run -p sprawling --release -E 'test(a_dispatch_says_what_it_spent_before_the_drive)' --no-capture), or off any served city running at that floor"
status = "measured, not gated: 58 ms median on windows-x86_64, 16 cores, NVMe (2026-09-21, release, four runs: 50, 50, 51, 66; ~70 ms unoptimized when idle), for a dispatch into a fresh city with **no MCP server declared** - so this figure is the floor, and the `mcp_tools` line beside it read 0 ms over 0 servers in every run. The two lines are reported apart because a resident connection table (K-05) removes only the second, and the reading is K-05's own verdict: at 0 ms the table saves nothing, so it stays unbuilt until a served building declares servers and the second line shows them dominating. Not gated - a wall-clock reading is the machine's, and this one also depends on how many MCP servers a building declares"

# T14's four-action pressure reading (deepening plan section 3 T14): the
# first path a person walks - install, start, raise a city, open a session
# - priced at its own boundary. Each action owes three pieces: whether its
# tail fits the second tier (p99 <= 1 ms), the limit reading, and the
# dominant cost. Optimisation is a later wave; these are readings.
#
# **No action reaches the second tier.** The closest, `open_session`, is
# seven times outside it at p99 and the furthest, `install`, is thirteen
# thousand. For two of the four the machine's on-access scanner rather
# than the product is what the boundary mostly prices, which is a fact
# about this class of machine and the reason these rows are measured
# rather than gated.
#
# **The spread between two runs is wider than anything these actions have
# changed.** An earlier run of this same logic read `startup` at p50
# 100.661 ms and `open_session` at p99 49.884, against 26.290 and 7.230
# below. One reading of this family is one sample of a machine, and a
# later reader comparing two of them compares two machines' worth of
# scheduling as much as two revisions - so a row here records what was
# seen, never what is promised.
#
# Every action reports a floor beside its middle. The floor is what the
# action costs while the machine is quiet; the peak is what the machine's
# other work cost the sample that met it. `suspicious` counts the samples
# above three times the middle - flagged and never removed, because a
# reading that hid its tail would describe a machine nobody has.
#
# `just bench-startup` is the only instrument. It builds the client
# bundle and the release binary first, so the archive the install action
# unpacks was built from the tree under test and no run is driven by a
# stale artifact. T14's two red lines hold in every row below: the digest
# stays inside the install boundary, and no fsync was removed to move a
# number.
[install]
what = "the archive in place to the unpacked executable answering `version`: digest, unpack, launch"
measured_by = "just bench-startup (citysim bench_startup bin, release), 200 samples, p50/p95/p99 nearest-rank over all of them"
status = "measured, not gated: p50 2500.477 ms, p95 8143.716, p99 12877.433; floor 1440.964, peak 14654.704; 13 of 200 above three times the middle, at #38 #44 #58 #65 #66 #71 #72 #73 #74 #77 #78 #79 #80 (windows-x86_64, 16 cores, NVMe, 2026-09-24). Four orders of magnitude outside the second tier. **Dominant: `launch`**, 2330.106 ms of the 2500.477 ms middle, because the unpacked 6,886,400 B executable is a file the on-access scanner has never seen - so this boundary prices the scanner as much as the install. The product's half is 155 ms of the same middle: 147.052 ms to inflate the 3,646,091 B archive and write its member, 8.117 ms to SHA-256 those bytes. One process and one file per sample, no barriers"

[startup]
what = "`CreateProcess` sent to the light command's exit observed: create, run"
measured_by = "just bench-startup (citysim bench_startup bin, release), 200 samples"
status = "measured, not gated: p50 26.290 ms, p95 29.840, p99 31.298; floor 22.412, peak 1031.043; 1 of 200 above three times the middle, at #0 (windows-x86_64, 16 cores, NVMe, 2026-09-24). Thirty times outside the second tier and the tightest tail of the four. **Dominant: `run`**, 20.686 ms of the 26.290 ms middle against 5.343 ms for the spawn call itself. The one suspicious sample is the first: a cold 6,886,400 B image costs 1031.043 ms where the warm floor is 22.412 ms, so on this machine the first start of an installed binary is forty-six times the steady state and the second start is not. One process per sample, no files, no barriers"

[raise_city]
what = "`assembly::init_city` called to the genesis record on disk, its barrier included"
measured_by = "just bench-startup (citysim bench_startup bin, release), 200 samples"
status = "measured, not gated: p50 94.570 ms, p95 106.497, p99 115.862; floor 62.545, peak 175.839; none of the 200 above three times the middle (windows-x86_64, 16 cores, NVMe, 2026-09-24). A hundred times outside the second tier. No sub-step split: one would have to be instrumented inside the product, and T14 prices the path a person walks rather than one built for the bench, so the dominant cost is **attributed rather than measured**. One sample writes 9 files and 3 barriers, and 3 barriers at the `durability_barrier` row's 562.4 us/record floor is about 1.7 ms of the 94.570 ms middle. The other 93 ms is creating the tree and reading the config layers, which is where a second reading should look. 0 processes per sample"

[open_session]
what = "`Command::OpenSession` arriving to the call returning, `session_opened` on disk"
measured_by = "just bench-startup (citysim bench_startup bin, release), 200 samples"
status = "measured, not gated: p50 4.796 ms, p95 5.574, p99 7.230; floor 4.051, peak 27.509; 1 of 200 above three times the middle, at #0 (windows-x86_64, 16 cores, NVMe, 2026-09-24). Seven times outside the second tier, and the closest of the four to it - which is what the plan predicted before anything was measured. No sub-step split, so the dominant cost is attributed rather than measured: one sample writes 2 files and 1 barrier, and that barrier is about 0.6 ms of the 4.796 ms middle, so the cost sits in the room rather than in fsync. 0 processes per sample"

# How large this tree's dependency graph is, counted off the resolved
# lockfile rather than off any manifest: a manifest states what was
# asked for, and what a person compiles is what the resolution settled.
#
# **One count, three readers.** `budget::lockfile_packages` takes it;
# `docnum`'s `dependency_count` fact quotes it into `ARCHITECTURE.md`
# and `docs/third-party.md`; this row prices it. The number used to sit
# in four documents at four different values, none of them right, which
# is the whole reason it is measured rather than written.
#
# Gated, and the only gated row here that needs nothing built: a
# lockfile is in every checkout. The budget is a decision rather than a
# measurement, and the decision is that this graph may grow by about
# one substantial dependency's transitive closure before somebody has
# to say why in writing. The slack is about what one small crate brings
# with it, so a routine addition is recorded rather than refused, and a
# wave of them is refused rather than recorded.
# The resource-bottleneck work added one such wave on purpose: sysinfo
# for the measured memory and core count the heavy-command pool is sized
# from, thread-priority for the core's own scheduling class, cpu-time and
# memory-stats for the performance monitor's own readings, cap-std for
# installing a skill package through directory handles, and crossterm
# for the terminal views. Each
# is the safe-Rust face of a platform call the code would otherwise make
# through `unsafe`, which the workspace forbids; together they bring 52
# packages, most of them the Windows bindings two of them share. The
# budget moves to hold them with the same headroom it had before; the
# slack is unchanged.
[dependency_count]
what = "packages in Cargo.lock once every transitive dependency is resolved, workspace members included"
budget_packages = 472
best_packages = 441
slack_packages = 16
measured_by = "cargo xtask budget (budget::lockfile_packages, counting [[package]] in Cargo.lock)"
status = "gated"

# T13: where the two latency tiers are stated. One latency metric in two
# stages: the first is p95 inside one frame's budget (a person sees no
# delay), the second is p99 tighter still and covering the first (an
# agent waits on nothing this harness does). Stages, not two percentiles
# of one distribution: on one distribution p99 >= p95 holds, so a claim
# of "p95 16 ms and p99 1 ms" over one sample would be false by
# construction. The second stage is reached after the first one is.
#
# The sub-metric split is what keeps a disk's floor from masking harness
# overhead (citysim-SPEC.md section 8-6): `harness` carries no durability
# commit and is the only sub-metric these tiers price; `whole` is disk
# work whose seam does not split and gets no tier. Multi-run parallel is
# read by `[relay_round_trip]`, where the `store=memory` line is the
# harness and the gap to `store=disk` is the disk. The target values
# live here and nowhere else; the readings and their machine class live
# in the performance book in ARCHITECTURE.md.
#
# Ratchet: under the registered fixture a reading only goes down. A
# relaxed tier or a fattened fixture lands in a commit of its own.
[local_latency]
what = "the harness's own processing latency over the four load scenarios, one metric in two stages"
stage_one_p95_us = 16000
stage_two_p99_us = 1000
scope = "sub-metric `harness` only, and the `store=memory` line of `[relay_round_trip]` for multi-run parallel; `whole` carries no tier (citysim-SPEC.md section 8-6)"
measured_by = "just bench, release: the citysim bench bin gives one reading line per scenario and sub-metric for three scenarios, and `instrument_relay_round_trip` gives multi-run parallel; each line carries its machine class"
status = "staged targets, not gated: a wall-clock figure is the machine's. Baselines sit in the ARCHITECTURE.md performance book. Under the registered fixture a reading only goes down; relaxing a tier or fattening the fixture lands in a commit of its own"

[relay_round_trip]
what = "one relay append from a lane to the accounting thread and back, while a run is in flight, with `attend` as the city runs it"
measured_by = "cargo nextest run -p sprawling --run-ignored only -E 'test(/::instrument_relay/)' --no-capture (crates/sprawling/src/assembly/driving/tests/instruments.rs, sprawling-SPEC.md 8-84), 200 samples per store"
status = "measured, gated at p50 <= 1 ms on the memory store only: unoptimized build, windows-x86_64, 16 cores, three other builds running beside it. Polling loop before the one queue: store=disk p50 31198 us, store=memory p50 31313 us, both the two timed waits. The one queue: store=memory p50 45 us against 29 us for the store's own append with no crossing; store=disk p50 2351 us, floor 1458 us, which is the device's fsync, a physical floor. The release reading and the 10 us memory target are not yet taken"

# The wall time of a tool wave whose leading calls only read. The
# concurrent-wave test judges the behaviour (every read of the wave in
# flight at once, and the serial ledger byte for byte); how long the wave
# takes is the machine's, so it is recorded here and never asserted.
[tool_wave_reads]
what = "one wave of three read calls of 50 ms each, from the first call started to the last result accounted"
measured_by = "not instrumented: taken with a wall-clock bound before that bound became the rendezvous check, which now lives in crates/runtime/tests/run_driver.rs"
status = "measured, not gated: serial 153.0 ms; concurrent 51-60 ms on an idle machine and 82.8 ms under a merge-train build (debug build, windows-x86_64, 16 cores). A wall-clock figure is the machine's, so it is recorded, never gated"

# What the client pays to fold one animation frame of stream into the
# belief, with one subscriber reading the run table the way the views do.
# A fold that told subscribers once per record paid the table's length
# once per record; `belief.batch` tells them once per frame, and a token
# into a run the `$state` table holds tells them nothing at all.
[client_fold]
what = "one animation frame of 50 token deltas folded into a belief of R runs, one subscriber reading the run table"
measured_by = "bun test --conditions=browser client/src/core/belief/fold_cost.test.ts (the frame test prints one client_fold line per R and holds the subscriber to one read per city answer; the delta test holds R=1e4 within 5x of R=1e2 in the same run)"
status = "measured, not gated here: per frame with the `$state` run table 30-37 us at R=1e3 and 30-54 us at R=1e4, and 30 us at R=1e2 once warm (the first size measured pays the runes runtime warm-up, 94-330 us), against 29-34 us, 58-73 us and 471-539 us with belief.batch alone, interleaved on the same instrument (x86_64 desktop class). A wall-clock figure is the machine's, so this register records it and the test guards only what every machine agrees on: the read count and the ratio between two sizes"

# What the page pays to read one event frame off the socket. Event and
# delta frames arrive once per ledger record and once per token, so they
# skip the Effect schema for JSON.parse and a narrow guard taken from it
# (client-SPEC 4-6); the schema path is measured beside it so the gap the
# guard buys stays visible.
[client_frame_decode]
what = "one event frame decoded from its text, by the hot decoder and by the Effect schema it stands in for"
measured_by = "cd client && bun scripts/frame_cost.ts (prints one client_frame_decode line: the fastest of 15 batches of 2000 decodes, per path)"
status = "measured, not gated: hot 1.8-3.9 us against 16-28 us for the schema path, interleaved on the same instrument (x86_64 desktop class, 16 cores). The same floor read 3.7-8.6 us with 32 busy loops beside it, so a wall-clock bound held as a unit test failed on a loaded machine; the register records the reading and nothing gates it"

# What one streamed token costs the page while a reply is still arriving
# (T12): script plus the layout the token forces. The raw shape drew the
# whole growing text in one pre-wrapped node and laid it out as blocks
# only when the record took over, so each token re-laid the whole reply
# and the turn jumped at the end. The block shape (`talk/saying.svelte`)
# lays out each block as it closes and keeps only the open tail as text.
# Headless Edge rounds its clock to 0.1 ms, so the mean over every token
# carries the finer figure. Not gated: a wall-clock reading is the machine's.
[stream_relayout]
what = "one streamed token in a live turn: script plus forced layout, and how far the turn jumps when the record takes over"
measured_by = "cd client && bun scripts/relayout.ts - headless Edge, a 2,753-character reply with lists, tables, code and headings in 689 four-character tokens, 7 interleaved rounds of each shape"
status = "measured, not gated: on windows-x86_64, 16 cores, NVMe, three runs each - raw shape mean 426-441 us, p99 1.0 ms, takeover 3.8-4.3 ms, jump 793 px; block shape mean 72-80 us, p99 0.5-0.6 ms, takeover 2.5-2.8 ms, jump 0 px"

# What the city pays, in results-only mode, to sort its runs into the
# three outcomes a person acts on and keep the newest few of each. The
# page then draws at most three times `FIRST` rows, so this triage is
# the only part of the frame that grows with the city.
[city_results]
what = "one triage of a 200-run city into waiting, failed and done, each cut to its FIRST newest (client/src/core/results.ts)"
measured_by = "bun test --conditions=browser client/src/core/results.test.ts (prints one city_results line and holds a triage to 1600 us, a tenth of a 16 ms frame)"
status = "measured, not gated here: 45-124 us per city across three runs (x86_64 desktop class, other builds running beside it). A wall-clock figure is the machine's, so this register records it and the test guards only what every machine agrees on: the read count and the ratio between two sizes"
